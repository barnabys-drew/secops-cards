<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Spaced-repetition flashcards for security engineering: AI security, cloud IR, Terraform, detection engineering.">
<meta name="theme-color" content="#0f1419">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SecOps Cards">
<title>SecOps Cards</title>
<style>
  :root {
    --bg: #f4f6f8; --surface: #ffffff; --surface-2: #e9edf1; --ink: #14202b; --ink-dim: #5a6a78;
    --rule: #d3dbe2; --accent: #0b7a50; --accent-ink: #ffffff; --again: #b3261e; --hard: #8a5a00;
    --good: #0b7a50; --easy: #1457a8; --focus: #1457a8; --code: #e9edf1;
    --pad: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1419; --surface: #18202a; --surface-2: #212b37; --ink: #e8eef4; --ink-dim: #9aabba;
      --rule: #2c3947; --accent: #50c88c; --accent-ink: #06210f; --again: #ff8a80; --hard: #f0b94d;
      --good: #50c88c; --easy: #7db4ff; --focus: #7db4ff; --code: #212b37;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1419; --surface: #18202a; --surface-2: #212b37; --ink: #e8eef4; --ink-dim: #9aabba;
    --rule: #2c3947; --accent: #50c88c; --accent-ink: #06210f; --again: #ff8a80; --hard: #f0b94d;
    --good: #50c88c; --easy: #7db4ff; --focus: #7db4ff; --code: #212b37;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 680px; margin: 0 auto; padding: 20px var(--pad) calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.6rem; margin: 8px 0 2px; letter-spacing: -0.01em; }
  h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-dim); margin: 28px 0 8px; }
  .sub { color: var(--ink-dim); margin: 0 0 16px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .btn {
    min-height: 48px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--rule);
    background: var(--surface); font-weight: 600;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 100%; }
  .btn.primary[disabled] { opacity: 0.45; cursor: default; }
  .btn.ghost { background: transparent; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0; }
  .stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 12px; }
  .stat b { display: block; font-size: 1.5rem; line-height: 1.1; }
  .stat span { font-size: 0.78rem; color: var(--ink-dim); }
  .deck {
    width: 100%; text-align: left; display: block; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 12px; padding: 14px; margin-bottom: 10px; min-height: 48px;
  }
  .deck .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .deck .t { font-weight: 650; }
  .deck .d { color: var(--ink-dim); font-size: 0.85rem; margin: 2px 0 8px; }
  .pill { font-size: 0.78rem; color: var(--ink-dim); white-space: nowrap; }
  .pill b { color: var(--accent); }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .topbar .btn { min-height: 40px; padding: 6px 14px; }
  .count { color: var(--ink-dim); font-variant-numeric: tabular-nums; }
  .card {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; padding: 20px;
    min-height: 220px; display: flex; flex-direction: column; gap: 14px;
  }
  .chip { align-self: flex-start; font-size: 0.75rem; color: var(--ink-dim); border: 1px solid var(--rule); border-radius: 99px; padding: 2px 10px; }
  .q { font-size: 1.2rem; font-weight: 600; white-space: pre-wrap; overflow-wrap: anywhere; }
  .a { border-top: 1px dashed var(--rule); padding-top: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  code { background: var(--code); border-radius: 5px; padding: 1px 5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .grades button { min-height: 60px; border-radius: 12px; border: 2px solid var(--rule); background: var(--surface); font-weight: 650; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
  .grades small { font-weight: 400; color: var(--ink-dim); font-size: 0.75rem; }
  .g1 { border-color: var(--again) !important; color: var(--again); }
  .g2 { border-color: var(--hard) !important; color: var(--hard); }
  .g3 { border-color: var(--good) !important; color: var(--good); }
  .g4 { border-color: var(--easy) !important; color: var(--easy); }
  .hint { color: var(--ink-dim); font-size: 0.8rem; text-align: center; margin-top: 10px; }
  .done { text-align: center; padding: 28px 8px; }
  .done h1 { margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 110px; background: var(--surface); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 10px; padding: 10px; font: 0.8rem ui-monospace, Menlo, Consolas, monospace;
  }
  .row2 { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  .row2 .btn { flex: 1 1 140px; }
  .note { color: var(--ink-dim); font-size: 0.85rem; }
  .msg { min-height: 1.4em; color: var(--accent); font-size: 0.9rem; }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; margin: 14px 0 6px; }
  .seg button { flex: 1; min-height: 46px; background: var(--surface); border: 0; font-weight: 650; }
  .seg button + button { border-left: 1px solid var(--rule); }
  .seg button.on { background: var(--accent); color: var(--accent-ink); }
  .opts { display: grid; gap: 10px; }
  .opt { text-align: left; display: flex; gap: 12px; align-items: flex-start; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--rule); background: var(--surface-2); }
  .opt .k { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 7px; background: var(--surface); text-align: center; font-weight: 700; font-size: 0.85rem; line-height: 1.6rem; }
  .opt .t { overflow-wrap: anywhere; }
  .opt[disabled] { color: var(--ink); cursor: default; }
  .opt.right { border-color: var(--good); }
  .opt.wrong { border-color: var(--again); }
  .opt.dim { opacity: 0.55; }
  .verdict { font-weight: 700; margin-bottom: 6px; }
  .verdict.ok { color: var(--good); }
  .verdict.no { color: var(--again); }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main id="app"></main>

<script>
const DECKS = [{"id":"owasp_llm","title":"OWASP LLM Top 10","desc":"The 2025 list: name, number, and how to spot each one in a scenario.","cards":[{"id":"37611390bc","q":"LLM01:2025","a":"Prompt Injection. Crafted input changes the model's behavior or bypasses its instructions.\nDirect = the user types it. Indirect = it arrives inside content the model reads (web page, email, document, tool result).","s":"Prompt Injection","x":["Sensitive Information Disclosure","Improper Output Handling","System Prompt Leakage"]},{"id":"3845e1a458","q":"LLM02:2025","a":"Sensitive Information Disclosure. The model or app leaks PII, credentials, proprietary data, or training data in its output.","s":"Sensitive Information Disclosure","x":["Data and Model Poisoning","Misinformation","Supply Chain"]},{"id":"c7a6779ae8","q":"LLM03:2025","a":"Supply Chain. Compromised or tampered models, datasets, plugins, and libraries (for example a poisoned model on a public hub, or an unsafe pickle file).","s":"Supply Chain","x":["Excessive Agency","Unbounded Consumption","Vector and Embedding Weaknesses"]},{"id":"1c66ae47e9","q":"LLM04:2025","a":"Data and Model Poisoning. Tampering with pre-training, fine-tuning, or embedding data to plant bias, backdoors, or bad behavior.","s":"Data and Model Poisoning","x":["Improper Output Handling","Sensitive Information Disclosure","Supply Chain"]},{"id":"2afd1195d1","q":"LLM05:2025","a":"Improper Output Handling. Model output passed to downstream systems without validation or encoding, leading to XSS, SQL injection, SSRF, or code execution.","s":"Improper Output Handling","x":["Prompt Injection","System Prompt Leakage","Excessive Agency"]},{"id":"b29e0e11b7","q":"LLM06:2025","a":"Excessive Agency. The model can take damaging actions because it has too much functionality, too many permissions, or too much autonomy.","s":"Excessive Agency","x":["Unbounded Consumption","Improper Output Handling","Misinformation"]},{"id":"307ab8d6df","q":"LLM07:2025","a":"System Prompt Leakage. The system prompt is exposed, and it contained things that should not be secret-dependent (credentials, access rules, internal logic).","s":"System Prompt Leakage","x":["Sensitive Information Disclosure","Prompt Injection","Vector and Embedding Weaknesses"]},{"id":"d1d2bc4ff4","q":"LLM08:2025","a":"Vector and Embedding Weaknesses. RAG-specific: weak access control on the vector store, cross-tenant leakage, poisoned documents, embedding inversion.","s":"Vector and Embedding Weaknesses","x":["Data and Model Poisoning","Supply Chain","System Prompt Leakage"]},{"id":"86cc430be8","q":"LLM09:2025","a":"Misinformation. Confident but false output (hallucination) that people or systems rely on.","s":"Misinformation","x":["Sensitive Information Disclosure","Excessive Agency","Unbounded Consumption"]},{"id":"8bd3cccaf8","q":"LLM10:2025","a":"Unbounded Consumption. Uncontrolled inference use causing denial of service, runaway cost (\"denial of wallet\"), or model extraction through mass querying.","s":"Unbounded Consumption","x":["Excessive Agency","Misinformation","Supply Chain"]},{"id":"3ab9474088","q":"A chatbot's reply is inserted into a web page without escaping and runs attacker script. Which OWASP LLM category?","a":"LLM05 Improper Output Handling. Treat model output as untrusted input to whatever consumes it.","s":"LLM05 Improper Output Handling","x":["LLM01 Prompt Injection","LLM06 Excessive Agency","LLM02 Sensitive Information Disclosure"]},{"id":"471d88d9e7","q":"An email-summarizing agent also has a \"delete mail\" tool it never needs. Which category, and which of the three causes?","a":"LLM06 Excessive Agency, caused by excessive functionality (a tool the task does not need). Remove the tool.","s":"LLM06 Excessive Agency, from excessive functionality","x":["LLM06 Excessive Agency, from excessive autonomy","LLM03 Supply Chain, from excessive functionality","LLM10 Unbounded Consumption, from excessive permissions"]},{"id":"27b338e928","q":"An internal RAG assistant shows HR documents to any employee who asks. Which category, and what is the root fix?","a":"LLM08 Vector and Embedding Weaknesses (also LLM02). Enforce the user's existing document permissions at retrieval time, not in the prompt.","s":"LLM08: enforce the user's document permissions at retrieval time","x":["LLM08: tell the model in the prompt not to reveal HR documents","LLM04: retrain the model on cleaner data","LLM07: move the HR documents into the system prompt"]},{"id":"71c35984b1","q":"An attacker floods an LLM endpoint with huge requests and the victim's API bill explodes. Which category?","a":"LLM10 Unbounded Consumption. Fix with rate limits, per-user quotas, input and output size caps, and budget alerts.","s":"LLM10 Unbounded Consumption","x":["LLM06 Excessive Agency","LLM04 Data and Model Poisoning","LLM09 Misinformation"]},{"id":"e216699656","q":"What are the three causes of Excessive Agency?","a":"Excessive functionality (tools it does not need), excessive permissions (broader access than needed), excessive autonomy (acts without human approval on high-impact actions).","s":"Excessive functionality, permissions, and autonomy","x":["Excessive latency, logging, and storage","Weak prompts, weak models, and weak users","Excessive training data, parameters, and compute"]},{"id":"b05b44e2a1","q":"Why is a system prompt not a security boundary?","a":"The model can be talked out of it and can leak it. Anything that must be enforced (authorization, data access, spend limits) has to be enforced in code outside the model.","s":"The model can be talked out of it or leak it, so enforce rules in code","x":["System prompts are too long to be parsed reliably","Models stop following system prompts after the first message","System prompts cannot be changed without retraining the model"]},{"id":"ea923762d0","q":"Direct vs indirect prompt injection: which is the bigger problem for agents, and why?","a":"Indirect. Agents read untrusted content constantly (web, mail, tickets, tool results), and the attacker never needs access to the chat box.","s":"Indirect: agents read untrusted content and the attacker never needs chat access","x":["Direct: users can type anything, so it dominates","Both are equal because the model cannot tell them apart","Neither matters once a guardrail classifier is deployed"]},{"id":"391a0f2928","q":"Can prompt injection be fully prevented today?","a":"No. Reduce impact instead: least privilege for tools, separate untrusted content from instructions, filter and validate outputs, require human approval for high-risk actions, monitor and log tool calls.","s":"No; limit the impact with least privilege, isolation, and approvals","x":["Yes, with a strong enough system prompt","Yes, with an input filter that blocks known phrases","Yes, by fine-tuning the model on injection examples"]},{"id":"a68532cffd","q":"A support bot obeys a hidden instruction inside a customer's uploaded PDF and emails internal data. Which category?","a":"LLM01 Prompt Injection (indirect). The instruction arrived in content the model read. Treat documents as data, restrict the email tool, and require approval for outbound messages.","s":"LLM01 Prompt Injection (indirect)","x":["LLM07 System Prompt Leakage","LLM04 Data and Model Poisoning","LLM03 Supply Chain"]},{"id":"73c0ec82f9","q":"A pickled model downloaded from a public hub runs code the moment it is loaded. Which category?","a":"LLM03 Supply Chain. Untrusted model artifacts are code. Prefer safe formats (safetensors), pin and hash sources, and scan before loading.","s":"LLM03 Supply Chain","x":["LLM05 Improper Output Handling","LLM10 Unbounded Consumption","LLM09 Misinformation"]},{"id":"ed25f20759","q":"A developer puts API keys in the system prompt and users extract them. Which category?","a":"LLM07 System Prompt Leakage. Secrets do not belong in prompts. Keep them in a secrets manager and enforce access outside the model.","s":"LLM07 System Prompt Leakage","x":["LLM04 Data and Model Poisoning","LLM08 Vector and Embedding Weaknesses","LLM10 Unbounded Consumption"]},{"id":"e3c769bda3","q":"A fine-tuning set scraped from forums contains planted text that makes the model recommend a malicious package. Which category?","a":"LLM04 Data and Model Poisoning. Vet data sources, track provenance, and test the tuned model for backdoored behavior.","s":"LLM04 Data and Model Poisoning","x":["LLM01 Prompt Injection","LLM09 Misinformation","LLM06 Excessive Agency"]},{"id":"f0a44b4236","q":"A model confidently names a package that does not exist, and developers install an attacker-registered copy. What is the root cause category?","a":"LLM09 Misinformation (hallucinated packages, sometimes called slopsquatting). Verify that a package exists and is trusted before installing.","s":"LLM09 Misinformation","x":["LLM10 Unbounded Consumption","LLM07 System Prompt Leakage","LLM02 Sensitive Information Disclosure"]},{"id":"35568b1967","q":"The model outputs HTML that a web page renders. What is the best control?","a":"Encode or sanitize the output for where it will be used (LLM05). Do not rely on telling the model to avoid scripts.","s":"Encode or sanitize output for its destination","x":["Tell the model in the system prompt to avoid scripts","Lower the model temperature","Limit the length of user prompts"]},{"id":"e28c5af381","q":"A tool-calling agent can run any shell command. What is the best first fix?","a":"Replace it with narrow, allowlisted tools. This removes excessive functionality, which is the root of the problem.","s":"Replace it with narrow, allowlisted tools","x":["Add a stronger system prompt","Log every command and review weekly","Give it a larger context window"]},{"id":"ab73d5c84f","q":"What is \"denial of wallet\"?","a":"Abusive usage that drives up a victim's inference bill (LLM10 Unbounded Consumption). Mitigate with per-user quotas, rate limits, size caps, and budget alerts.","s":"Abusive usage that drives up a victim's inference bill","x":["Stealing payment card data from the model","Locking a user's account after failed payments","Crashing the model server with malformed input"]},{"id":"d27efca928","q":"Why do embeddings and vector stores need access control?","a":"Similarity search can return documents across users or tenants unless retrieval enforces permissions (LLM08).","s":"Similar documents can be retrieved across users or tenants without checks","x":["Embeddings are too large to store safely","Embeddings change the model's weights","Embeddings expire after one query"]},{"id":"2fca145d00","q":"Name an effective way to reduce sensitive information disclosure from an LLM app.","a":"Sanitize data before it reaches the model, filter output, and give the app least-privilege access to data (LLM02).","s":"Sanitize inputs, filter output, and limit what data the app can reach","x":["Use a longer context window and a higher temperature","Rely on the model to refuse","Store all prompts permanently for audit"]}]},{"id":"atlas_attack","title":"MITRE ATLAS and ATT&CK","desc":"Verify technique IDs against atlas.mitre.org and attack.mitre.org; matrices get revised.","cards":[{"id":"7a6043637c","q":"What is MITRE ATLAS?","a":"A knowledge base of adversary tactics, techniques, and real case studies against AI-enabled systems, modeled on ATT&CK. ATLAS = Adversarial Threat Landscape for AI Systems.","s":"A MITRE knowledge base of adversary tactics and techniques against AI systems","x":["A NIST framework for AI risk management","An OWASP list of the top ten LLM risks","An ISO standard for AI management systems"]},{"id":"501b49b03d","q":"What are the two ATLAS tactics that have no direct ATT&CK equivalent?","a":"ML Model Access (how the adversary reaches the model: API, physical, product use) and ML Attack Staging (preparing the attack: crafting adversarial data, training proxy models, backdoors).","s":"ML Model Access and ML Attack Staging","x":["Model Training and Model Deployment","ML Reconnaissance and ML Exfiltration","Prompt Access and Prompt Staging"]},{"id":"f8d8705ddd","q":"ATT&CK vocabulary: tactic vs technique vs sub-technique.","a":"Tactic = the adversary's goal (the why). Technique = how they achieve it. Sub-technique = a more specific variant of the technique.","s":"A tactic is the goal (why); a technique is the method (how)","x":["A tactic is the method; a technique is the goal","A tactic is a tool; a technique is a threat actor","A tactic is a detection; a technique is a mitigation"]},{"id":"3b651394fa","q":"List the 14 ATT&CK Enterprise tactics in order.","a":"Reconnaissance, Resource Development, Initial Access, Execution, Persistence, Privilege Escalation, Defense Evasion, Credential Access, Discovery, Lateral Movement, Collection, Command and Control, Exfiltration, Impact."},{"id":"7da615babd","q":"AML.T0051","a":"LLM Prompt Injection.","s":"LLM Prompt Injection","x":["Craft Adversarial Data","Poison Training Data","ML Supply Chain Compromise"]},{"id":"0da616f012","q":"AML.T0043","a":"Craft Adversarial Data (inputs designed to make a model misbehave).","s":"Craft Adversarial Data","x":["LLM Prompt Injection","Exfiltration via ML Inference API","Poison Training Data"]},{"id":"b25a3f621f","q":"AML.T0020","a":"Poison Training Data.","s":"Poison Training Data","x":["ML Supply Chain Compromise","Craft Adversarial Data","LLM Prompt Injection"]},{"id":"33027c02d1","q":"AML.T0010","a":"ML Supply Chain Compromise.","s":"ML Supply Chain Compromise","x":["Poison Training Data","Exfiltration via ML Inference API","Craft Adversarial Data"]},{"id":"cc98a47b21","q":"AML.T0024","a":"Exfiltration via ML Inference API (extracting data or model information through queries).","s":"Exfiltration via ML Inference API","x":["LLM Prompt Injection","ML Supply Chain Compromise","Craft Adversarial Data"]},{"id":"12a794ae64","q":"T1078.004","a":"Valid Accounts: Cloud Accounts. Using stolen cloud credentials (the usual start of an AWS compromise).","s":"Valid Accounts: Cloud Accounts","x":["Create Account: Cloud Account","Account Manipulation: Additional Cloud Credentials","Data from Cloud Storage"]},{"id":"034f6df769","q":"T1562.008","a":"Impair Defenses: Disable or Modify Cloud Logs (for example CloudTrail StopLogging).","s":"Impair Defenses: Disable or Modify Cloud Logs","x":["Indicator Removal: Clear Logs","Cloud Infrastructure Discovery","Resource Hijacking"]},{"id":"e154d32a6e","q":"T1530","a":"Data from Cloud Storage (reading S3 or similar objects).","s":"Data from Cloud Storage","x":["Transfer Data to Cloud Account","Cloud Infrastructure Discovery","Valid Accounts: Cloud Accounts"]},{"id":"caa9a92e74","q":"T1098.001","a":"Account Manipulation: Additional Cloud Credentials (for example creating a new access key for persistence).","s":"Account Manipulation: Additional Cloud Credentials","x":["Valid Accounts: Cloud Accounts","Create Account: Cloud Account","Unsecured Credentials: Cloud Instance Metadata API"]},{"id":"975609d520","q":"T1552.005","a":"Unsecured Credentials: Cloud Instance Metadata API (stealing role credentials from the metadata service, the classic SSRF target).","s":"Unsecured Credentials: Cloud Instance Metadata API","x":["Account Manipulation: Additional Cloud Credentials","Cloud Infrastructure Discovery","Data from Cloud Storage"]},{"id":"2d6e6a488f","q":"T1580","a":"Cloud Infrastructure Discovery (enumerating instances, buckets, roles).","s":"Cloud Infrastructure Discovery","x":["Cloud Service Discovery","Data from Cloud Storage","Resource Hijacking"]},{"id":"43194eca3e","q":"T1537","a":"Transfer Data to Cloud Account (exfiltrating to an attacker-controlled account, for example sharing a snapshot).","s":"Transfer Data to Cloud Account","x":["Data from Cloud Storage","Exfiltration Over Web Service","Valid Accounts: Cloud Accounts"]},{"id":"9f215686cc","q":"T1496","a":"Resource Hijacking (cryptomining on stolen compute).","s":"Resource Hijacking","x":["Data Destruction","Cloud Infrastructure Discovery","Transfer Data to Cloud Account"]},{"id":"e7855d5897","q":"T1136.003","a":"Create Account: Cloud Account.","s":"Create Account: Cloud Account","x":["Valid Accounts: Cloud Accounts","Account Manipulation: Additional Cloud Credentials","Cloud Infrastructure Discovery"]},{"id":"3a2fb11d65","q":"How do you apply ATT&CK in a detection program without it turning into a coloring exercise?","a":"Pick techniques by relevant adversaries and your environment, check you have the data source, write and test detections per procedure, and measure quality (tested, alerting, tuned). One rule per technique is not coverage.","s":"Prioritize by relevant adversaries, confirm data, test, and measure quality","x":["Write one rule per technique and report the percentage covered","Buy a vendor rule pack that claims to cover every technique","Color the matrix by which tools say they cover it"]},{"id":"3a99d6daf9","q":"AML.T0054","a":"LLM Jailbreak (getting a model to ignore its safety rules).","s":"LLM Jailbreak","x":["LLM Prompt Injection","Evade ML Model","Craft Adversarial Data"]},{"id":"9ff017b712","q":"AML.T0040","a":"ML Model Inference API Access (reaching the model through its prediction API).","s":"ML Model Inference API Access","x":["Full ML Model Access","Exfiltration via ML Inference API","LLM Prompt Injection"]},{"id":"1fdad704f7","q":"AML.T0044","a":"Full ML Model Access (the adversary has the model itself, for example its weights).","s":"Full ML Model Access","x":["ML Model Inference API Access","ML Supply Chain Compromise","Poison Training Data"]},{"id":"9447f0afc4","q":"AML.T0015","a":"Evade ML Model (inputs that make a model miss or misclassify something).","s":"Evade ML Model","x":["Poison Training Data","LLM Jailbreak","Exfiltration via ML Inference API"]},{"id":"2260aeae3a","q":"Jailbreak vs prompt injection: what is the difference?","a":"A jailbreak bypasses a model's own safety rules. Prompt injection hijacks the application's instructions by smuggling in attacker text. They overlap, but the target differs: the model's policy versus the app's intent.","s":"A jailbreak bypasses model safety rules; injection hijacks the app's instructions","x":["They are the same attack with two names","A jailbreak needs API access; injection needs physical access","A jailbreak poisons training data; injection poisons logs"]},{"id":"a0952b5008","q":"T1190","a":"Exploit Public-Facing Application (initial access through an internet-facing service).","s":"Exploit Public-Facing Application","x":["Valid Accounts","Phishing","Trusted Relationship"]},{"id":"b90f12d085","q":"T1535","a":"Unused/Unsupported Cloud Regions (running resources where nobody is watching, for example for cryptomining).","s":"Unused/Unsupported Cloud Regions","x":["Cloud Infrastructure Discovery","Resource Hijacking","Transfer Data to Cloud Account"]},{"id":"e6b1a16dc0","q":"T1578","a":"Modify Cloud Compute Infrastructure (creating, deleting, or changing instances, snapshots, or volumes to evade defenses or stage an attack).","s":"Modify Cloud Compute Infrastructure","x":["Cloud Infrastructure Discovery","Create Account: Cloud Account","Data from Cloud Storage"]},{"id":"b769490ee1","q":"T1619","a":"Cloud Storage Object Discovery (listing the objects in buckets).","s":"Cloud Storage Object Discovery","x":["Data from Cloud Storage","Cloud Infrastructure Discovery","Transfer Data to Cloud Account"]},{"id":"e13660f37a","q":"T1651","a":"Cloud Administration Command (using cloud management tools such as SSM or run-command to execute code on instances).","s":"Cloud Administration Command","x":["Command and Scripting Interpreter","Cloud Infrastructure Discovery","Modify Cloud Compute Infrastructure"]},{"id":"ff8bfa8b93","q":"T1550.001","a":"Use Alternate Authentication Material: Application Access Token (stolen OAuth or API tokens used in place of a password).","s":"Use Alternate Authentication Material: Application Access Token","x":["Valid Accounts: Cloud Accounts","Steal Web Session Cookie","Brute Force: Password Spraying"]}]},{"id":"agents_mcp","title":"Agents and MCP security","desc":"Trust boundaries, tool permissions, and the attacks specific to tool-calling systems.","cards":[{"id":"3146fc356c","q":"MCP roles: host, client, server.","a":"Host = the application the user runs (IDE, chat app). Client = the connector inside the host, one per server. Server = exposes tools, resources, and prompts over JSON-RPC.","s":"Host is the app; client is its per-server connector; server exposes capabilities","x":["Host is the server; client is the model; server is the user","Host is the model; client is the user; server is the app","Host and client are the same thing; the server is the model"]},{"id":"c4f0533515","q":"What do MCP servers expose?","a":"Tools (actions the model can call), resources (data it can read), and prompts (templated instructions).","s":"Tools, resources, and prompts","x":["Models, datasets, and checkpoints","Agents, memories, and policies","Tokens, sessions, and scopes"]},{"id":"58bfb9addd","q":"What are the two standard MCP transports?","a":"stdio (local subprocess) and Streamable HTTP (remote). Local stdio servers run with the user's privileges.","s":"stdio and Streamable HTTP","x":["gRPC and WebSockets","SMTP and stdio","Streamable HTTP and SSH"]},{"id":"13b031b402","q":"Tool poisoning","a":"Malicious instructions hidden in a tool's name, description, or schema. The model reads them; the user usually never sees them.","s":"Hidden malicious instructions in a tool's description or schema","x":["Corrupting the data a tool was trained on","Overloading a tool with requests","Replacing a tool's binary on disk"]},{"id":"7fe97303c6","q":"Rug pull (MCP)","a":"A server changes its tool definitions after the user approved it. Mitigation: pin or hash definitions and require re-approval on any change.","s":"A server changes its tool definitions after you approved it","x":["A server is removed from the registry after approval","A model is swapped after it was evaluated","A token is revoked in the middle of a session"]},{"id":"ca13e88158","q":"Tool shadowing","a":"One server's tool description manipulates how the model uses a different, trusted server's tool.","s":"One server's tool description manipulates how another server's tool is used","x":["Two servers register the same network port","A tool runs in a hidden background process","A tool copies another tool's output into a log"]},{"id":"10e986af97","q":"Confused deputy (agents)","a":"A service with its own privileges acts for a caller without verifying that the caller may request it. Fix with per-user delegated tokens, not one shared powerful credential.","s":"A privileged service acts for a caller without checking the caller's rights","x":["A service trusts its own logs too much","Two services share the same database account","A model mixes up two users' sessions"]},{"id":"0a1319f2dc","q":"Token passthrough: why is it an anti-pattern?","a":"The MCP server forwards a client token to a downstream API. It breaks audience binding, hides who did what, and lets a token issued for one service be abused on another. Tokens should be issued for the server itself.","s":"It breaks audience binding and hides who did what","x":["It makes tokens expire too quickly","It adds network hops that slow requests","It prevents tokens from being refreshed"]},{"id":"ce7fbf0b62","q":"The \"lethal trifecta\" for agents","a":"Access to private data + exposure to untrusted content + ability to communicate externally. With all three, injected instructions can exfiltrate data. Remove at least one leg.","s":"Private data, untrusted content, and external communication","x":["Prompt, model, and output","Authentication, authorization, and audit","Training data, fine-tuning, and inference"]},{"id":"b89fd4f13f","q":"Treat tool results as what?","a":"Untrusted input. A tool result can carry an injection exactly as a web page can. Never let it expand the agent's permissions.","s":"Untrusted input","x":["Trusted system output","Verified data once the schema checks out","Instructions from the developer"]},{"id":"56d31c8143","q":"Why is \"ask the user to approve every tool call\" not enough?","a":"Approval fatigue. People click through. Reserve prompts for high-impact actions and enforce limits in code.","s":"Approval fatigue: people click through","x":["Approvals add too much latency for the model","Models ignore approval requests","Approval prompts expose the system prompt"]},{"id":"a947329f50","q":"Agent identity best practices (non-human identity)","a":"Each agent gets its own identity, short-lived credentials, least-privilege scopes, a named owner, and logs attributing every action to both the agent and the user it acted for.","s":"Own identity, short-lived credentials, least privilege, an owner, per-action logs","x":["One shared admin service account for all agents","The developer's personal token, for convenience","Long-lived API keys with broad scopes, rotated yearly"]},{"id":"26b85c2e8c","q":"OAuth2 client credentials vs on-behalf-of (token exchange)","a":"Client credentials = the service acts as itself (machine-to-machine). On-behalf-of / token exchange = the service acts with a user's delegated authority. Agents acting for users should use the latter.","s":"Client credentials: acts as itself. On-behalf-of: acts with a user's delegated authority","x":["Client credentials: acts for a user. On-behalf-of: acts as itself","They are the same flow with different names","Client credentials is for browsers; on-behalf-of is for servers"]},{"id":"0883bc5bbe","q":"What should a pre-launch security test suite for an agent cover?","a":"Injection resistance (direct and indirect), tool-permission boundary tests (can it reach what it must not), refusal of out-of-scope actions, data-leak tests, cross-user isolation, and a fixed regression set re-run on every prompt or model change.","s":"Injection, permission boundaries, out-of-scope refusals, data leaks, regressions","x":["Only unit tests of the prompt wording","Load tests and latency benchmarks","Accuracy on a public benchmark"]},{"id":"5a1eed47bd","q":"What do you review in an agent security review?","a":"Architecture and data flows, system prompt, tool and permission manifest (MCP definitions), authn/authz for each tool, logging and monitoring, and what happens on failure.","s":"Data flows, prompt, tool and permission manifest, authn/authz, logging, failure behavior","x":["Only the model's benchmark scores","Only the vendor's marketing claims","Only the UI design and copy"]},{"id":"3027d423f7","q":"Policy-as-code for agent tools: what does it look like?","a":"A machine-readable allowlist of tools, scopes, and data classes per agent, checked in CI (for example with OPA/Rego or Python) so a manifest change that widens access fails the build.","s":"A checked-in allowlist of tools, scopes, and data classes enforced in CI","x":["A prompt telling the agent which tools it may use","A wiki page listing approved tools","A dashboard of tool usage reviewed monthly"]},{"id":"a47dbea826","q":"RAG in one sentence, and its main security question","a":"Retrieve relevant documents by embedding similarity and put them in the prompt. Main question: does retrieval enforce the asking user's permissions?","s":"Retrieve similar documents into the prompt; does retrieval enforce the user's permissions?","x":["Retrain the model nightly; does it forget old data?","Cache answers by question; are they stale?","Compress prompts; is the model still accurate?"]},{"id":"26d56cc176","q":"Why can guardrails (classifiers, filters) not be your only control?","a":"They are probabilistic and bypassable. Pair them with deterministic controls: authorization checks, allowlists, rate limits, sandboxing.","s":"They are probabilistic and bypassable, so pair them with deterministic controls","x":["They are too slow for production use","They cannot run on user input","They only work on output, never on input"]},{"id":"019a4011e6","q":"Indirect injection through logs: why does it matter for AI-assisted SOC triage?","a":"Attackers control fields in the logs and alerts that an LLM triage step reads (user agents, usernames, filenames). Those fields can carry instructions. Isolate them as data and limit what the triage agent can do.","s":"Attackers control log fields an LLM reads, and fields can carry instructions","x":["Logs are too large for models to read","Logs contain timestamps the model cannot parse","Log pipelines strip all special characters"]},{"id":"8f1faf5c66","q":"How do you evaluate an AI triage agent?","a":"Run it against a golden set of past alerts with analyst verdicts. Measure agreement and, above all, the false-negative rate on true positives. Re-run after every change.","s":"Golden set of past alerts; measure agreement and false negatives on true positives","x":["Ask analysts whether the summaries read well","Count how many alerts it closes per hour","Compare its speed to the old SOAR playbook"]},{"id":"7e4d6f606d","q":"Why is a local stdio MCP server a risk?","a":"It runs as a process with your privileges. A malicious or buggy server can read files and run commands. Review the code, sandbox it, and scope filesystem and network access.","s":"It runs as a process with the user's privileges","x":["It sends all data to the vendor","It cannot be updated","It bypasses TLS for the model API"]},{"id":"209ed69495","q":"How should an agent's tool permissions be scoped?","a":"Per task and per user, with the narrowest scopes that work, and short-lived where possible.","s":"Per task and per user, with the narrowest scopes that work","x":["Once, broadly, at install time","By the agent requesting more access at runtime","Equal to the developer's own permissions"]},{"id":"f65975431b","q":"What is memory poisoning in an agent?","a":"Planting malicious content in an agent's persistent memory so it influences later sessions. Treat memory writes from untrusted content as untrusted, and let users review and clear memory.","s":"Planting malicious content in persistent memory that affects later sessions","x":["Filling memory until the process crashes","Overwriting the model's weights","Deleting the conversation history"]},{"id":"54512a2a8d","q":"What is an agent kill switch?","a":"A way to disable an agent or one of its tools quickly without a deploy, for example a feature flag or revoking its credentials. Test it before you need it.","s":"A way to disable an agent or tool quickly without a deploy","x":["A button that deletes the model","A timeout on each prompt","A rate limit on the API"]},{"id":"663d8a4d6c","q":"What should agent audit logs include?","a":"Who asked, which agent acted, which tool was called, the arguments and the result, and any approval. Without this you cannot do incident response on an agent.","s":"Who asked, which agent, which tool, arguments, result, and approval","x":["Only the final answer shown to the user","Only token counts","Only errors"]},{"id":"e000f603e2","q":"Why sandbox an agent that executes code?","a":"Generated code is untrusted and may be attacker-influenced. Use containers or microVMs, no network by default, no credentials, and resource limits.","s":"Generated code is untrusted and may be attacker-influenced","x":["Sandboxes make models faster","Models cannot run code without one","It reduces token costs"]},{"id":"3ea7e21251","q":"What new trust problem appears in multi-agent systems?","a":"One compromised agent's output becomes another agent's trusted input, so an injection can spread. Treat messages between agents as untrusted and keep each agent's permissions minimal.","s":"One compromised agent's output becomes another agent's trusted input","x":["Agents cannot share a model","Every agent needs its own GPU","Messages between agents are always encrypted"]},{"id":"604724fc31","q":"What does good human-in-the-loop look like?","a":"Approval only for high-impact actions, with a clear description of exactly what will happen, so reviewers can actually judge it.","s":"Approve only high-impact actions, with a clear view of what will happen","x":["Approve every action with a generic yes/no prompt","Approve once per session for all tools","Let the model approve its own actions"]},{"id":"6c04c18c1a","q":"Which exfiltration channels from an agent should you watch?","a":"Rendered links and images (data in a URL), tool calls to external URLs, and outbound email or chat. Allowlist destinations and do not auto-render untrusted markdown.","s":"Rendered links and images, calls to external URLs, and outbound email","x":["GPU memory","Model checkpoints","Tokenizer files"]},{"id":"671d8c5ada","q":"Eval vs guardrail: what is the difference?","a":"An eval measures behavior before release. A guardrail enforces limits while the system runs. You need both.","s":"An eval measures behavior before release; a guardrail enforces limits at runtime","x":["An eval runs at runtime; a guardrail runs before release","They are the same thing","An eval is a policy; a guardrail is a metric"]}]},{"id":"ai_governance","title":"AI governance and review","desc":"Frameworks, vendor reviews, inventory, and IR playbooks for AI systems.","cards":[{"id":"85c724b201","q":"NIST AI RMF 1.0: the four functions","a":"Govern (cross-cutting culture, policy, accountability), Map (context and risks), Measure (assess and track), Manage (prioritize and respond).","s":"Govern, Map, Measure, Manage","x":["Identify, Protect, Detect, Respond","Plan, Do, Check, Act","Assess, Design, Deploy, Monitor"]},{"id":"c3db18ced2","q":"NIST AI 600-1","a":"The Generative AI Profile of the AI RMF (2024): risks specific to generative AI and suggested actions.","s":"The Generative AI Profile of the AI RMF","x":["The AI RMF's testing methodology","A NIST standard for AI red teaming","The AI incident reporting format"]},{"id":"096b42cefb","q":"ISO/IEC 42001 vs ISO/IEC 27001","a":"42001 = AI management system (AIMS), certifiable. 27001 = information security management system (ISMS). They are complementary, not interchangeable.","s":"42001 is an AI management system; 27001 is an information security management system","x":["42001 covers privacy; 27001 covers safety","They are the same standard with different numbers","42001 is for vendors; 27001 is for regulators"]},{"id":"5b7fbbeccc","q":"EU AI Act risk tiers","a":"Unacceptable (banned), high-risk (strict obligations), limited risk (transparency duties), minimal risk.","s":"Unacceptable, high-risk, limited risk, minimal risk","x":["Critical, major, moderate, minor","Prohibited, regulated, monitored, exempt","Tier 1 to Tier 4, assigned by company size"]},{"id":"e6b776e7ce","q":"What goes in an AI acceptable use policy?","a":"Approved tools, which data classes may be used where, prohibited uses, required human review, disclosure rules, and how to request a new tool.","s":"Approved tools, data rules, prohibited uses, human review, disclosure","x":["Only the list of banned models","Only the vendor contract terms","Only the company's AI mission statement"]},{"id":"ba824c400e","q":"Questions for an AI vendor or SaaS AI-feature review","a":"Is our data used for training? Retention and residency? Which model provider and subprocessors? Tenant isolation? Does the AI respect existing permissions (ACLs)? Admin controls, audit logs, injection posture, and is the AI feature in scope of their SOC 2?","s":"Training on our data, retention, subprocessors, isolation, ACLs, logging","x":["Logo, pricing tier, and support hours","Model parameter count and benchmark scores","Number of customers and funding stage"]},{"id":"4e5549d130","q":"The biggest hidden risk of enabling an AI feature inside a SaaS tool (a workspace assistant, for example)","a":"It can surface anything the user can technically access, exposing years of over-shared content. Fix permissions hygiene before or alongside rollout.","s":"It surfaces anything the user can access, exposing over-shared content","x":["It always sends data to a competitor","It disables SSO for AI users","It stores prompts in plaintext on user laptops"]},{"id":"4346349bce","q":"How do you discover AI use you do not know about?","a":"IdP and OAuth app grants, CASB or proxy logs, expense data, browser extensions, API-key usage and cloud billing, and code scans for AI SDK imports.","s":"IdP/OAuth grants, CASB or proxy logs, expenses, extensions, billing, code scans","x":["Ask employees to self-report in a survey","Scan only the corporate wiki","Review the firewall's blocked-site list"]},{"id":"b7e57f77b1","q":"Core elements of an AI incident response playbook","a":"Scoping (which model, prompt, data, and tools), evidence (prompts, retrieved documents, tool-call logs), containment (disable the tool or feature flag, revoke tokens, rotate credentials), eradication (fix prompt or guardrail, purge poisoned data), and lessons turned into eval cases.","s":"Scope, evidence, containment, eradication, and lessons turned into evals","x":["Reimage all laptops and rotate the CEO's password","Wait for the vendor's incident report","Retrain the model and redeploy immediately"]},{"id":"9db1b14164","q":"Structure of a security position paper on an emerging technology","a":"The problem and why now, a threat model, current controls and gaps, a recommendation with a decision needed, and how you will measure success.","s":"Problem, threat model, controls and gaps, recommendation, success metrics","x":["Abstract, methods, results, discussion, references","Features, pricing, roadmap, competitors, FAQ","Incident timeline, root cause, blame, fix"]},{"id":"fe21410552","q":"What goes in a model risk assessment?","a":"Purpose and owner, data sources and sensitivity, expected performance, failure modes and their impact, monitoring, human oversight, and a retirement plan.","s":"Purpose, data, performance, failure modes, monitoring, oversight, retirement","x":["Vendor name, contract value, renewal date","Prompt text, temperature, and token limit","UI mockups, brand colors, and launch date"]},{"id":"06250794d6","q":"OAuth 2.0 vs OIDC vs SAML","a":"OAuth 2.0 = delegated authorization (access tokens). OIDC = authentication layer on top of OAuth 2.0 (ID token). SAML = XML-based federated SSO using signed assertions.","s":"OAuth 2.0 authorizes; OIDC adds authentication; SAML is XML-based federated SSO","x":["OAuth 2.0 authenticates; OIDC authorizes; SAML encrypts tokens","All three authenticate, but only SAML authorizes","OIDC is XML-based; SAML is JSON-based"]},{"id":"c900a10c96","q":"What is a CASB?","a":"Cloud access security broker: gives visibility into and control over SaaS and cloud usage (shadow IT discovery, DLP, access policy).","s":"Visibility and control over SaaS and cloud usage","x":["A cloud backup service","A network firewall appliance","A cloud billing dashboard"]},{"id":"c44b002d69","q":"SOC 2 Trust Services Criteria","a":"Security (required), availability, processing integrity, confidentiality, privacy.","s":"Security, availability, processing integrity, confidentiality, privacy","x":["Security, scalability, portability, compliance, performance","Authentication, authorization, accounting, auditing, availability","Confidentiality, integrity, availability, non-repudiation, privacy"]},{"id":"8faf1b2442","q":"Non-human identities in IAM","a":"Service accounts, API keys, OAuth apps, and agents. Inventory them, assign owners, scope them minimally, rotate or expire credentials, and log their actions.","s":"Service accounts, API keys, OAuth apps, and agents: inventory, scope, rotate, log","x":["Only service accounts; agents count as users","Only API keys; everything else is a user","Only bots in chat tools"]},{"id":"e8cf3f2e08","q":"STRIDE","a":"Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. For AI systems, apply it at each trust boundary: user to app, app to model, model to tools, retrieval to model.","s":"Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation of privilege","x":["Spoofing, Theft, Replay, Injection, Deception, Exploitation","Scanning, Tampering, Reconnaissance, Intrusion, Denial, Escalation","Safety, Trust, Reliability, Integrity, Disclosure, Ethics"]},{"id":"5007f00d51","q":"What is fine-tuning's main security risk?","a":"Training data leakage (memorization of sensitive records) and poisoned or low-quality data changing model behavior. Treat the fine-tuning dataset like production data.","s":"Training data leakage, and poisoned data changing behavior","x":["Slower inference","Higher token prices","Loss of the model's tokenizer"]},{"id":"38b7a1a4ea","q":"Who should own an AI system's risk?","a":"A named business owner, with security as advisor and reviewer. Without an owner no one decides, fixes, or shuts it down.","s":"A named business owner, with security as advisor and reviewer","x":["The model vendor","The security team alone","Whoever deployed it first"]},{"id":"540fd6bbd9","q":"What is \"shadow AI\"?","a":"AI tools and features used outside IT and security oversight. Find them with IdP grants, proxy logs, and expense data, then bring the valuable ones into an approved path.","s":"Unapproved AI tools and features used outside IT or security oversight","x":["AI running on idle servers","AI that works without data","Models that hide their reasoning"]},{"id":"50a96aa98d","q":"Which data should never go into an unapproved AI tool?","a":"Regulated and confidential data: PHI, payment data, credentials, source secrets, and customer confidential material.","s":"Regulated and confidential data such as PHI, payment data, and credentials","x":["Public marketing copy","Open-source code","Published research papers"]},{"id":"d61c2f13fa","q":"Why keep an AI inventory with an owner and a data class for each use case?","a":"Reviews, incidents, and shutdowns need someone to contact and something specific to act on.","s":"So reviews, incidents, and shutdowns have an owner and a target","x":["To rank employees by AI usage","To satisfy one vendor's license audit","To reduce model hallucinations"]},{"id":"2fc86c765d","q":"What is a risk-tiered AI review?","a":"Deeper review for higher-impact or more sensitive use cases, and a fast path for low-risk ones, so security does not become the bottleneck.","s":"Deeper review for higher-risk use cases, a fast path for low risk","x":["Every use case gets the same full review","Only customer-facing systems are reviewed","Review depth depends on the vendor's size"]},{"id":"f49af2cb9b","q":"What evidence do auditors want for AI controls?","a":"Policies, an inventory, risk assessments, test results, and logs showing the controls actually operate.","s":"Policies, inventory, assessments, test results, and logs showing controls operate","x":["The vendor's marketing deck","One signed statement from the CISO","The model weights"]},{"id":"bfe3b55894","q":"What is red teaming an AI system?","a":"Adversarial testing of the whole system (model, prompts, tools, data, and permissions) for misuse and failure, not just the model in isolation.","s":"Adversarial testing of the whole system for misuse and failures","x":["Benchmarking accuracy on a public dataset","Reviewing the vendor contract","Load testing the API"]},{"id":"df0814f398","q":"Why involve Legal and Privacy in AI reviews?","a":"Data rights, regulated data, retention, and customer commitments are legal questions that engineering cannot settle alone.","s":"Data rights, regulated data, retention, and customer commitments are legal questions","x":["They approve model architectures","They write the prompts","They manage the GPUs"]}]},{"id":"terraform","title":"Terraform","desc":"Concepts plus the security-tooling resources you would actually deploy.","cards":[{"id":"85483d319f","q":"The core workflow commands","a":"`terraform init` (download providers and set the backend), `plan` (show the diff), `apply` (make the changes), `destroy` (remove everything managed).","s":"init, plan, apply, destroy","x":["build, test, deploy, remove","start, preview, push, stop","install, diff, run, uninstall"]},{"id":"eaabf21ac9","q":"Why use `terraform plan -out=tfplan` then `terraform apply tfplan`?","a":"Apply executes exactly the plan you reviewed, even if the infrastructure changes in between.","s":"Apply executes exactly the plan you reviewed","x":["It makes the plan run faster","It encrypts the plan file","It skips state locking"]},{"id":"8e2bf526ba","q":"What is Terraform state?","a":"The mapping between your configuration and the real resources, including their attributes. It can contain secrets in plaintext.","s":"The mapping from your config to real resources, which can hold secrets","x":["A cache of downloaded provider plugins","A log of every apply","The list of input variables"]},{"id":"3ccd32d07c","q":"How should state be stored and protected?","a":"Remote backend (for example S3) with encryption, versioning, restricted access, and state locking. Never commit state to git.","s":"Remote encrypted backend with versioning, restricted access, and locking; never in git","x":["Committed to git so everyone has it","On a shared laptop","Only in CI logs"]},{"id":"5cfadf8951","q":"Marking a variable `sensitive = true` does what, and not what?","a":"Hides the value in CLI output. It is still stored in plaintext in state.","s":"It hides the value in CLI output, but state still holds it in plaintext","x":["It encrypts the value in state","It removes the value from state","It stops the variable being passed to modules"]},{"id":"4a76303916","q":"What is drift and how do you detect it?","a":"Real infrastructure differs from state or config (someone changed it by hand). `terraform plan` shows it; `plan -refresh-only` shows only drift.","s":"Real infrastructure differs from state or config; plan shows it","x":["Provider versions differ across machines; init shows it","The state file grows over time; fmt shows it","Modules fall behind registry versions; validate shows it"]},{"id":"f18e422dd2","q":"`count` vs `for_each`","a":"`count` indexes resources by position, so removing a middle item shifts and recreates the rest. `for_each` keys by a stable string, so items are independent.","s":"count is index-based and shifts; for_each is keyed and stable","x":["count is keyed and stable; for_each is index-based","They are identical","for_each only works with modules"]},{"id":"ca8fc05aa7","q":"How do you bring an existing resource under Terraform management?","a":"An `import` block (or `terraform import`) plus a matching resource configuration.","s":"An import block (or terraform import) plus matching config","x":["terraform refresh on the resource","terraform taint, then apply","Copy the resource into the state file by hand"]},{"id":"f288846289","q":"What is a module?","a":"A reusable group of resources with input variables and outputs.","s":"A reusable group of resources with inputs and outputs","x":["A provider plugin binary","A saved plan file","A state backend"]},{"id":"5054cbc187","q":"Data source vs resource","a":"A data source reads something that exists (read-only). A resource creates and manages it.","s":"A data source reads what exists; a resource creates and manages it","x":["A data source creates; a resource reads","Both create, but data sources are faster","Data sources are only for secrets"]},{"id":"23cfb86bbb","q":"Implicit vs explicit dependencies","a":"Referencing another resource's attribute creates an implicit dependency. `depends_on` is for dependencies Terraform cannot see.","s":"References create implicit dependencies; depends_on covers hidden ones","x":["Dependencies only come from depends_on","Order follows file order","Order follows alphabetical resource names"]},{"id":"a319f8f5a5","q":"Lifecycle arguments you should know","a":"`prevent_destroy` (block deletion), `create_before_destroy` (replace safely), `ignore_changes` (ignore drift on chosen attributes).","s":"prevent_destroy, create_before_destroy, ignore_changes","x":["init, plan, apply","force_new, taint, untaint","depends_on, count, for_each"]},{"id":"68ed26940a","q":"What does `.terraform.lock.hcl` do?","a":"Pins exact provider versions and checksums. Commit it so everyone, and CI, uses the same providers.","s":"It pins provider versions and checksums, so commit it","x":["It locks the state against concurrent applies","It stores provider credentials","It lists module sources"]},{"id":"97d9538c67","q":"In a plan, what does `-/+` mean and why does it matter?","a":"The resource will be destroyed and recreated. Check it carefully: it can mean downtime or data loss.","s":"Destroy and recreate: check for downtime or data loss","x":["Update in place with no impact","The resource will be imported","The resource will move to another state"]},{"id":"0df6e91f28","q":"The `moved` block","a":"Records that a resource was renamed or relocated so Terraform updates state instead of destroying and recreating it.","s":"It records a rename so state updates without destroy and recreate","x":["It moves state to another backend","It moves resources between regions","It forces recreation of the resource"]},{"id":"3bee276363","q":"Terraform vs Pulumi","a":"Terraform uses HCL, a declarative DSL. Pulumi uses general-purpose languages (Python, TypeScript). Both are declarative and state-based.","s":"Terraform uses HCL; Pulumi uses general-purpose languages","x":["Terraform is imperative; Pulumi is declarative","Terraform has no state; Pulumi stores state","Pulumi only works on AWS"]},{"id":"0b48a25bec","q":"Scanning Terraform for security problems","a":"Static checks (Checkov, Trivy/tfsec) on the code, and policy-as-code (OPA/Conftest, Sentinel) on the plan, for example `terraform show -json tfplan`. Run them in CI before apply.","s":"Static checks (Checkov, Trivy) plus policy on the plan (OPA/Conftest, Sentinel)","x":["Only terraform validate","Only manual code review","Only runtime scanning after deploy"]},{"id":"d1a2dff5b0","q":"Which resources make up a minimal AWS detection stack in Terraform?","a":"`aws_cloudtrail` (multi-region, log file validation, KMS), an S3 log bucket with public access block, `aws_guardduty_detector`, an EventBridge rule (`aws_cloudwatch_event_rule`) targeting an alert Lambda or SNS, and a least-privilege `aws_iam_role` for the Lambda.","s":"CloudTrail, S3 log bucket, GuardDuty, EventBridge rule, alert Lambda, least-privilege role","x":["EC2, RDS, ALB, Route 53","VPC peering, NAT gateway, Direct Connect","Cognito, API Gateway, DynamoDB"]},{"id":"3712af97a4","q":"How should CI authenticate to AWS for Terraform?","a":"OIDC federation to a role with short-lived credentials, not long-lived access keys stored as secrets.","s":"OIDC federation to a role with short-lived credentials","x":["Long-lived access keys stored as CI secrets","The root account's keys","An engineer's personal credentials"]},{"id":"4fecb8fa88","q":"Workspaces vs separate directories or accounts for environments","a":"Workspaces share one backend and config, so mistakes cross environments easily. Many teams prefer separate state per environment, ideally per account.","s":"Workspaces share one backend and config, so mistakes cross environments","x":["Workspaces isolate accounts automatically","Workspaces require separate providers","Workspaces cannot hold state"]},{"id":"8b268fe661","q":"The bootstrap problem with an S3 backend","a":"The bucket that holds state must exist before Terraform can use it. Create it with a small separate config or by hand, then migrate state in.","s":"The state bucket must exist first: create it separately, then migrate state in","x":["Terraform creates the backend bucket automatically","Backends need no storage","Use local state forever"]},{"id":"4a40c636da","q":"What do `terraform fmt` and `terraform validate` do?","a":"`fmt` rewrites files to the canonical style. `validate` checks syntax and internal consistency without touching real infrastructure. Run both in CI.","s":"fmt rewrites style; validate checks syntax and consistency","x":["fmt checks cloud state; validate formats code","Both apply changes","fmt validates providers; validate formats files"]},{"id":"352551ba0f","q":"How do you keep secrets out of Terraform code?","a":"Fetch them from a secrets manager at runtime, never commit `terraform.tfvars` with secrets, and remember that anything a resource reads can still land in state.","s":"Use a secrets manager and keep secret values out of files and state where possible","x":["Put them in terraform.tfvars and commit it","Base64-encode them in the config","Name the variable `secret`"]},{"id":"5da48586ec","q":"How do you force a resource to be recreated?","a":"`terraform apply -replace=ADDRESS`. The older `terraform taint` does the same and is deprecated.","s":"`terraform apply -replace=ADDRESS`","x":["`terraform state rm ADDRESS`","`terraform refresh ADDRESS`","`terraform import ADDRESS`"]},{"id":"907050020f","q":"What does `terraform state rm` do?","a":"Removes a resource from state without destroying the real thing. Terraform then forgets it, and a later plan may want to create a duplicate.","s":"Removes it from state without destroying the real resource","x":["Destroys the real resource","Deletes the whole state file","Reverts state to the last apply"]},{"id":"8ea2dfe3f6","q":"What is a provider alias for?","a":"Using the same provider more than once with different settings, for example another region or another AWS account.","s":"Using one provider with different configs, such as another region or account","x":["Renaming a provider's resources","Caching provider downloads","Pinning a provider version"]},{"id":"9f937e3f63","q":"Which security settings should a log bucket have?","a":"Block Public Access, encryption (KMS), versioning, and a restrictive bucket policy. For evidence, add Object Lock and keep the bucket in a separate account.","s":"Block public access, encryption, versioning, and a restrictive policy","x":["Public read so analysts can download logs","ACLs granting all AWS users read access","No encryption, to keep queries fast"]},{"id":"4e5328eb76","q":"How do you test a Terraform module?","a":"`validate` and `plan` checks in CI, policy tests on the plan, and a real apply in a sandbox account (for example with Terratest).","s":"Validate and plan in CI, policy tests, and a sandbox apply","x":["Only read the code","Only apply it to production","Only unit tests of the provider"]},{"id":"b15c27d80b","q":"What is a sensible CI flow for Terraform?","a":"Format and validate, scan, plan on the pull request, review the plan, then apply from the main branch with a short-lived role.","s":"Format and validate, scan, plan on pull request, review, apply from main","x":["Apply from every developer laptop","Apply on every commit to any branch","Plan only in production"]},{"id":"726fc17dc1","q":"Why keep separate state per account or environment?","a":"A mistake, a leak, or a bad apply is limited to one blast radius.","s":"A mistake or leak is limited to one blast radius","x":["It only makes plans faster","Providers require it","State files cannot exceed 1 MB"]}]},{"id":"aws_ir","title":"AWS cloud incident response","desc":"Logs, attacker behavior, containment, and evidence handling.","cards":[{"id":"5d6eb397b3","q":"The incident response phases (NIST SP 800-61)","a":"Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident Activity.","s":"Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident","x":["Identify, Protect, Detect, Respond, Recover","Plan, Build, Run, Retire","Detect, Alert, Escalate, Close"]},{"id":"7171d0909b","q":"What does CloudTrail record, and what is off by default?","a":"AWS API activity. Management events are on; data events (S3 object-level, Lambda invoke) are off by default and cost extra.","s":"AWS API activity; management events are on, data events are off by default","x":["Network packets; flow logs are on by default","Application logs; everything is on by default","Billing data; off by default"]},{"id":"f93d51a1f9","q":"How far back does CloudTrail Event History go?","a":"90 days of management events. For anything longer you need a trail delivering to S3.","s":"90 days of management events","x":["30 days of all events","1 year of data events","7 days of management events"]},{"id":"68e082ee6e","q":"CloudTrail log file integrity validation","a":"Signed digest files let you prove log files were not altered or deleted after delivery.","s":"It proves log files were not altered or deleted after delivery","x":["It encrypts logs at rest","It compresses log files","It filters out noise events"]},{"id":"93e8780ed4","q":"Why keep logs in a separate security or log-archive account?","a":"A compromised workload account cannot erase the evidence if it cannot write or delete in the log account.","s":"A compromised workload account cannot erase evidence it cannot write or delete","x":["It reduces CloudTrail cost","It speeds up log delivery","AWS requires it for CloudTrail"]},{"id":"3d70cce8cc","q":"AKIA vs ASIA key prefixes","a":"AKIA = long-term IAM user access key. ASIA = temporary credentials from STS (role sessions).","s":"AKIA is a long-term IAM key; ASIA is a temporary STS credential","x":["AKIA is temporary; ASIA is long-term","AKIA is for roles; ASIA is for root","Both are long-term; the prefix is the region"]},{"id":"29d5e17dab","q":"First calls an attacker makes after stealing a key","a":"`sts:GetCallerIdentity`, then enumeration: `iam:ListUsers`, `ListRoles`, `ListAttachedUserPolicies`, `s3:ListBuckets`.","s":"sts:GetCallerIdentity, then List* enumeration","x":["RunInstances, then CreateVpc","DeleteTrail, then DeleteBucket","PutObject, then PutBucketPolicy"]},{"id":"438542837b","q":"API calls that signal persistence","a":"`CreateAccessKey`, `CreateUser`, `CreateLoginProfile`, `AttachUserPolicy`, `UpdateAssumeRolePolicy` (trusting an outside account), and new Lambda or EC2 backdoors.","s":"CreateAccessKey, CreateUser, CreateLoginProfile, AttachUserPolicy, UpdateAssumeRolePolicy","x":["DescribeInstances, ListBuckets, GetCallerIdentity","StopLogging, DeleteTrail, PutEventSelectors","GetObject, ListObjects, HeadBucket"]},{"id":"bb2ab3754c","q":"API calls that signal defense evasion","a":"`StopLogging`, `DeleteTrail`, `UpdateTrail`, `PutEventSelectors` (CloudTrail), and `DeleteDetector` (GuardDuty).","s":"StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors, DeleteDetector","x":["CreateAccessKey, CreateUser, AttachUserPolicy","RunInstances, CreateVpc, AllocateAddress","GetObject, PutObject, DeleteObject"]},{"id":"8a44813f12","q":"Contain a leaked IAM user access key. Steps in order.","a":"Scope it in CloudTrail by access key ID; deactivate (do not delete) the key; review everything it did and any persistence it created; rotate affected secrets; fix how the key leaked.","s":"Scope in CloudTrail, deactivate the key, review actions and persistence, rotate, fix the leak","x":["Delete the key, then restart the instance","Rotate the root password and wait","Disable GuardDuty to cut noise, then investigate"]},{"id":"91c48eda39","q":"Why deactivate rather than delete a compromised key?","a":"It stops use immediately but preserves the record for the investigation.","s":"Deactivating stops use immediately and preserves the record","x":["Deleting is slower to take effect","Deactivated keys still work for 24 hours","AWS charges for deactivated keys"]},{"id":"2f3d0f111d","q":"You cannot invalidate an STS session token directly. What do you do?","a":"Attach a deny policy to the role with a condition on `aws:TokenIssueTime` (the console's \"Revoke active sessions\"), which blocks sessions issued before now.","s":"Attach a deny policy with an aws:TokenIssueTime condition","x":["Delete the STS token through the console","Wait: temporary tokens cannot be restricted","Rotate the IAM user's password"]},{"id":"3e28934b90","q":"IMDSv2 vs IMDSv1","a":"IMDSv2 requires a session token obtained with a PUT request, which blunts SSRF-based theft of instance role credentials. Require IMDSv2 everywhere.","s":"IMDSv2 needs a session token (PUT), which blunts SSRF credential theft","x":["IMDSv2 encrypts instance metadata at rest","IMDSv2 disables the metadata service","IMDSv2 only works inside VPC endpoints"]},{"id":"75bb18cbf9","q":"Containing a compromised EC2 instance","a":"Isolate it with a quarantine security group (no ingress or egress), snapshot its EBS volumes, preserve memory if you can, and tag it. Do not terminate it, and think before stopping it.","s":"Quarantine security group, snapshot EBS, preserve memory, tag; do not terminate","x":["Terminate it and relaunch from the AMI","Reboot it to clear the attacker's processes","Delete the instance profile only"]},{"id":"e4216c2164","q":"What does GuardDuty analyze?","a":"Foundational sources are CloudTrail management events, VPC Flow Logs, and DNS logs, with optional protection for S3 data events, EKS, RDS logins, Lambda, and malware scanning.","s":"CloudTrail management events, VPC Flow Logs, DNS logs, plus optional protections","x":["Only EC2 system logs","Only S3 object contents","Application source code"]},{"id":"b69857fd00","q":"Reading a GuardDuty finding type","a":"Format starts `ThreatPurpose:ResourceType/ThreatFamily`, for example `UnauthorizedAccess:IAMUser/...`. Severity is numeric (low, medium, high).","s":"ThreatPurpose:ResourceType/ThreatFamily","x":["Severity:Region/Account","Service:Region/Resource","Source:Destination/Port"]},{"id":"67e63fced4","q":"Typical GuardDuty to response automation path","a":"Finding -> EventBridge rule -> Lambda, SNS, or SOAR. Keep a human approval gate for destructive actions and guard against remediation loops.","s":"Finding, EventBridge rule, Lambda/SNS/SOAR, with approval gates for destructive actions","x":["Finding, S3 bucket, Athena, email","Finding, CloudFormation, auto-delete resources","Finding, IAM, auto-attach AdministratorAccess"]},{"id":"3601137694","q":"What is Security Hub for?","a":"Aggregates and normalizes findings from GuardDuty, Inspector, Macie, and others (ASFF format) and tracks compliance checks.","s":"It aggregates and normalizes findings from several services (ASFF)","x":["It encrypts data at rest across accounts","It stores CloudTrail logs","It scans only EC2 instances for patches"]},{"id":"a711e110fe","q":"What do SCPs do?","a":"Service control policies in AWS Organizations set the maximum permissions for accounts. They never grant access, and they do not restrict the management account.","s":"They set maximum permissions for accounts and never grant access","x":["They grant permissions to accounts","They apply to the management account","They replace IAM policies"]},{"id":"2152a58d99","q":"Sign of cryptomining in a stolen account","a":"`RunInstances` for large or GPU instances, often in regions you never use, plus a cost spike and GuardDuty cryptocurrency findings.","s":"RunInstances of large or GPU instances in unused regions, plus a cost spike","x":["A burst of S3 PutObject calls","Many failed console logins","New IAM roles with no policies"]},{"id":"4f9a3c3eed","q":"Root account usage: what should you expect and alert on?","a":"Almost none. Alert on any root login or API call, require MFA, and keep no access keys on root.","s":"Almost none: alert on any use, require MFA, keep no access keys","x":["Daily use for admin tasks","Use it for CI deployments","Share it across the team as break-glass"]},{"id":"be072baa3c","q":"How do you find which keys are old, unused, or lack MFA?","a":"The IAM credential report (`aws iam generate-credential-report`), and `get-access-key-last-used` for specific keys.","s":"The IAM credential report","x":["CloudTrail Event History","AWS Config alone","The billing console"]},{"id":"e574b77897","q":"Investigating CloudTrail at scale","a":"Query logs in S3 with Athena, using partition projection to keep scans small. For a quick look use `aws cloudtrail lookup-events` (management events only, 90 days).","s":"Athena over CloudTrail in S3 with partition projection; lookup-events for quick checks","x":["Download every log file and grep locally","Use CloudWatch metrics alone","Use Event History for two-year lookbacks"]},{"id":"ce382381d4","q":"Why do you need pagination when calling CloudTrail from boto3?","a":"Responses return one page. Use the paginator or follow `NextToken`, or you silently miss events and your timeline is incomplete.","s":"Responses return one page, so you silently miss events without paginating","x":["boto3 retries pages automatically","Pagination only affects billing","Pagination encrypts the results"]},{"id":"4dbd680c99","q":"How do you check whether an S3 bucket is exposed?","a":"Check Block Public Access settings, the bucket policy and ACLs, and IAM Access Analyzer findings for external access. Macie can tell you what sensitive data is inside.","s":"Block Public Access, bucket policy and ACLs, Access Analyzer; Macie for contents","x":["Check only the bucket name","Check only the region","Check only versioning status"]},{"id":"cb56083220","q":"Containment vs eradication vs recovery","a":"Containment stops the spread. Eradication removes the attacker's access and artifacts. Recovery restores normal service and verifies it is clean.","s":"Stop the spread; remove access and artifacts; restore and verify","x":["Restore first; contain later; eradicate last","Eradicate first; recover; contain last","All three mean rebuilding the account"]},{"id":"e7523e6919","q":"Evidence handling basics","a":"Preserve before you change (snapshots, log exports), hash what you collect, record who touched it and when, and work from copies.","s":"Preserve before changing, hash, record custody, work from copies","x":["Fix first and document later","Edit the originals to add notes","Share raw evidence widely for faster analysis"]},{"id":"2427045312","q":"An access key was pushed to a public repo. What is the first containment action?","a":"Deactivate the key, then investigate what it did. Removing the commit does not help: assume it was already scraped.","s":"Deactivate the key, then investigate its usage","x":["Remove the commit from git history and wait","Rotate every key in the account","Make the repo private and move on"]},{"id":"0d2ef47552","q":"How do you see everything an access key did?","a":"Search CloudTrail by AccessKeyId across all regions (lookup-events for recent activity, Athena for more).","s":"Search CloudTrail by AccessKeyId across all regions","x":["Check the key's creation date","Read the IAM user's console history","Query billing by service"]},{"id":"7884275088","q":"Which AWS tool lists resources shared outside your account or organization?","a":"IAM Access Analyzer.","s":"IAM Access Analyzer","x":["AWS Config conformance packs","Cost Explorer","Amazon Inspector"]},{"id":"b518c82ab4","q":"How do you stop a compromised role from being assumed again?","a":"Tighten or remove the role's trust policy, and attach a deny for sessions issued before now (`aws:TokenIssueTime`).","s":"Edit the trust policy and deny sessions issued before now","x":["Change the role's name tag","Disable the console login","Remove the role from CloudTrail"]},{"id":"926bc1bd71","q":"How do you protect log evidence from tampering?","a":"Object Lock (or MFA delete) on the log bucket, plus keeping it in a separate account with tightly limited write and delete rights.","s":"Object Lock or MFA delete, plus a separate account","x":["Compress the logs with gzip","Rename the bucket weekly","Turn on static website hosting"]},{"id":"468a39b28b","q":"What are VPC Flow Logs good for in IR?","a":"Network metadata (who talked to whom, how much), useful for lateral movement and exfiltration. They do not contain packet contents.","s":"Network metadata, useful for lateral movement and exfiltration","x":["Full packet contents","API call history","IAM policy changes"]},{"id":"943e130655","q":"What does `userIdentity.type` in a CloudTrail event tell you?","a":"Who or what made the call: IAMUser, AssumedRole, Root, AWSService, and so on.","s":"Whether the caller was an IAM user, assumed role, root, or an AWS service","x":["Which region the call ran in","How long the call took","Whether the call was billed"]},{"id":"3b6252bc7d","q":"How do you recognize an assumed-role session in CloudTrail?","a":"`userIdentity.type` is `AssumedRole` and the principal includes a session name. Trace it back to who assumed it through the AssumeRole event.","s":"userIdentity.type is AssumedRole and a session name is present","x":["The eventTime has a timezone offset","The awsRegion is global","The sourceIPAddress is a private address"]},{"id":"4e8ec830d3","q":"What does a `sourceIPAddress` like `cloudformation.amazonaws.com` mean?","a":"An AWS service made the call on someone's behalf. Find who triggered it (for example the CloudFormation stack's caller) rather than treating it as the actor.","s":"An AWS service made the call on someone's behalf","x":["The attacker used a VPN","The call came from the account's NAT gateway","The call is a replay"]},{"id":"d41db5d431","q":"What is Amazon Detective?","a":"A service that builds a graph of related activity (from CloudTrail, flow logs, and findings) so you can investigate a finding quickly.","s":"A graph of related activity for investigating findings","x":["A vulnerability scanner for EC2","A password manager","A DDoS protection service"]},{"id":"cbb3a3b968","q":"What does Amazon Macie do?","a":"Discovers and classifies sensitive data in S3, so you know what an exposed bucket actually held.","s":"Discovers and classifies sensitive data in S3","x":["Blocks malicious IPs at the edge","Scans EC2 for malware","Rotates secrets"]},{"id":"128e01d900","q":"Which GuardDuty finding means instance role credentials are used from outside AWS?","a":"`UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS`.","s":"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS","x":["Backdoor:EC2/C&CActivity.B","Recon:IAMUser/ResourcePermissions","Stealth:IAMUser/CloudTrailLoggingDisabled"]},{"id":"deaedd7903","q":"How do you quickly quarantine a compromised IAM user?","a":"Attach an explicit deny-all policy, deactivate its keys, and revoke its sessions. Keep the user so the evidence and the audit trail stay intact.","s":"Attach deny-all, deactivate keys, and revoke sessions","x":["Delete the user to remove all access","Change only the console password","Move the user to a new group"]},{"id":"99893ca31f","q":"Why does an explicit Deny matter in IAM?","a":"It overrides any Allow, which makes it the reliable way to contain a principal.","s":"It overrides any Allow","x":["It is ignored if a role allows the action","It only applies to the root user","It takes effect after 24 hours"]},{"id":"a1337c5371","q":"Which logs show S3 object-level access?","a":"CloudTrail data events or S3 server access logs. Management events alone do not show who read or deleted an object.","s":"CloudTrail data events or S3 server access logs","x":["CloudTrail management events only","VPC Flow Logs","GuardDuty findings only"]}]},{"id":"detection_siem","title":"Detection engineering and SIEM data","desc":"The detection lifecycle, schemas, data lakes, SOAR, and measuring what you built.","cards":[{"id":"90f8d7afa0","q":"Detection engineering lifecycle","a":"Hypothesis (threat or ATT&CK technique) -> confirm the data source exists -> write the rule -> test it (emulation) -> tune -> deploy -> measure -> retire or revise.","s":"Hypothesis, data check, write, test, tune, deploy, measure, retire","x":["Write, deploy, wait for alerts, tune","Buy, install, configure, forget","Alert, triage, close, report"]},{"id":"ed228b41ad","q":"What is detection-as-code?","a":"Rules live in version control with peer review, automated tests in CI, and a deploy pipeline, just like software.","s":"Rules in version control with review,
