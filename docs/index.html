s":"Injection, permission boundaries, out-of-scope refusals, data leaks, regressions","x":["Only unit tests of the prompt wording","Load tests and latency benchmarks","Accuracy on a public benchmark"],"d":[{"h":"What it is","b":["Tests that probe the agent the way an attacker would, before launch, and keep running afterward.","- **Injection:** direct and indirect attempts to redirect it.","- **Permission boundaries:** can it reach tools or data it should not?","- **Refusal:** does it decline out-of-scope actions?","- **Data leaks:** does anything private appear in output?","- **Regressions:** a fixed set re-run on every prompt, tool or model change."]},{"h":"Why this is the answer","b":["Models change behavior with small edits, so one-time checks go stale. A repeatable suite makes security a measurable property. Accuracy benchmarks, load tests and prompt-wording unit tests do not examine attack resistance."]},{"h":"Remember it","b":["Test for abuse, not just for success."]}]},{"id":"5a1eed47bd","q":"What do you review in an agent security review?","a":"Architecture and data flows, system prompt, tool and permission manifest (MCP definitions), authn/authz for each tool, logging and monitoring, and what happens on failure.","s":"Data flows, prompt, tool and permission manifest, authn/authz, logging, failure behavior","x":["Only the model's benchmark scores","Only the vendor's marketing claims","Only the UI design and copy"],"d":[{"h":"What it is","b":["A review looks at the whole system, not only the model: data flows, system prompt, the tool and permission manifest (such as MCP definitions), authentication and authorization for each tool, logging and monitoring, and how the agent behaves on failure."]},{"h":"Why this is the answer","b":["Agent risk comes from **what the agent can reach and do**. The model's benchmark scores and a vendor's claims say little about that. The tool manifest and permission model are where most real exposure lives."]},{"h":"Remember it","b":["Follow the data and the permissions."]}]},{"id":"3027d423f7","q":"Policy-as-code for agent tools: what does it look like?","a":"A machine-readable allowlist of tools, scopes, and data classes per agent, checked in CI (for example with OPA/Rego or Python) so a manifest change that widens access fails the build.","s":"A checked-in allowlist of tools, scopes, and data classes enforced in CI","x":["A prompt telling the agent which tools it may use","A wiki page listing approved tools","A dashboard of tool usage reviewed monthly"],"d":[{"h":"What it is","b":["A machine-readable allowlist, checked in with the code, of which tools each agent may use, with what scopes and over which data classes. A pipeline (for example OPA/Rego or a Python check) enforces it in CI."]},{"h":"Why this is the answer","b":["Telling the agent in a prompt which tools to use is a suggestion, and a wiki page is documentation that drifts. Code enforced in CI makes a change that widens access **fail the build** and creates a reviewable history."]},{"h":"Remember it","b":["If it is not enforced by a machine, it is only a wish."]}]},{"id":"a47dbea826","q":"RAG in one sentence, and its main security question","a":"Retrieve relevant documents by embedding similarity and put them in the prompt. Main question: does retrieval enforce the asking user's permissions?","s":"Retrieve similar documents into the prompt; does retrieval enforce the user's permissions?","x":["Retrain the model nightly; does it forget old data?","Cache answers by question; are they stale?","Compress prompts; is the model still accurate?"],"d":[{"h":"What it is","b":["Retrieval-augmented generation retrieves documents similar to a query and places them in the model's prompt so it can answer using them."]},{"h":"Why this is the answer","b":["The main security question is **does retrieval enforce the asking user's permissions?** Similarity search returns what is close in meaning, not what the person may see. If it does not filter by access, the model will happily summarize documents the user should never have been shown."]},{"h":"Remember it","b":["Retrieve only what this user may read."]}]},{"id":"26d56cc176","q":"Why can guardrails (classifiers, filters) not be your only control?","a":"They are probabilistic and bypassable. Pair them with deterministic controls: authorization checks, allowlists, rate limits, sandboxing.","s":"They are probabilistic and bypassable, so pair them with deterministic controls","x":["They are too slow for production use","They cannot run on user input","They only work on output, never on input"],"d":[{"h":"What it is","b":["Guardrails are checks, often model-based, that screen inputs and outputs for harmful content or policy violations."]},{"h":"Why this is the answer","b":["They are **probabilistic**: they miss some attacks and wrongly block some benign input, and determined attackers can find ways around them. Use them as one layer alongside deterministic controls such as authorization checks, tool allowlists, rate limits and sandboxing."]},{"h":"Remember it","b":["Guardrails lower the odds. Deterministic controls set the limits."]}]},{"id":"019a4011e6","q":"Indirect injection through logs: why does it matter for AI-assisted SOC triage?","a":"Attackers control fields in the logs and alerts that an LLM triage step reads (user agents, usernames, filenames). Those fields can carry instructions. Isolate them as data and limit what the triage agent can do.","s":"Attackers control log fields an LLM reads, and fields can carry instructions","x":["Logs are too large for models to read","Logs contain timestamps the model cannot parse","Log pipelines strip all special characters"],"d":[{"h":"What it is","b":["An AI triage agent reads alert and log data. Attackers control some of those fields: user agents, usernames, file names, HTTP parameters. Text in them can look like instructions."]},{"h":"Why this is the answer","b":["It turns the attacker's own activity into a way to influence the system analyzing it. A crafted username could tell the triage agent to mark the alert benign. Mitigate by treating log fields strictly as data, limiting what the triage agent can do on its own, and requiring human review for closing high-severity alerts."]},{"h":"Remember it","b":["The attacker writes the logs your AI reads."]}]},{"id":"8f1faf5c66","q":"How do you evaluate an AI triage agent?","a":"Run it against a golden set of past alerts with analyst verdicts. Measure agreement and, above all, the false-negative rate on true positives. Re-run after every change.","s":"Golden set of past alerts; measure agreement and false negatives on true positives","x":["Ask analysts whether the summaries read well","Count how many alerts it closes per hour","Compare its speed to the old SOAR playbook"],"d":[{"h":"What it is","b":["Build a **golden set** of past alerts with analyst-confirmed verdicts, run the agent over it, and measure agreement. The most important number is the false-negative rate: real threats the agent called benign."]},{"h":"Why this is the answer","b":["Subjective impressions and speed metrics hide the failure that matters. An agent that closes alerts quickly but misses true positives is dangerous. Re-run the evaluation after any change to the model, prompt or tools, and compare against the previous baseline."]},{"h":"Remember it","b":["Measure what it misses, not how fast it closes."]}]},{"id":"7e4d6f606d","q":"Why is a local stdio MCP server a risk?","a":"It runs as a process with your privileges. A malicious or buggy server can read files and run commands. Review the code, sandbox it, and scope filesystem and network access.","s":"It runs as a process with the user's privileges","x":["It sends all data to the vendor","It cannot be updated","It bypasses TLS for the model API"],"d":[{"h":"What it is","b":["A stdio MCP server runs as a process on the user's machine with the user's privileges. It can read files the user can read and run whatever the user can run."]},{"h":"Why this is the answer","b":["Installing one is like installing any program that runs with your rights, with the added twist that an AI model drives it. Review the code or publisher, run it in a sandbox or container, restrict filesystem and network access, and avoid running servers you cannot verify."]},{"h":"Remember it","b":["Installing a server is running someone's code as you."]}]},{"id":"209ed69495","q":"How should an agent's tool permissions be scoped?","a":"Per task and per user, with the narrowest scopes that work, and short-lived where possible.","s":"Per task and per user, with the narrowest scopes that work","x":["Once, broadly, at install time","By the agent requesting more access at runtime","Equal to the developer's own permissions"],"d":[{"h":"What it is","b":["Scope permissions **per task and per user**, with the narrowest scopes that make the task work, and short lifetimes where possible."]},{"h":"Why this is the answer","b":["The agent's power is whatever its credentials allow, and an injected instruction can try to use all of it. Broad install-time grants, permissions the agent requests for itself, or copying the developer's access all give an attacker far more than the job needs."]},{"h":"Remember it","b":["Only as much access as this task, for this user, for this long."]}]},{"id":"f65975431b","q":"What is memory poisoning in an agent?","a":"Planting malicious content in an agent's persistent memory so it influences later sessions. Treat memory writes from untrusted content as untrusted, and let users review and clear memory.","s":"Planting malicious content in persistent memory that affects later sessions","x":["Filling memory until the process crashes","Overwriting the model's weights","Deleting the conversation history"],"d":[{"h":"What it is","b":["Many agents keep persistent memory: notes, preferences, summaries that carry over between sessions. Memory poisoning plants malicious content there, often via an injection, so it influences later behavior."]},{"h":"Why this is the answer","b":["The attack **outlives the session** in which it succeeded, and it can reappear when no attacker is present. Treat memory writes triggered by untrusted content as untrusted, let users review and clear memory, and keep memory out of high-privilege flows."]},{"h":"Remember it","b":["A single injection can become a standing instruction."]}]},{"id":"54512a2a8d","q":"What is an agent kill switch?","a":"A way to disable an agent or one of its tools quickly without a deploy, for example a feature flag or revoking its credentials. Test it before you need it.","s":"A way to disable an agent or tool quickly without a deploy","x":["A button that deletes the model","A timeout on each prompt","A rate limit on the API"],"d":[{"h":"What it is","b":["A fast way to disable an agent or one of its tools without a code deployment, for example a feature flag or revoking its credentials."]},{"h":"Why this is the answer","b":["When an agent misbehaves, speed matters. If stopping it requires a release process, damage continues meanwhile. Test the switch in advance so you know it works and who is allowed to use it."]},{"h":"Remember it","b":["If you cannot turn it off quickly, you do not control it."]}]},{"id":"663d8a4d6c","q":"What should agent audit logs include?","a":"Who asked, which agent acted, which tool was called, the arguments and the result, and any approval. Without this you cannot do incident response on an agent.","s":"Who asked, which agent, which tool, arguments, result, and approval","x":["Only the final answer shown to the user","Only token counts","Only errors"],"d":[{"h":"What it is","b":["For each action: who asked, which agent acted, which tool was called, the arguments and result, and any approval that was given."]},{"h":"Why this is the answer","b":["Without this record you cannot investigate an incident, prove what happened or tell if an agent was manipulated. A final answer or token counts do not reveal what the agent actually did. Logs should be tamper-resistant and kept long enough to be useful."]},{"h":"Remember it","b":["If it is not logged, it did not happen as far as an investigation is concerned."]}]},{"id":"e000f603e2","q":"Why sandbox an agent that executes code?","a":"Generated code is untrusted and may be attacker-influenced. Use containers or microVMs, no network by default, no credentials, and resource limits.","s":"Generated code is untrusted and may be attacker-influenced","x":["Sandboxes make models faster","Models cannot run code without one","It reduces token costs"],"d":[{"h":"What it is","b":["A sandbox runs code in an isolated environment, for example a container or microVM, with limited access to files, network, credentials and resources."]},{"h":"Why this is the answer","b":["Code produced by a model can be influenced by attacker-controlled text, so treat it as **untrusted**. Run it with no network by default, no credentials, tight resource limits and a throwaway filesystem so a malicious script has nowhere to go."]},{"h":"Remember it","b":["If a model wrote it and a stranger influenced the model, sandbox it."]}]},{"id":"3ea7e21251","q":"What new trust problem appears in multi-agent systems?","a":"One compromised agent's output becomes another agent's trusted input, so an injection can spread. Treat messages between agents as untrusted and keep each agent's permissions minimal.","s":"One compromised agent's output becomes another agent's trusted input","x":["Agents cannot share a model","Every agent needs its own GPU","Messages between agents are always encrypted"],"d":[{"h":"What it is","b":["When agents pass messages to each other, one agent's output becomes another agent's input."]},{"h":"Why this is the answer","b":["A compromised or manipulated agent can inject instructions into its peers, and the injection **spreads** along the chain. Treat inter-agent messages as untrusted, keep each agent's permissions minimal, and validate what crosses a boundary instead of trusting it because it came from \"our\" agent."]},{"h":"Remember it","b":["Inside the system does not mean trusted."]}]},{"id":"604724fc31","q":"What does good human-in-the-loop look like?","a":"Approval only for high-impact actions, with a clear description of exactly what will happen, so reviewers can actually judge it.","s":"Approve only high-impact actions, with a clear view of what will happen","x":["Approve every action with a generic yes/no prompt","Approve once per session for all tools","Let the model approve its own actions"],"d":[{"h":"What it is","b":["People approve only the **high-impact** steps, and each approval shows exactly what will happen, such as a diff of the change or the recipients and content of a message."]},{"h":"Why this is the answer","b":["Approval only adds safety if the reviewer can judge it. Generic yes/no prompts, one-time blanket approval and letting the model approve itself remove the human from the decision."]},{"h":"Remember it","b":["Ask rarely, and show the reviewer exactly what they are approving."]}]},{"id":"6c04c18c1a","q":"Which exfiltration channels from an agent should you watch?","a":"Rendered links and images (data in a URL), tool calls to external URLs, and outbound email or chat. Allowlist destinations and do not auto-render untrusted markdown.","s":"Rendered links and images, calls to external URLs, and outbound email","x":["GPU memory","Model checkpoints","Tokenizer files"],"d":[{"h":"What it is","b":["Common channels are rendered content (a markdown image whose URL contains stolen data), calls to external URLs, and outbound email or chat messages."]},{"h":"Why this is the answer","b":["These are the ways injected instructions get private data **out**. Allowlist destinations, avoid auto-rendering untrusted markdown or images, and review outbound actions. Model memory, checkpoints and tokenizer files are not the typical exfiltration path in an agent compromise."]},{"h":"Remember it","b":["Watch every way text can leave: links, images, mail, and requests."]}]},{"id":"671d8c5ada","q":"Eval vs guardrail: what is the difference?","a":"An eval measures behavior before release. A guardrail enforces limits while the system runs. You need both.","s":"An eval measures behavior before release; a guardrail enforces limits at runtime","x":["An eval runs at runtime; a guardrail runs before release","They are the same thing","An eval is a policy; a guardrail is a metric"],"d":[{"h":"What it is","b":["An **eval** measures how a system behaves, usually before release and on a schedule. A **guardrail** acts at runtime to block or modify specific inputs, outputs or actions."]},{"h":"Why this is the answer","b":["They answer different questions. Evals tell you how often things go wrong and whether a change made it worse. Guardrails reduce harm in the moment. You need both: evals to find and track problems, guardrails (plus deterministic controls) to limit them live."]},{"h":"Remember it","b":["Evals measure. Guardrails enforce."]}]}]},{"id":"ai_governance","title":"AI governance and review","desc":"Frameworks, vendor reviews, inventory, and IR playbooks for AI systems.","cards":[{"id":"85c724b201","q":"NIST AI RMF 1.0: the four functions","a":"Govern (cross-cutting culture, policy, accountability), Map (context and risks), Measure (assess and track), Manage (prioritize and respond).","s":"Govern, Map, Measure, Manage","x":["Identify, Protect, Detect, Respond","Plan, Do, Check, Act","Assess, Design, Deploy, Monitor"],"d":[{"h":"What it is","b":["The NIST AI Risk Management Framework organizes AI risk work into four functions.","- **Govern:** the culture, policies, roles and accountability that make risk management possible. It applies across all the others.","- **Map:** understand the context: what the system is for, who it affects, what could go wrong.","- **Measure:** assess and track those risks with testing and metrics.","- **Manage:** prioritize risks and act on them: mitigate, accept, transfer or retire."]},{"h":"Why this is the answer","b":["The names are easy to confuse with the NIST Cybersecurity Framework (Identify, Protect, Detect, Respond, Recover). The AI RMF is about managing risk across an AI system's life cycle, not about security alone, and Govern sits underneath the rest."]},{"h":"Remember it","b":["Govern first and always; then Map, Measure, Manage."]}]},{"id":"c3db18ced2","q":"NIST AI 600-1","a":"The Generative AI Profile of the AI RMF (2024): risks specific to generative AI and suggested actions.","s":"The Generative AI Profile of the AI RMF","x":["The AI RMF's testing methodology","A NIST standard for AI red teaming","The AI incident reporting format"],"d":[{"h":"What it is","b":["NIST AI 600-1 is the **Generative AI Profile** of the AI Risk Management Framework, published in 2024. A profile applies a framework to a particular use or technology."]},{"h":"Why this is the answer","b":["It takes the general AI RMF and identifies risks specific to generative AI, such as confabulation (hallucination), data privacy, information security, and harmful content, along with suggested actions. It is not a testing method or a reporting format; it is the generative AI companion to the RMF."]},{"h":"Remember it","b":["600-1 = the generative AI edition of the RMF."]}]},{"id":"096b42cefb","q":"ISO/IEC 42001 vs ISO/IEC 27001","a":"42001 = AI management system (AIMS), certifiable. 27001 = information security management system (ISMS). They are complementary, not interchangeable.","s":"42001 is an AI management system; 27001 is an information security management system","x":["42001 covers privacy; 27001 covers safety","They are the same standard with different numbers","42001 is for vendors; 27001 is for regulators"],"d":[{"h":"What it is","b":["Both are management system standards that an organization can be certified against, covering different subjects.","- **ISO/IEC 42001:** an AI management system (AIMS), covering the responsible development and use of AI.","- **ISO/IEC 27001:** an information security management system (ISMS)."]},{"h":"Why this is the answer","b":["They share a structure but not a scope. A 27001 certificate does not show that you manage AI-specific risks, and 42001 does not replace security controls. Many organizations pursue both, and the shared structure makes combining them easier."]},{"h":"Remember it","b":["27001 secures information. 42001 governs AI."]}]},{"id":"5b7fbbeccc","q":"EU AI Act risk tiers","a":"Unacceptable (banned), high-risk (strict obligations), limited risk (transparency duties), minimal risk.","s":"Unacceptable, high-risk, limited risk, minimal risk","x":["Critical, major, moderate, minor","Prohibited, regulated, monitored, exempt","Tier 1 to Tier 4, assigned by company size"],"d":[{"h":"What it is","b":["The EU AI Act sorts AI systems by risk and sets obligations accordingly.","- **Unacceptable risk:** prohibited.","- **High risk:** allowed with strict requirements, such as risk management, data governance, documentation and human oversight.","- **Limited risk:** mainly transparency duties, such as telling people they are talking to an AI.","- **Minimal risk:** largely unregulated."]},{"h":"Why this is the answer","b":["The tier depends on **what the system is used for**, not the size of the company. Knowing the tiers lets you quickly say what a given use case will require."]},{"h":"Remember it","b":["The more harm a use can do, the more rules apply."]}]},{"id":"e6b776e7ce","q":"What goes in an AI acceptable use policy?","a":"Approved tools, which data classes may be used where, prohibited uses, required human review, disclosure rules, and how to request a new tool.","s":"Approved tools, data rules, prohibited uses, human review, disclosure","x":["Only the list of banned models","Only the vendor contract terms","Only the company's AI mission statement"],"d":[{"h":"What it is","b":["An AI acceptable use policy tells people how they may use AI at work. It normally covers approved tools, which kinds of data may be used with which tools, prohibited uses, when human review is required, how to disclose AI use, and how to request a new tool."]},{"h":"Why this is the answer","b":["It must be specific enough to follow. A list of banned models, a mission statement or a vendor contract alone does not tell an employee what they may do today. Pair the policy with an easy approval path so people do not route around it."]},{"h":"Remember it","b":["Say what is allowed, with what data, and how to ask for more."]}]},{"id":"ba824c400e","q":"Questions for an AI vendor or SaaS AI-feature review","a":"Is our data used for training? Retention and residency? Which model provider and subprocessors? Tenant isolation? Does the AI respect existing permissions (ACLs)? Admin controls, audit logs, injection posture, and is the AI feature in scope of their SOC 2?","s":"Training on our data, retention, subprocessors, isolation, ACLs, logging","x":["Logo, pricing tier, and support hours","Model parameter count and benchmark scores","Number of customers and funding stage"],"d":[{"h":"What it is","b":["Ask questions that surface data and control risks.","- Is our data used to **train** models?","- How long is it **retained**, and where?","- Which **model provider and subprocessors** are involved?","- How is our data **isolated** from other customers?","- Does the AI respect our existing **permissions (ACLs)**?","- What **admin controls and audit logs** exist?"]},{"h":"Why this is the answer","b":["These determine where your data goes and what the AI can reach. Marketing details such as logos, model sizes or funding do not tell you about risk."]},{"h":"Remember it","b":["Where does the data go, who sees it, and does the AI respect permissions?"]}]},{"id":"4e5549d130","q":"The biggest hidden risk of enabling an AI feature inside a SaaS tool (a workspace assistant, for example)","a":"It can surface anything the user can technically access, exposing years of over-shared content. Fix permissions hygiene before or alongside rollout.","s":"It surfaces anything the user can access, exposing over-shared content","x":["It always sends data to a competitor","It disables SSO for AI users","It stores prompts in plaintext on user laptops"],"d":[{"h":"What it is","b":["AI assistants in workplace tools search and summarize everything the user can access. That exposes a problem that already existed: over-shared documents and loose permissions."]},{"h":"Why this is the answer","b":["Before AI, a sensitive file in an over-shared folder was hard to find. An assistant makes it easy to surface with one question. The risk comes from permission hygiene, not a new vulnerability. Clean up access and sensitivity labels before or alongside rollout."]},{"h":"Remember it","b":["AI makes bad permissions discoverable."]}]},{"id":"4346349bce","q":"How do you discover AI use you do not know about?","a":"IdP and OAuth app grants, CASB or proxy logs, expense data, browser extensions, API-key usage and cloud billing, and code scans for AI SDK imports.","s":"IdP/OAuth grants, CASB or proxy logs, expenses, extensions, billing, code scans","x":["Ask employees to self-report in a survey","Scan only the corporate wiki","Review the firewall's blocked-site list"],"d":[{"h":"What it is","b":["Look at where AI adoption leaves traces.","- **Identity provider and OAuth grants:** which AI apps have been authorized.","- **CASB, proxy and DNS logs:** traffic to AI services.","- **Expenses and billing:** subscriptions and API charges.","- **Browser extensions** and **code scans** for AI SDK imports."]},{"h":"Why this is the answer","b":["Surveys and wiki searches only find what people volunteer. Telemetry finds actual use. Once you know what exists, bring valuable tools into an approved path instead of just blocking them."]},{"h":"Remember it","b":["Find it in the logs, not just in the survey."]}]},{"id":"b7e57f77b1","q":"Core elements of an AI incident response playbook","a":"Scoping (which model, prompt, data, and tools), evidence (prompts, retrieved documents, tool-call logs), containment (disable the tool or feature flag, revoke tokens, rotate credentials), eradication (fix prompt or guardrail, purge poisoned data), and lessons turned into eval cases.","s":"Scope, evidence, containment, eradication, and lessons turned into evals","x":["Reimage all laptops and rotate the CEO's password","Wait for the vendor's incident report","Retrain the model and redeploy immediately"],"d":[{"h":"What it is","b":["An AI playbook extends normal incident response with AI-specific steps.","- **Scope:** which model, prompt, data and tools were involved.","- **Evidence:** prompts, retrieved documents and tool-call logs.","- **Containment:** disable the tool or feature, revoke tokens, rotate credentials.","- **Eradication:** fix the prompt or guardrail, purge poisoned data.","- **Lessons:** turn the incident into new evaluation cases."]},{"h":"Why this is the answer","b":["AI incidents do not look like malware outbreaks. Without the right evidence and containment levers, such as logs of tool calls and a way to switch off a feature, a team cannot answer what the system did."]},{"h":"Remember it","b":["Know what it touched, keep the evidence, switch it off, then test for it."]}]},{"id":"9db1b14164","q":"Structure of a security position paper on an emerging technology","a":"The problem and why now, a threat model, current controls and gaps, a recommendation with a decision needed, and how you will measure success.","s":"Problem, threat model, controls and gaps, recommendation, success metrics","x":["Abstract, methods, results, discussion, references","Features, pricing, roadmap, competitors, FAQ","Incident timeline, root cause, blame, fix"],"d":[{"h":"What it is","b":["A position paper helps leaders decide. A useful structure is: the problem and why it matters now, a threat model, current controls and gaps, a clear recommendation (and the decision needed), and how success will be measured."]},{"h":"Why this is the answer","b":["An academic layout (abstract, methods, results) or a product comparison does not drive a decision. Leaders need a point of view, the reasoning, and what you want them to do."]},{"h":"Remember it","b":["Problem, threat, gaps, recommendation, measure."]}]},{"id":"fe21410552","q":"What goes in a model risk assessment?","a":"Purpose and owner, data sources and sensitivity, expected performance, failure modes and their impact, monitoring, human oversight, and a retirement plan.","s":"Purpose, data, performance, failure modes, monitoring, oversight, retirement","x":["Vendor name, contract value, renewal date","Prompt text, temperature, and token limit","UI mockups, brand colors, and launch date"],"d":[{"h":"What it is","b":["A model risk assessment documents a model's purpose and owner, the data used and its sensitivity, expected performance, failure modes and their impact, monitoring, human oversight, and a plan for retiring it."]},{"h":"Why this is the answer","b":["It asks what could go wrong and who answers for it. Vendor names, prompt text or UI mockups describe the product, not its risk. The assessment should be updated when the model, data or use changes."]},{"h":"Remember it","b":["Purpose, data, performance, failure, monitoring, oversight, retirement."]}]},{"id":"06250794d6","q":"OAuth 2.0 vs OIDC vs SAML","a":"OAuth 2.0 = delegated authorization (access tokens). OIDC = authentication layer on top of OAuth 2.0 (ID token). SAML = XML-based federated SSO using signed assertions.","s":"OAuth 2.0 authorizes; OIDC adds authentication; SAML is XML-based federated SSO","x":["OAuth 2.0 authenticates; OIDC authorizes; SAML encrypts tokens","All three authenticate, but only SAML authorizes","OIDC is XML-based; SAML is JSON-based"],"d":[{"h":"What it is","b":["Three related but different standards.","- **OAuth 2.0:** delegated **authorization**. It lets one app get limited access to another on a user's behalf, using access tokens.","- **OpenID Connect (OIDC):** an **authentication** layer built on OAuth 2.0, adding an ID token that says who logged in.","- **SAML:** XML-based **federated single sign-on**, where an identity provider sends signed assertions to a service."]},{"h":"Why this is the answer","b":["OAuth alone does not prove who a user is. OIDC adds that for modern apps and APIs, while SAML is common in older enterprise SSO. For agents, OAuth scopes and token exchange are central."]},{"h":"Remember it","b":["OAuth: what you may access. OIDC: who you are. SAML: enterprise SSO in XML."]}]},{"id":"c900a10c96","q":"What is a CASB?","a":"Cloud access security broker: gives visibility into and control over SaaS and cloud usage (shadow IT discovery, DLP, access policy).","s":"Visibility and control over SaaS and cloud usage","x":["A cloud backup service","A network firewall appliance","A cloud billing dashboard"],"d":[{"h":"What it is","b":["A cloud access security broker sits between users and cloud services to give visibility and control over their use. Typical functions include discovering shadow IT, data loss prevention, and enforcing access policies."]},{"h":"Why this is the answer","b":["It is a control for **SaaS and cloud usage**, not a backup service, firewall or billing tool. For AI, a CASB can show which AI services employees use and apply rules about what data may go to them."]},{"h":"Remember it","b":["A CASB watches and governs how people use cloud apps."]}]},{"id":"c44b002d69","q":"SOC 2 Trust Services Criteria","a":"Security (required), availability, processing integrity, confidentiality, privacy.","s":"Security, availability, processing integrity, confidentiality, privacy","x":["Security, scalability, portability, compliance, performance","Authentication, authorization, accounting, auditing, availability","Confidentiality, integrity, availability, non-repudiation, privacy"],"d":[{"h":"What it is","b":["SOC 2 reports on controls against five Trust Services Criteria: **security** (required), availability, processing integrity, confidentiality and privacy."]},{"h":"Why this is the answer","b":["Security is the common baseline, and an organization chooses which of the others to include in scope. When assessing a vendor, check which criteria the report actually covers and whether the AI feature is inside the audited system."]},{"h":"Remember it","b":["Security, availability, processing integrity, confidentiality, privacy."]}]},{"id":"8faf1b2442","q":"Non-human identities in IAM","a":"Service accounts, API keys, OAuth apps, and agents. Inventory them, assign owners, scope them minimally, rotate or expire credentials, and log their actions.","s":"Service accounts, API keys, OAuth apps, and agents: inventory, scope, rotate, log","x":["Only service accounts; agents count as users","Only API keys; everything else is a user","Only bots in chat tools"],"d":[{"h":"What it is","b":["Non-human identities are credentials and principals that are not people: service accounts, API keys, OAuth apps, bots, and now AI agents."]},{"h":"Why this is the answer","b":["They often outnumber people, hold broad access, and are rarely reviewed. Good practice: inventory them, assign owners, give least privilege, use short-lived credentials or rotation, and log their actions. Agents should not be treated as ordinary users or hidden behind a shared account."]},{"h":"Remember it","b":["If it can authenticate, it needs an owner."]}]},{"id":"e8cf3f2e08","q":"STRIDE","a":"Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege. For AI systems, apply it at each trust boundary: user to app, app to model, model to tools, retrieval to model.","s":"Spoofing, Tampering, Repudiation, Information disclosure, DoS, Elevation of privilege","x":["Spoofing, Theft, Replay, Injection, Deception, Exploitation","Scanning, Tampering, Reconnaissance, Intrusion, Denial, Escalation","Safety, Trust, Reliability, Integrity, Disclosure, Ethics"],"d":[{"h":"What it is","b":["STRIDE is a threat-modeling mnemonic: **S**poofing, **T**ampering, **R**epudiation, **I**nformation disclosure, **D**enial of service, **E**levation of privilege."]},{"h":"Why this is the answer","b":["It gives a checklist of threat types to apply at each point where data crosses a trust boundary. For AI systems, those boundaries include user to app, app to model, model to tools, and retrieval to model. Walking STRIDE across each one finds issues a general review misses."]},{"h":"Remember it","b":["Ask the six STRIDE questions at every boundary."]}]},{"id":"5007f00d51","q":"What is fine-tuning's main security risk?","a":"Training data leakage (memorization of sensitive records) and poisoned or low-quality data changing model behavior. Treat the fine-tuning dataset like production data.","s":"Training data leakage, and poisoned data changing behavior","x":["Slower inference","Higher token prices","Loss of the model's tokenizer"],"d":[{"h":"What it is","b":["Fine-tuning trains a model further on your own data."]},{"h":"Why this is the answer","b":["It carries two main risks. First, the model can memorize and later reveal sensitive records in the training set (data leakage). Second, poisoned or low-quality data can change the model's behavior. Treat the fine-tuning dataset like production data: control access, remove sensitive fields, and test the tuned model."]},{"h":"Remember it","b":["What you tune on can come back out."]}]},{"id":"38b7a1a4ea","q":"Who should own an AI system's risk?","a":"A named business owner, with security as advisor and reviewer. Without an owner no one decides, fixes, or shuts it down.","s":"A named business owner, with security as advisor and reviewer","x":["The model vendor","The security team alone","Whoever deployed it first"],"d":[{"h":"What it is","b":["Each AI system needs a named business owner who decides how it is used and accepts residual risk. Security advises, reviews and tests."]},{"h":"Why this is the answer","b":["Ownership assigns the decision to the party who gets the value. If the vendor or the security team alone owns the risk, nobody with the authority to change the use case is accountable. Without an owner, no one decides, fixes or shuts it down."]},{"h":"Remember it","b":["Security advises; the business owns the risk."]}]},{"id":"540fd6bbd9","q":"What is \"shadow AI\"?","a":"AI tools and features used outside IT and security oversight. Find them with IdP grants, proxy logs, and expense data, then bring the valuable ones into an approved path.","s":"Unapproved AI tools and features used outside IT or security oversight","x":["AI running on idle servers","AI that works without data","Models that hide their reasoning"],"d":[{"h":"What it is","b":["Shadow AI is AI tools and features used without approval or oversight from IT and security, such as personal accounts for chatbots or AI extensions installed by employees."]},{"h":"Why this is the answer","b":["It creates unmanaged data flows. The goal is not just to block it but to find it, understand why people use it, and offer an approved alternative so the need is met safely."]},{"h":"Remember it","b":["If people have to hide it to use it, give them a safe way to use it."]}]},{"id":"50a96aa98d","q":"Which data should never go into an unapproved AI tool?","a":"Regulated and confidential data: PHI, payment data, credentials, source secrets, and customer confidential material.","s":"Regulated and confidential data such as PHI, payment data, and credentials","x":["Public marketing copy","Open-source code","Published research papers"],"d":[{"h":"What it is","b":["Regulated and confidential data: health information (PHI), payment card data, credentials and secrets, source code secrets, and customer confidential material."]},{"h":"Why this is the answer","b":["Once data goes to an unapproved service, you may lose control over retention, training use and who can access it, and you may breach legal or contractual duties. Public marketing text, open-source code and published papers are generally low risk."]},{"h":"Remember it","b":["If it would hurt to leak, keep it out of unapproved tools."]}]},{"id":"d61c2f13fa","q":"Why keep an AI inventory with an owner and a data class for each use case?","a":"Reviews, incidents, and shutdowns need someone to contact and something specific to act on.","s":"So reviews, incidents, and shutdowns have an owner and a target","x":["To rank employees by AI usage","To satisfy one vendor's license audit","To reduce model hallucinations"],"d":[{"h":"What it is","b":["An inventory is a register of AI systems and use cases, each with an owner and the class of data it touches."]},{"h":"Why this is the answer","b":["Every other process depends on it. A review needs to know what exists, an incident needs someone to call, and a shutdown needs a target. It is not a ranking of employees or a vendor license audit."]},{"h":"Remember it","b":["You cannot review, defend or shut down what you have not listed."]}]},{"id":"2fc86c765d","q":"What is a risk-tiered AI review?","a":"Deeper review for higher-impact or more sensitive use cases, and a fast path for low-risk ones, so security does not become the bottleneck.","s":"Deeper review for higher-risk use cases, a fast path for low risk","x":["Every use case gets the same full review","Only customer-facing systems are reviewed","Review depth depends on the vendor's size"],"d":[{"h":"What it is","b":["A review process whose depth depends on risk. Higher-impact or more sensitive use cases get deeper review, and low-risk ones get a fast path."]},{"h":"Why this is the answer","b":["Treating every request the same either slows everyone down or rubber-stamps the risky ones. Tiering concentrates effort where harm could be greatest, and a fast path keeps security from becoming a bottleneck that drives people to shadow AI."]},{"h":"Remember it","b":["Spend review effort where the risk is."]}]},{"id":"f49af2cb9b","q":"What evidence do auditors want for AI controls?","a":"Policies, an inventory, risk assessments, test results, and logs showing the controls actually operate.","s":"Policies, inventory, assessments, test results, and logs showing controls operate","x":["The vendor's marketing deck","One signed statement from the CISO","The model weights"],"d":[{"h":"What it is","b":["Evidence that the controls exist and operate: policies, an inventory, risk assessments, test results, and logs or records showing the controls working over time."]},{"h":"Why this is the answer","b":["Auditors test operation, not intent. A vendor's marketing deck, a single signed statement or model weights do not show your controls working. Keep records as you go, so evidence exists when asked."]},{"h":"Remember it","b":["Show that it exists, and show that it runs."]}]},{"id":"bfe3b55894","q":"What is red teaming an AI system?","a":"Adversarial testing of the whole system (model, prompts, tools, data, and permissions) for misuse and failure, not just the model in isolation.","s":"Adversarial testing of the whole system for misuse and failures","x":["Benchmarking accuracy on a public dataset","Reviewing the vendor contract","Load testing the API"],"d":[{"h":"What it is","b":["Adversarial testing of the whole system: the model, prompts, tools, data and permissions, looking for misuse and failure. Testers try injection, jailbreaks, data extraction, tool abuse and harmful outputs."]},{"h":"Why this is the answer","b":["It tests **behavior under attack**, not just accuracy. Public benchmarks, contract reviews and load tests answer other questions. Findings should become permanent test cases so fixes stay fixed."]},{"h":"Remember it","b":["Attack your own system before someone else does, and keep the tests."]}]},{"id":"df0814f398","q":"Why involve Legal and Privacy in AI reviews?","a":"Data rights, regulated data, retention, and customer commitments are legal questions that engineering cannot settle alone.","s":"Data rights, regulated data, retention, and customer commitments are legal questions","x":["They approve model architectures","They write the prompts","They manage the GPUs"],"d":[{"h":"What it is","b":["Many AI questions are legal or privacy questions: who owns the data, what regulated data is involved, how long it is kept, whether people are notified, and what you have promised customers."]},{"h":"Why this is the answer","b":["Engineering can say what is technically possible but cannot decide what is lawful or contractually allowed. Bringing Legal and Privacy in early prevents rework and avoids deploying something that breaks a commitment."]},{"h":"Remember it","b":["Technical feasibility is not permission."]}]}]},{"id":"terraform","title":"Terraform","desc":"Concepts plus the security-tooling resources you would actually deploy.","cards":[{"id":"85483d319f","q":"The core workflow commands","a":"`terraform init` (download providers and set the backend), `plan` (show the diff), `apply` (make the changes), `destroy` (remove everything managed).","s":"init, plan, apply, destroy","x":["build, test, deploy, remove","start, preview, push, stop","install, diff, run, uninstall"],"d":[{"h":"What it is","b":["The Terraform workflow has four main commands.","- `terraform init` prepares the working directory: it downloads providers and modules and configures the backend that stores state.","- `terraform plan` compares your configuration with the real world and shows what would change.","- `terraform apply` makes those changes.","- `terraform destroy` removes everything the configuration manages."]},{"h":"Why this is the answer","b":["The order is the safety net: init once, then plan to see the proposed changes, then apply only what you have reviewed. Reading the plan before applying is the habit that prevents most accidents."]},{"h":"Remember it","b":["Init, plan, apply. Destroy only on purpose."]}]},{"id":"eaabf21ac9","q":"Why use `terraform plan -out=tfplan` then `terraform apply tfplan`?","a":"Apply executes exactly the plan you reviewed, even if the infrastructure changes in between.","s":"Apply executes exactly the plan you reviewed","x":["It makes the plan run faster","It encrypts the plan file","It skips state locking"],"d":[{"h":"What it is","b":["The `-out` flag saves the plan to a file. Applying that file runs exactly the actions in it."]},{"h":"Why this is the answer","b":["If you run a plain `apply`, Terraform calculates a new plan at that moment. Infrastructure or code could have changed since you reviewed the earlier one, so what runs might differ from what you approved. Applying the saved plan guarantees the reviewed change is the executed change, which is why CI pipelines use it."]},{"h":"Remember it","b":["Apply the plan you actually reviewed."]}]},{"id":"8e2bf526ba","q":"What is Terraform state?","a":"The mapping between your configuration and the real resources, including their attributes. It can contain secrets in plaintext.","s":"The mapping from your config to real resources, which can hold secrets","x":["A cache of downloaded provider plugins","A log of every apply","The list of input variables"],"d":[{"h":"What it is","b":["State is a file (or remote record) that maps each resource in your configuration to a real object, such as an S3 bucket's ID, along with its attributes."]},{"h":"Why this is the answer","b":["Without state Terraform cannot tell what it already created, so it could not update or delete anything correctly. State also stores resource attributes, which can include secrets such as database passwords, so it must be protected like a credential."]},{"h":"Remember it","b":["State is Terraform's memory, and it may hold secrets."]}]},{"id":"3ccd32d07c","q":"How should state be stored and protected?","a":"Remote backend (for example S3) with encryption, versioning, restricted access, and state locking. Never commit state to git.","s":"Remote encrypted backend with versioning, restricted access, and locking; never in git","x":["Committed to git so everyone has it","On a shared laptop","Only in CI logs"],"d":[{"h":"What it is","b":["Use a remote backend such as an S3 bucket with encryption, versioning, restricted access and state locking. Do not commit state to git."]},{"h":"Why this is the answer","b":["Local state cannot be shared safely, can be lost, and sits on one laptop. Git history keeps secrets forever. A remote backend gives shared access, recovery through versioning, protection through encryption and permissions, and locking to stop two people applying at once."]},{"h":"Remember it","b":["Remote, encrypted, versioned, locked, and never in git."]}]},{"id":"5cfadf8951","q":"Marking a variable `sensitive = true` does what, and not what?","a":"Hides the value in CLI output. It is still stored in plaintext in state.","s":"It hides the value in CLI output, but state still holds it in plaintext","x":["It encrypts the value in state","It removes the value from state","It stops the variable being passed to modules"],"d":[{"h":"What it is","b":["`sensitive = true` hides the value in Terraform's console output, such as plan and apply displays."]},{"h":"Why this is the answer","b":["It does **not** encrypt the value or keep it out of the state file, where it is still stored in plain text. It is a display setting, not a security control for the value itself. Protect state access, and prefer pulling secrets from a secrets manager."]},{"h":"Remember it","b":["Hidden on screen, still written in state."]}]},{"id":"4a76303916","q":"What is drift and how do you detect it?","a":"Real infrastructure differs from state or config (someone changed it by hand). `terraform plan` shows it; `plan -refresh-only` shows only drift.","s":"Real infrastructure differs from state or config; plan shows it","x":["Provider versions differ across machines; init shows it","The state file grows over time; fmt shows it","Modules fall behind registry versions; validate shows it"],"d":[{"h":"What it is","b":["Drift is when real infrastructure no longer matches what Terraform expects, usually because someone changed it by hand in the console or another tool did."]},{"h":"Why this is the answer","b":["`terraform plan` refreshes real state and shows the differences, and `terraform plan -refresh-only` shows only drift without proposing configuration changes. Detecting drift matters for security because manual changes may weaken a setting, and the next apply might silently revert or overwrite them."]},{"h":"Remember it","b":["Plan tells you where reality has wandered from the code."]}]},{"id":"f18e422dd2","q":"`count` vs `for_each`","a":"`count` indexes resources by position, so removing a middle item shifts and recreates the rest. `for_each` keys by a stable string, so items are independent.","s":"count is index-based and shifts; for_each is keyed and stable","x":["count is keyed and stable; for_each is index-based","They are identical","for_each only works with modules"],"d":[{"h":"What it is","b":["Both create multiple copies of a resource.","- `count` uses a number and identifies copies by **position** (0, 1, 2).","- `for_each` uses a map or set and identifies copies by **key**."]},{"h":"Why this is the answer","b":["If you remove the second item from a `count` list, everything after it shifts down a position, so Terraform may destroy and recreate resources that did not need to change. With `for_each`, each item has a stable key and is unaffected by its neighbors."]},{"h":"Remember it","b":["Position shifts. Keys stay."]}]},{"id":"ca8fc05aa7","q":"How do you bring an existing resource under Terraform management?","a":"An `import` block (or `terraform import`) plus a matching resource configuration.","s":"An import block (or terraform import) plus matching config","x":["terraform refresh on the resource","terraform taint, then apply","Copy the resource into the state file by hand"],"d":[{"h":"What it is","b":["Importing links a real resource to a resource block in your configuration, using an `import` block or the `terraform import` command."]},{"h":"Why this is the answer","b":["You write a matching resource configuration, then import so Terraform records the existing object in state instead of creating a duplicate. After import, run a plan and adjust the configuration until it shows no unwanted changes. Commands such as `taint` or `refresh` do something different."]},{"h":"Remember it","b":["Write the block, then import the thing."]}]},{"id":"f288846289","q":"What is a module?","a":"A reusable group of resources with input variables and outputs.","s":"A reusable group of resources with inputs and outputs","x":["A provider plugin binary","A saved plan file","A state backend"],"d":[{"h":"What it is","b":["A module is a reusable group of Terraform resources with input variables and outputs. Every configuration is a module, and you can call other modules from it."]},{"h":"Why this is the answer","b":["Modules let you package a pattern once, such as a logging bucket with the right security settings, and reuse it consistently. That consistency is itself a security benefit: fix it in the module and every user gets the fix."]},{"h":"Remember it","b":["A function for infrastructure."]}]},{"id":"5054cbc187","q":"Data source vs resource","a":"A data source reads something that exists (read-only). A resource creates and manages it.","s":"A data source reads what exists; a resource creates and manages it","x":["A data source creates; a resource reads","Both create, but data sources are faster","Data sources are only for secrets"],"d":[{"h":"What it is","b":["A **resource** block creates and manages something. A **data** block only reads information about something that already exists, for example looking up an AMI or the current account ID."]},{"h":"Why this is the answer","b":["Data sources never change infrastructure. They let you use things managed elsewhere without taking ownership of them. Mixing them up leads to Terraform trying to create something you only meant to look up."]},{"h":"Remember it","b":["Resource = I own it. Data = I only look at it."]}]},{"id":"23cfb86bbb","q":"Implicit vs explicit dependencies","a":"Referencing another resource's attribute creates an implicit dependency. `depends_on` is for dependencies Terraform cannot see.","s":"References create implicit dependencies; depends_on covers hidden ones","x":["Dependencies only come from depends_on","Order follows file order","Order follows alphabetical resource names"],"d":[{"h":"What it is","b":["Terraform builds a graph of what depends on what.","- **Implicit:** when one resource references another's attribute, Terraform knows to create the first one first.","- **Explicit:** `depends_on` tells it about a dependency it cannot see from references."]},{"h":"Why this is the answer","b":["Files are not executed in order. The graph decides order, so relying on file position or alphabetical order is a mistake. Use references where possible and `depends_on` only for hidden relationships, such as an IAM policy that must exist before a resource that uses it indirectly."]},{"h":"Remember it","b":["References make the order. depends_on fills gaps."]}]},{"id":"a319f8f5a5","q":"Lifecycle arguments you should know","a":"`prevent_destroy` (block deletion), `create_before_destroy` (replace safely), `ignore_changes` (ignore drift on chosen attributes).","s":"prevent_destroy, create_before_destroy, ignore_changes","x":["init, plan, apply","force_new, taint, untaint","depends_on, count, for_each"],"d":[{"h":"What it is","b":["The `lifecycle` block changes how Terraform treats a resource.","- `prevent_destroy` makes a plan fail if it would delete the resource.","- `create_before_destroy` builds the replacement first.","- `ignore_changes` ignores drift on selected attributes."]},{"h":"Why this is the answer","b":["They protect critical resources, such as log buckets and databases, from accidental deletion, and avoid downtime during replacement. Use `ignore_changes` sparingly: it can hide changes you actually want to notice."]},{"h":"Remember it","b":["Protect it, replace it safely, or ignore a field on purpose."]}]},{"id":"68ed26940a","q":"What does `.terraform.lock.hcl` do?","a":"Pins exact provider versions and checksums. Commit it so everyone, and CI, uses the same providers.","s":"It pins provider versions and checksums, so commit it","x":["It locks the state against concurrent applies","It stores provider credentials","It lists module sources"],"d":[{"h":"What it is","b":["The dependency lock file records the exact provider versions and checksums selected by `terraform init`."]},{"h":"Why this is the answer","b":["Committing it makes everyone, including CI, use the same provider builds, and prevents a changed or tampered provider from being used silently. It is not a state lock or a credential store."]},{"h":"Remember it","b":["It pins the providers. Commit it."]}]},{"id":"97d9538c67","q":"In a plan, what does `-/+` mean and why does it matter?","a":"The resource will be destroyed and recreated. Check it carefully: it can mean downtime or data loss.","s":"Destroy and recreate: check for downtime or data loss","x":["Update in place with no impact","The resource will be imported","The resource will move to another state"],"d":[{"h":"What it is","b":["The `-/+` symbol means Terraform will **destroy and recreate** the resource, often because a changed setting cannot be updated in place."]},{"h":"Why this is the answer","b":["Replacement can mean downtime or data loss: a database, a disk or an IP address may be new afterward. Always scan a plan for `-/+` and `destroy` actions before approving, and consider `prevent_destroy` on critical resources."]},{"h":"Remember it","b":["`-/+` means it will be rebuilt. Check what is in it."]}]},{"id":"0df6e91f28","q":"The `moved` block","a":"Records that a resource was renamed or relocated so Terraform updates state instead of destroying and recreating it.","s":"It records a rename so state updates without destroy and recreate","x":["It moves state to another backend","It moves resources between regions","It forces recreation of the resource"],"d":[{"h":"What it is","b":["A `moved` block records that a resource's address in the configuration has changed, such as after renaming it or putting it into a module."]},{"h":"Why this is the answer","b":["Without it, Terraform sees the old address vanish and a new one appear, and plans to destroy the old resource and create a new one. With `moved`, state is updated in place and the real resource is untouched."]},{"h":"Remember it","b":["Renaming in code should not mean rebuilding in the cloud."]}]},{"id":"3bee276363","q":"Terraform vs Pulumi","a":"Terraform uses HCL, a declarative DSL. Pulumi uses general-purpose languages (Python, TypeScript). Both are declarative and state-based.","s":"Terraform uses HCL; Pulumi uses general-purpose languages","x":["Terraform is imperative; Pulumi is declarative","Terraform has no state; Pulumi stores state","Pulumi only works on AWS"],"d":[{"h":"What it is","b":["Both describe infrastructure declaratively and keep state. Terraform uses its own language, HCL. Pulumi lets you use general-purpose languages such as Python or TypeScript."]},{"h":"Why this is the answer","b":["They are different approaches to the same problem, not imperative versus declarative or stateless versus stateful. Teams that want loops, tests and libraries from a real language may prefer Pulumi, while many prefer HCL's constrained simplicity and wide ecosystem."]},{"h":"Remember it","b":["Same idea. Different language."]}]},{"id":"0b48a25bec","q":"Scanning Terraform for security problems","a":"Static checks (Checkov, Trivy/tfsec) on the code, and policy-as-code (OPA/Conftest, Sentinel) on the plan, for example `terraform show -json tfplan`. Run them in CI before apply.","s":"Static checks (Checkov, Trivy) plus policy on the plan (OPA/Conftest, Sentinel)","x":["Only terraform validate","Only manual code review","Only runtime scanning after deploy"],"d":[{"h":"What it is","b":["Two kinds of checks.","- **Static analysis of the code:** tools such as Checkov and Trivy flag risky settings, like a public bucket.","- **Policy as code on the plan:** engines such as OPA/Conftest or Sentinel evaluate the planned changes against rules."]},{"h":"Why this is the answer","b":["Static checks catch known bad patterns early. Plan-based policies see the computed values and can enforce organization-specific rules. Run both in CI before apply, because manual review and runtime scanning find problems later and cost more."]},{"h":"Remember it","b":["Scan the code, then check the plan, before anything is built."]}]},{"id":"d1a2dff5b0","q":"Which resources make up a minimal AWS detection stack in Terraform?","a":"`aws_cloudtrail` (multi-region, log file validation, KMS), an S3 log bucket with public access block, `aws_guardduty_detector`, an EventBridge rule (`aws_cloudwatch_event_rule`) targeting an alert Lambda or SNS, and a least-privilege `aws_iam_role` for the Lambda.","s":"CloudTrail, S3 log bucket, GuardDuty, EventBridge rule, alert Lambda, least-privilege role","x":["EC2, RDS, ALB, Route 53","VPC peering, NAT gateway, Direct Connect","Cognito, API Gateway, DynamoDB"],"d":[{"h":"What it is","b":["A starter set for detection and logging in AWS:","- A CloudTrail trail (multi-region, with log file validation).","- An S3 bucket for logs, with public access blocked.","- A GuardDuty detector.","- An EventBridge rule that sends findings to an alert target.","- A Lambda function or SNS topic to deliver the alert.","- A least-privilege IAM role for that function."]},{"h":"Why this is the answer","b":["Together they cover recording activity, storing it safely, detecting threats and notifying someone. Compute, databases and networking resources describe an application, not a detection capability."]},{"h":"Remember it","b":["Record it, store it, detect it, route it, tell someone."]}]},{"id":"3712af97a4","q":"How should CI authenticate to AWS for Terraform?","a":"OIDC federation to a role with short-lived credentials, not long-lived access keys stored as secrets.","s":"OIDC federation to a role with short-lived credentials","x":["Long-lived access keys stored as CI secrets","The root account's keys","An engineer's personal credentials"],"d":[{"h":"What it is","b":["Use OIDC federation: the CI system presents a short-lived identity token and AWS exchanges it for temporary credentials for a specific role."]},{"h":"Why this is the answer","b":["Long-lived access keys stored as CI secrets can leak and rarely get rotated. With OIDC there is nothing durable to steal, and you can restrict the role to a particular repository and branch. Never use root credentials or personal credentials in pipelines."]},{"h":"Remember it","b":["Temporary credentials, scoped to the repo, beat stored keys."]}]},{"id":"4fecb8fa88","q":"Workspaces vs separate directories or accounts for environments","a":"Workspaces share one backend and config, so mistakes cross environments easily. Many teams prefer separate state per environment, ideally per account.","s":"Workspaces share one backend and config, so mistakes cross environments","x":["Workspaces isolate accounts automatically","Workspaces require separate providers","Workspaces cannot hold state"],"d":[{"h":"What it is","b":["Workspaces give one configuration multiple state files within the same backend. Separate directories or accounts give each environment its own configuration, state and permissions."]},{"h":"Why this is the answer","b":["Because workspaces share a backend and configuration, it is easy to apply the right code to the wrong environment, and access control is shared as well. Separate state per environment, ideally in separate accounts, limits the blast radius of mistakes."]},{"h":"Remember it","b":["Same backend, easy to mix up. Separate accounts, hard to mix up."]}]},{"id":"8b268fe661","q":"The bootstrap problem with an S3 backend","a":"The bucket that holds state must exist before Terraform can use it. Create it with a small separate config or by hand, then migrate state in.","s":"The state bucket must exist first: create it separately, then migrate state in","x":["Terraform creates the backend bucket automatically","Backends need no storage","Use local state forever"],"d":[{"h":"What it is","b":["Terraform needs the state bucket before it can store state, but the bucket is infrastructure you would like Terraform to create."]},{"h":"Why this is the answer","b":["The usual solution is to create the bucket (and lock mechanism) with a small separate configuration or by hand, then configure the main configuration to use it and migrate state. Terraform cannot create its own backend mid-run."]},{"h":"Remember it","b":["Make the storage first, then move in."]}]},{"id":"4a40c636da","q":"What do `terraform fmt` and `terraform validate` do?","a":"`fmt` rewrites files to the canonical style. `validate` checks syntax and internal consistency without touching real infrastructure. Run both in CI.","s":"fmt rewrites style; validate checks syntax and consistency","x":["fmt checks cloud state; validate formats code","Both apply changes","fmt validates providers; validate formats files"],"d":[{"h":"What it is","b":["`terraform fmt` rewrites files into the standard style. `terraform validate` checks that the configuration is syntactically valid and internally consistent."]},{"h":"Why this is the answer","b":["Neither touches real infrastructure or compares against state. Together they are fast checks to run in CI so that style problems and simple mistakes are caught before a plan."]},{"h":"Remember it","b":["fmt tidies. validate checks sense."]}]},{"id":"352551ba0f","q":"How do you keep secrets out of Terraform code?","a":"Fetch them from a secrets manager at runtime, never commit `terraform.tfvars` with secrets, and remember that anything a resource reads can still land in state.","s":"Use a secrets manager and keep secret values out of files and state where possible","x":["Put them in terraform.tfvars and commit it","Base64-encode them in the config","Name the variable `secret`"],"d":[{"h":"What it is","b":["Fetch secrets from a secrets manager at runtime, do not commit files such as `terraform.tfvars` that contain them, and be aware that anything a resource reads or sets may end up in state."]},{"h":"Why this is the answer","b":["Encoding a secret (for example with base64) does not protect it, and naming a variable `secret` does nothing. Because state can still contain values, combine good sourcing with strict access to state."]},{"h":"Remember it","b":["Never in code, and watch state."]}]},{"id":"5da48586ec","q":"How do you force a resource to be recreated?","a":"`terraform apply -replace=ADDRESS`. The older `terraform taint` does the same and is deprecated.","s":"`terraform apply -replace=ADDRESS`","x":["`terraform state rm ADDRESS`","`terraform refresh ADDRESS`","`terraform import ADDRESS`"],"d":[{"h":"What it is","b":["`terraform apply -replace=ADDRESS` tells Terraform to destroy and recreate that resource."]},{"h":"Why this is the answer","b":["The older `terraform taint` marked a resource for replacement and is deprecated in favor of `-replace`, which shows up clearly in the plan. `state rm` and `import` do different things: forget a resource and adopt one."]},{"h":"Remember it","b":["-replace rebuilds. It shows in the plan."]}]},{"id":"907050020f","q":"What does `terraform state rm` do?","a":"Removes a resource from state without destroying the real thing. Terraform then forgets it, and a later plan may want to create a duplicate.","s":"Removes it from state without destroying the real resource","x":["Destroys the real resource","Deletes the whole state file","Reverts state to the last apply"],"d":[{"h":"What it is","b":["It removes a resource from Terraform's state **without** destroying the real resource."]},{"h":"Why this is the answer","b":["Terraform stops managing the object but it keeps existing. The risk is that a later plan sees the configuration with no state and wants to create a duplicate. It is useful when you want to hand a resource to another configuration, not to delete it."]},{"h":"Remember it","b":["Forget, don't destroy."]}]},{"id":"8ea2dfe3f6","q":"What is a provider alias for?","a":"Using the same provider more than once with different settings, for example another region or another AWS account.","s":"Using one provider with different configs, such as another region or account","x":["Renaming a provider's resources","Caching provider downloads","Pinning a provider version"],"d":[{"h":"What it is","b":["An alias lets you configure the same provider more than once with different settings, such as two AWS regions or two accounts, and choose which one a resource uses."]},{"h":"Why this is the answer","b":["Some designs need multiple regions or cross-account setups, for example a CloudTrail trail in one account and a bucket in another. Aliases express that without separate configurations. They do not rename resources or pin versions."]},{"h":"Remember it","b":["Same provider, different settings."]}]},{"id":"9f937e3f63","q":"Which security settings should a log bucket have?","a":"Block Public Access, encryption (KMS), versioning, and a restrictive bucket policy. For evidence, add Object Lock and keep the bucket in a separate account.","s":"Block public access, encryption, versioning, and a restrictive policy","x":["Public read so analysts can download logs","ACLs granting all AWS users read access","No encryption, to keep queries fast"],"d":[{"h":"What it is","b":["For a bucket that holds security logs: block public access, encryption (ideally with a KMS key), versioning, and a restrictive bucket policy. For evidence, add Object Lock and keep the bucket in a separate account."]},{"h":"Why this is the answer","b":["Logs are what you rely on in an investigation, so they must resist exposure and tampering. Public read, broad ACLs or no encryption all invite the problems logs are supposed to help you investigate."]},{"h":"Remember it","b":["Private, encrypted, versioned, locked down."]}]},{"id":"4e5328eb76","q":"How do you test a Terraform module?","a":"`validate` and `plan` checks in CI, policy tests on the plan, and a real apply in a sandbox account (for example with Terratest).","s":"Validate and plan in CI, policy tests, and a sandbox apply","x":["Only read the code","Only apply it to production","Only unit tests of the provider"],"d":[{"h":"What it is","b":["Layers of testing: `validate` and `plan` checks in CI, policy tests on the plan, and a real apply in a sandbox account, for example with a tool such as Terratest."]},{"h":"Why this is the answer","b":["Reading the code or applying straight to production does not prove the module works. A sandbox apply shows real behavior, and policy tests catch insecure configurations before they reach anything important."]},{"h":"Remember it","b":["Check it statically, then try it for real somewhere safe."]}]},{"id":"b15c27d80b","q":"What is a sensible CI flow for Terraform?","a":"Format and validate, scan, plan on the pull request, review the plan, then apply from the main branch with a short-lived role.","s":"Format and validate, scan, plan on pull request, review, apply from main","x":["Apply from every developer laptop","Apply on every commit to any branch","Plan only in production"],"d":[{"h":"What it is","b":["Format and validate, scan for security issues, plan on the pull request, have a person review the plan, then apply from the main branch using a short-lived role."]},{"h":"Why this is the answer","b":["Every change gets the same checks, the reviewer sees exactly what will change, and nothing is applied from an individual's laptop. Applying on every commit to any branch, or planning only in production, skips the review that makes the flow safe."]},{"h":"Remember it","b":["Plan on the pull request, apply from main."]}]},{"id":"726fc17dc1","q":"Why keep separate state per account or environment?","a":"A mistake, a leak, or a bad apply is limited to one blast radius.","s":"A mistake or leak is limited to one blast radius","x":["It only makes plans faster","Providers require it","State files cannot exceed 1 MB"],"d":[{"h":"What it is","b":["Each account or environment has its own state file and backend, usually with its own permissions."]},{"h":"Why this is the answer","b":["It limits the **blast radius**: a bad apply, a leaked state file, or a stolen credential affects one environment, not all of them. Speed and provider requirements are not the reasons."]},{"h":"Remember it","b":["Smaller state, smaller disaster."]}]}]},{"id":"aws_ir","title":"AWS cloud incident response","desc":"Logs, attacker behavior, containment, and evidence handling.","cards":[{"id":"5d6eb397b3","q":"The incident response phases (NIST SP 800-61)","a":"Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident Activity.","s":"Preparation; Detection and Analysis; Containment, Eradication and Recovery; Post-Incident","x":["Identify, Protect, Detect, Respond, Recover","Plan, Build, Run, Retire","Detect, Alert, Escalate, Close"],"d":[{"h":"What it is","b":["NIST's incident handling guide describes a life cycle with four phases.","- **Preparation:** tools, access, runbooks, logging and training in place before anything happens.","- **Detection and Analysis:** spotting an incident and working out what it is and how big.","- **Containment, Eradication and Recovery:** stop the spread, remove the cause, restore service.","- **Post-Incident Activity:** lessons learned and improvements."]},{"h":"Why this is the answer","b":["The phases are a loop, not a line: what you learn afterward improves preparation. The CSF's five functions (Identify, Protect, Detect, Respond, Recover) are a different framework. In AWS, the preparation phase decides how well the rest goes: if logging was never enabled, analysis has nothing to work with."]},{"h":"Remember it","b":["Prepare, detect and analyze, contain and recover, learn."]}]},{"id":"7171d0909b","q":"What does CloudTrail record, and what is off by default?","a":"AWS API activity. Management events are on; data events (S3 object-level, Lambda invoke) are off by default and cost extra.","s":"AWS API activity; management events are on, data events are off by default","x":["Network packets; flow logs are on by default","Application logs; everything is on by default","Billing data; off by default"],"d":[{"h":"What it is","b":["CloudTrail records API activity in your AWS account: who called what, from where, and when.","- **Management events** (control-plane actions such as creating a user) are recorded by default.","- **Data events** (such as S3 object reads or Lambda invocations) are **off by default** and cost extra to enable."]},{"h":"Why this is the answer","b":["The gap matters in investigations. Without data events you can see that a bucket was listed but not which objects were downloaded. Decide in advance which sensitive buckets and functions deserve data-event logging."]},{"h":"Remember it","b":["Control plane on, data plane off, until you turn it on."]}]},{"id":"f93d51a1f9","q":"How far back does CloudTrail Event History go?","a":"90 days of management events. For anything longer you need a trail delivering to S3.","s":"90 days of management events","x":["30 days of all events","1 year of data events","7 days of management events"],"d":[{"h":"What it is","b":["Event History in the console and CLI shows the last **90 days** of management events in a region, with no setup."]},{"h":"Why this is the answer","b":["For anything older, or for data events, you need a trail delivering logs to S3. Many investigations begin weeks after the intrusion, so create an organization trail early so history exists when you need it."]},{"h":"Remember it","b":["90 days free; beyond that you need your own trail."]}]},{"id":"68e082ee6e","q":"CloudTrail log file integrity validation","a":"Signed digest files let you prove log files were not altered or deleted after delivery.","s":"It proves log files were not altered or deleted after delivery","x":["It encrypts logs at rest","It compresses log files","It filters out noise events"],"d":[{"h":"What it is","b":["With validation enabled, CloudTrail also delivers hourly digest files that contain hashes of the log files and are digitally signed."]},{"h":"Why this is the answer","b":["It lets you prove that log files were **not modified or deleted** after delivery, which is vital for trusting logs in an investigation or legal matter. It is about integrity, not encryption or compression."]},{"h":"Remember it","b":["Signed hashes prove the logs were not tampered with."]}]},{"id":"93e8780ed4","q":"Why keep logs in a separate security or log-archive account?","a":"A compromised workload account cannot erase the evidence if it cannot write or delete in the log account.","s":"A compromised workload account cannot erase evidence it cannot write or delete","x":["It reduces CloudTrail cost","It speeds up log delivery","AWS requires it for CloudTrail"],"d":[{"h":"What it is","b":["Send logs to a dedicated account that workload teams and most administrators cannot write to or delete from."]},{"h":"Why this is the answer","b":["An attacker who compromises a workload account often tries to erase their tracks. If the logs live in another account with tight permissions, that is much harder. Separate accounts also give security teams a place to run tools without being affected by a compromised workload."]},{"h":"Remember it","b":["Don't store the evidence where the suspect has the keys."]}]},{"id":"3d70cce8cc","q":"AKIA vs ASIA key prefixes","a":"AKIA = long-term IAM user access key. ASIA = temporary credentials from STS (role sessions).","s":"AKIA is a long-term IAM key; ASIA is a temporary STS credential","x":["AKIA is temporary; ASIA is long-term","AKIA is for roles; ASIA is for root","Both are long-term; the prefix is the region"],"d":[{"h":"What it is","b":["The first four letters of an AWS access key ID tell you its type.","- **AKIA:** a long-term access key belonging to an IAM user (or the root user).","- **ASIA:** a temporary credential issued by AWS STS, such as from an assumed role."]},{"h":"Why this is the answer","b":["It shapes the response. A leaked AKIA key can be deactivated. An ASIA credential cannot be deleted; it expires, so you contain it by changing the role or denying sessions issued before a time. The prefix also hints at the source: instance roles and Lambda functions use temporary credentials."]},{"h":"Remember it","b":["AKIA = long-lived key. ASIA = temporary session."]}]},{"id":"29d5e17dab","q":"First calls an attacker makes after stealing a key","a":"`sts:GetCallerIdentity`, then enumeration: `iam:ListUsers`, `ListRoles`, `ListAttachedUserPolicies`, `s3:ListBuckets`.","s":"sts:GetCallerIdentity, then List* enumeration","x":["RunInstances, then CreateVpc","DeleteTrail, then DeleteBucket","PutObject, then PutBucketPolicy"],"d":[{"h":"What it is","b":["Attackers usually start by learning who they are and what they can do.","- `sts:GetCallerIdentity` shows which principal the key belongs to (it needs no permissions).","- Then enumeration: `iam:ListUsers`, `ListRoles`, `ListAttachedUserPolicies`, `s3:ListBuckets`, `ec2:DescribeInstances`."]},{"h":"Why this is the answer","b":["A burst of `Get*`, `List*` and `Describe*` calls from a principal or IP that has never done them is a strong early signal. Destructive or data-moving calls come later; this reconnaissance gives you a chance to catch them first."]},{"h":"Remember it","b":["Who am I, then what exists, then what can I touch."]}]},{"id":"438542837b","q":"API calls that signal persistence","a":"`CreateAccessKey`, `CreateUser`, `CreateLoginProfile`, `AttachUserPolicy`, `UpdateAssumeRolePolicy` (trusting an outside account), and new Lambda or EC2 backdoors.","s":"CreateAccessKey, CreateUser, CreateLoginProfile, AttachUserPolicy, UpdateAssumeRolePolicy","x":["DescribeInstances, ListBuckets, GetCallerIdentity","StopLogging, DeleteTrail, PutEventSelectors","GetObject, ListObjects, HeadBucket"],"d":[{"h":"What it is","b":["Persistence calls give the attacker a way back in.","- `CreateAccessKey`: a second key on an existing user.","- `CreateUser` and `CreateLoginProfile`: a new identity or a console password.","- `AttachUserPolicy`: more permissions.","- `UpdateAssumeRolePolicy`: letting an outside account assume a role."]},{"h":"Why this is the answer","b":["Rotating the original stolen key would not remove these. Find all IAM changes made by the compromised principal and undo them. The recon and exfiltration calls in the other options appear in different phases."]},{"h":"Remember it","b":["Anything that creates or widens access afterward is persistence."]}]},{"id":"bb2ab3754c","q":"API calls that signal defense evasion","a":"`StopLogging`, `DeleteTrail`, `UpdateTrail`, `PutEventSelectors` (CloudTrail), and `DeleteDetector` (GuardDuty).","s":"StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors, DeleteDetector","x":["CreateAccessKey, CreateUser, AttachUserPolicy","RunInstances, CreateVpc, AllocateAddress","GetObject, PutObject, DeleteObject"],"d":[{"h":"What it is","b":["Attackers try to blind your monitoring.","- CloudTrail: `StopLogging`, `DeleteTrail`, `UpdateTrail`, `PutEventSelectors` (narrowing what is recorded).","- GuardDuty: `DeleteDetector`."]},{"h":"Why this is the answer","b":["Legitimate administrators rarely do these things, and attackers often do them early, so alerting on them is high value and low noise. Protect the trail with an organization trail and strong permissions so these calls fail."]},{"h":"Remember it","b":["When someone touches logging, treat it as hostile until proven otherwise."]}]},{"id":"8
