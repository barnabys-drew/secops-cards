a44813f12","q":"Contain a leaked IAM user access key. Steps in order.","a":"Scope it in CloudTrail by access key ID; deactivate (do not delete) the key; review everything it did and any persistence it created; rotate affected secrets; fix how the key leaked.","s":"Scope in CloudTrail, deactivate the key, review actions and persistence, rotate, fix the leak","x":["Delete the key, then restart the instance","Rotate the root password and wait","Disable GuardDuty to cut noise, then investigate"],"d":[{"h":"What it is","b":["A sensible sequence:","- **Scope:** search CloudTrail by the access key ID to see everything it did.","- **Deactivate** the key (do not delete it yet).","- **Review** what it did and any persistence it created.","- **Rotate** any secrets the key could reach.","- **Fix** how it leaked."]},{"h":"Why this is the answer","b":["Containing first stops further damage, but you need the scope to know what else to clean up. Deleting the key first or taking unrelated actions (resetting root, disabling GuardDuty) either destroy evidence or do not address the problem."]},{"h":"Remember it","b":["Find out what it did, shut it, clean up after it, and close the hole."]}]},{"id":"91c48eda39","q":"Why deactivate rather than delete a compromised key?","a":"It stops use immediately but preserves the record for the investigation.","s":"Deactivating stops use immediately and preserves the record","x":["Deleting is slower to take effect","Deactivated keys still work for 24 hours","AWS charges for deactivated keys"],"d":[{"h":"What it is","b":["Deactivating a key makes it unusable but leaves it in IAM."]},{"h":"Why this is the answer","b":["The key's ID remains available for investigation and you can confirm what it was. It also keeps the record that it existed, and you can reactivate it if you mistakenly deactivate a legitimate one. Deactivation takes effect within seconds (IAM changes are eventually consistent, so allow a short delay). Delete it later once the investigation is finished."]},{"h":"Remember it","b":["Stop it now; remove it when you are done investigating."]}]},{"id":"2f3d0f111d","q":"You cannot invalidate an STS session token directly. What do you do?","a":"Attach a deny policy to the role with a condition on `aws:TokenIssueTime` (the console's \"Revoke active sessions\"), which blocks sessions issued before now.","s":"Attach a deny policy with an aws:TokenIssueTime condition","x":["Delete the STS token through the console","Wait: temporary tokens cannot be restricted","Rotate the IAM user's password"],"d":[{"h":"What it is","b":["Temporary credentials stay valid until they expire. To stop an issued session, attach an inline **deny** policy to the role with a condition on `aws:TokenIssueTime` that denies sessions issued before the current time. The console's \"Revoke active sessions\" does exactly that."]},{"h":"Why this is the answer","b":["The attacker's existing sessions are blocked, while new sessions issued afterward (by legitimate users, once you fix the cause) still work. Deleting a token is not possible, and changing an IAM user's password does not affect role sessions."]},{"h":"Remember it","b":["You cannot cancel the ticket, but you can say no tickets before now."]}]},{"id":"3e28934b90","q":"IMDSv2 vs IMDSv1","a":"IMDSv2 requires a session token obtained with a PUT request, which blunts SSRF-based theft of instance role credentials. Require IMDSv2 everywhere.","s":"IMDSv2 needs a session token (PUT), which blunts SSRF credential theft","x":["IMDSv2 encrypts instance metadata at rest","IMDSv2 disables the metadata service","IMDSv2 only works inside VPC endpoints"],"d":[{"h":"What it is","b":["The instance metadata service hands an EC2 instance's role credentials to code running on it.","- **IMDSv1** answers a simple GET request.","- **IMDSv2** requires a session token first, obtained with a PUT request, and is sent on later requests."]},{"h":"Why this is the answer","b":["Many server-side request forgery (SSRF) bugs can only make the server issue GET requests, which IMDSv2 blocks. Requiring IMDSv2 on all instances blunts a classic route to stolen role credentials."]},{"h":"Remember it","b":["IMDSv2 makes the attacker do something an SSRF usually cannot."]}]},{"id":"75bb18cbf9","q":"Containing a compromised EC2 instance","a":"Isolate it with a quarantine security group (no ingress or egress), snapshot its EBS volumes, preserve memory if you can, and tag it. Do not terminate it, and think before stopping it.","s":"Quarantine security group, snapshot EBS, preserve memory, tag; do not terminate","x":["Terminate it and relaunch from the AMI","Reboot it to clear the attacker's processes","Delete the instance profile only"],"d":[{"h":"What it is","b":["- Move it to a **quarantine security group** with no inbound or outbound rules.","- **Snapshot** its EBS volumes for evidence.","- **Preserve memory** if you can.","- **Tag** it so no one terminates or reuses it."]},{"h":"Why this is the answer","b":["Terminating destroys evidence, including memory, and the attacker's processes. Rebooting loses volatile data. Isolating by network cuts the attacker off while keeping everything for analysis. Deleting only the instance profile does not stop other access."]},{"h":"Remember it","b":["Isolate and preserve. Don't destroy."]}]},{"id":"e4216c2164","q":"What does GuardDuty analyze?","a":"Foundational sources are CloudTrail management events, VPC Flow Logs, and DNS logs, with optional protection for S3 data events, EKS, RDS logins, Lambda, and malware scanning.","s":"CloudTrail management events, VPC Flow Logs, DNS logs, plus optional protections","x":["Only EC2 system logs","Only S3 object contents","Application source code"],"d":[{"h":"What it is","b":["GuardDuty is a managed threat detection service. Its foundational data sources are CloudTrail management events, VPC Flow Logs and DNS logs. Optional protection plans add S3 data events, EKS audit logs, RDS login activity, Lambda network activity and malware scanning."]},{"h":"Why this is the answer","b":["It analyzes AWS telemetry for patterns of malicious behavior, using threat intelligence and machine learning. It does not read your application source code or the contents of your S3 objects (other than malware scanning where enabled)."]},{"h":"Remember it","b":["Logs about activity, not the contents of your data."]}]},{"id":"b69857fd00","q":"Reading a GuardDuty finding type","a":"Format starts `ThreatPurpose:ResourceType/ThreatFamily`, for example `UnauthorizedAccess:IAMUser/...`. Severity is numeric (low, medium, high).","s":"ThreatPurpose:ResourceType/ThreatFamily","x":["Severity:Region/Account","Service:Region/Resource","Source:Destination/Port"],"d":[{"h":"What it is","b":["Finding types follow the pattern `ThreatPurpose:ResourceTypeAffected/ThreatFamilyName.DetectionMechanism`. The first part, the threat purpose, tells you the stage, such as Recon, UnauthorizedAccess, Persistence or CryptoCurrency."]},{"h":"Why this is the answer","b":["Reading the name tells you the attack stage, which resource was involved and what behavior was seen before you open the details. For instance, `UnauthorizedAccess:IAMUser/...` means suspicious use of IAM credentials."]},{"h":"Remember it","b":["Purpose, then resource, then behavior."]}]},{"id":"67e63fced4","q":"Typical GuardDuty to response automation path","a":"Finding -> EventBridge rule -> Lambda, SNS, or SOAR. Keep a human approval gate for destructive actions and guard against remediation loops.","s":"Finding, EventBridge rule, Lambda/SNS/SOAR, with approval gates for destructive actions","x":["Finding, S3 bucket, Athena, email","Finding, CloudFormation, auto-delete resources","Finding, IAM, auto-attach AdministratorAccess"],"d":[{"h":"What it is","b":["GuardDuty publishes findings to EventBridge. A rule matches findings you care about and sends them to a target such as a Lambda function, an SNS topic or a SOAR platform, which enriches and notifies, and may take limited actions."]},{"h":"Why this is the answer","b":["Event-driven automation lets you respond in minutes. Keep approval gates around destructive actions, because an automated action based on a false positive, or one an attacker can trigger deliberately, can cause an outage."]},{"h":"Remember it","b":["Finding, EventBridge, automation, with a human check on anything destructive."]}]},{"id":"3601137694","q":"What is Security Hub for?","a":"Aggregates and normalizes findings from GuardDuty, Inspector, Macie, and others (ASFF format) and tracks compliance checks.","s":"It aggregates and normalizes findings from several services (ASFF)","x":["It encrypts data at rest across accounts","It stores CloudTrail logs","It scans only EC2 instances for patches"],"d":[{"h":"What it is","b":["Security Hub collects and normalizes security findings from AWS services such as GuardDuty, Inspector and Macie and from partners. It uses a common format (ASFF) and also runs compliance checks."]},{"h":"Why this is the answer","b":["It gives one place to see and prioritize findings across accounts and services. It does not generate logs itself, encrypt data, or serve as a patch scanner."]},{"h":"Remember it","b":["One pane for many finding sources."]}]},{"id":"a711e110fe","q":"What do SCPs do?","a":"Service control policies in AWS Organizations set the maximum permissions for accounts. They never grant access, and they do not restrict the management account.","s":"They set maximum permissions for accounts and never grant access","x":["They grant permissions to accounts","They apply to the management account","They replace IAM policies"],"d":[{"h":"What it is","b":["Service control policies in AWS Organizations set the **maximum** permissions available to the accounts they apply to."]},{"h":"Why this is the answer","b":["An SCP never grants anything. It acts as a guardrail: even an administrator in the account cannot do what an SCP denies. It does not apply to the management account. For response, an SCP can quickly block actions across accounts, such as using regions you do not operate in."]},{"h":"Remember it","b":["SCPs cap permissions. They do not give them."]}]},{"id":"2152a58d99","q":"Sign of cryptomining in a stolen account","a":"`RunInstances` for large or GPU instances, often in regions you never use, plus a cost spike and GuardDuty cryptocurrency findings.","s":"RunInstances of large or GPU instances in unused regions, plus a cost spike","x":["A burst of S3 PutObject calls","Many failed console logins","New IAM roles with no policies"],"d":[{"h":"What it is","b":["Common signs: `RunInstances` for large or GPU instance types, often in regions you never use; a sudden jump in cost; and GuardDuty findings in the CryptoCurrency family."]},{"h":"Why this is the answer","b":["Miners want compute in volume, and attackers often use regions you do not monitor. Billing alerts and region restrictions both help. Other patterns, like many failed logins or new roles with no policies, point to different activity."]},{"h":"Remember it","b":["Big instances in odd places plus a spike in spend."]}]},{"id":"4f9a3c3eed","q":"Root account usage: what should you expect and alert on?","a":"Almost none. Alert on any root login or API call, require MFA, and keep no access keys on root.","s":"Almost none: alert on any use, require MFA, keep no access keys","x":["Daily use for admin tasks","Use it for CI deployments","Share it across the team as break-glass"],"d":[{"h":"What it is","b":["The root user has unrestricted access and should almost never be used."]},{"h":"Why this is the answer","b":["Expect close to none. Alert on any root sign-in or API call, require MFA, and keep no access keys for root. Daily use, CI deployments or sharing as a break-glass account all expose the most powerful identity in the account."]},{"h":"Remember it","b":["Root is for a handful of rare tasks, and every use should page someone."]}]},{"id":"be072baa3c","q":"How do you find which keys are old, unused, or lack MFA?","a":"The IAM credential report (`aws iam generate-credential-report`), and `get-access-key-last-used` for specific keys.","s":"The IAM credential report","x":["CloudTrail Event History","AWS Config alone","The billing console"],"d":[{"h":"What it is","b":["The IAM **credential report** lists every user with details such as password age, access key age, last use and whether MFA is enabled. You generate it with `aws iam generate-credential-report`."]},{"h":"Why this is the answer","b":["It is a quick, account-wide view for hygiene and investigations. CloudTrail shows activity, not the state of credentials, and billing data does not show key status."]},{"h":"Remember it","b":["The credential report is the account's credential inventory."]}]},{"id":"e574b77897","q":"Investigating CloudTrail at scale","a":"Query logs in S3 with Athena, using partition projection to keep scans small. For a quick look use `aws cloudtrail lookup-events` (management events only, 90 days).","s":"Athena over CloudTrail in S3 with partition projection; lookup-events for quick checks","x":["Download every log file and grep locally","Use CloudWatch metrics alone","Use Event History for two-year lookbacks"],"d":[{"h":"What it is","b":["For large investigations, query logs in S3 with Amazon Athena. Partition projection keeps queries efficient across many days. `aws cloudtrail lookup-events` is handy for quick checks but limited to recent management events."]},{"h":"Why this is the answer","b":["Downloading and grepping files does not scale, Event History cannot reach back far, and CloudWatch metrics are not event-level. Athena lets you run SQL across months of logs with limited effort."]},{"h":"Remember it","b":["Quick look: lookup-events. Real investigation: Athena."]}]},{"id":"ce382381d4","q":"Why do you need pagination when calling CloudTrail from boto3?","a":"Responses return one page. Use the paginator or follow `NextToken`, or you silently miss events and your timeline is incomplete.","s":"Responses return one page, so you silently miss events without paginating","x":["boto3 retries pages automatically","Pagination only affects billing","Pagination encrypts the results"],"d":[{"h":"What it is","b":["CloudTrail and most AWS APIs return results in pages. A single call returns the first page and a token for the next."]},{"h":"Why this is the answer","b":["If you do not loop through pages, for example by using a paginator, you only see part of the data, silently. An incomplete timeline can lead you to the wrong conclusion about what happened."]},{"h":"Remember it","b":["One call is one page. Loop until the token runs out."]}]},{"id":"4dbd680c99","q":"How do you check whether an S3 bucket is exposed?","a":"Check Block Public Access settings, the bucket policy and ACLs, and IAM Access Analyzer findings for external access. Macie can tell you what sensitive data is inside.","s":"Block Public Access, bucket policy and ACLs, Access Analyzer; Macie for contents","x":["Check only the bucket name","Check only the region","Check only versioning status"],"d":[{"h":"What it is","b":["Check several layers.","- **Block Public Access** settings (account and bucket).","- The **bucket policy** and **ACLs**.","- **IAM Access Analyzer** findings for external access.","- **Macie** to see what sensitive data is inside."]},{"h":"Why this is the answer","b":["Exposure can come from any of these, and the bucket name, region or versioning status say nothing about access. Knowing what is inside tells you the severity."]},{"h":"Remember it","b":["Check the switches, the policies, the analyzer, then the contents."]}]},{"id":"cb56083220","q":"Containment vs eradication vs recovery","a":"Containment stops the spread. Eradication removes the attacker's access and artifacts. Recovery restores normal service and verifies it is clean.","s":"Stop the spread; remove access and artifacts; restore and verify","x":["Restore first; contain later; eradicate last","Eradicate first; recover; contain last","All three mean rebuilding the account"],"d":[{"h":"What it is","b":["- **Containment:** stop the spread or damage, usually quickly and often temporarily.","- **Eradication:** remove the attacker's access and artifacts, such as keys, users, backdoors.","- **Recovery:** restore normal operations and verify they are clean."]},{"h":"Why this is the answer","b":["The order matters. Restoring before containing, or eradicating before you understand the scope, lets the attacker return or hides what you needed to learn. None of them means simply rebuilding the whole account."]},{"h":"Remember it","b":["Stop it, remove it, restore it."]}]},{"id":"e7523e6919","q":"Evidence handling basics","a":"Preserve before you change (snapshots, log exports), hash what you collect, record who touched it and when, and work from copies.","s":"Preserve before changing, hash, record custody, work from copies","x":["Fix first and document later","Edit the originals to add notes","Share raw evidence widely for faster analysis"],"d":[{"h":"What it is","b":["Preserve evidence before you change anything, record a hash of what you collect, keep a chain of custody (who handled it and when), and analyze copies rather than originals."]},{"h":"Why this is the answer","b":["Changing systems first destroys information, editing originals ruins their value, and sharing raw evidence widely creates exposure and doubts about its integrity. Good handling keeps your findings credible, especially if legal action follows."]},{"h":"Remember it","b":["Snapshot, hash, document, and work from copies."]}]},{"id":"2427045312","q":"An access key was pushed to a public repo. What is the first containment action?","a":"Deactivate the key, then investigate what it did. Removing the commit does not help: assume it was already scraped.","s":"Deactivate the key, then investigate its usage","x":["Remove the commit from git history and wait","Rotate every key in the account","Make the repo private and move on"],"d":[{"h":"What it is","b":["Deactivate the key immediately, then investigate what it did."]},{"h":"Why this is the answer","b":["Automated scrapers find exposed keys within minutes, so assume it has already been used. Deleting the commit or making the repo private does not undo exposure. Rotating every key in the account is excessive before you know the scope."]},{"h":"Remember it","b":["Deactivate first. Clean up the repo later."]}]},{"id":"0d2ef47552","q":"How do you see everything an access key did?","a":"Search CloudTrail by AccessKeyId across all regions (lookup-events for recent activity, Athena for more).","s":"Search CloudTrail by AccessKeyId across all regions","x":["Check the key's creation date","Read the IAM user's console history","Query billing by service"],"d":[{"h":"What it is","b":["Search CloudTrail by the `AccessKeyId` in the event's user identity, in **every region**, using lookup-events for recent activity or Athena for more."]},{"h":"Why this is the answer","b":["The key's creation date or an IAM console history does not show actions, and billing shows spend, not API calls. CloudTrail is the record of API activity, and an attacker can act in any region."]},{"h":"Remember it","b":["CloudTrail by access key ID, all regions."]}]},{"id":"7884275088","q":"Which AWS tool lists resources shared outside your account or organization?","a":"IAM Access Analyzer.","s":"IAM Access Analyzer","x":["AWS Config conformance packs","Cost Explorer","Amazon Inspector"],"d":[{"h":"What it is","b":["IAM Access Analyzer finds resources, such as S3 buckets, IAM roles, KMS keys and snapshots, that are shared with principals outside your zone of trust."]},{"h":"Why this is the answer","b":["It uses reasoning about policies to flag external access, which is useful for finding exposure and for checking your work after an incident. Config conformance packs, Cost Explorer and Inspector have different jobs."]},{"h":"Remember it","b":["Access Analyzer answers: who outside can reach this?"]}]},{"id":"b518c82ab4","q":"How do you stop a compromised role from being assumed again?","a":"Tighten or remove the role's trust policy, and attach a deny for sessions issued before now (`aws:TokenIssueTime`).","s":"Edit the trust policy and deny sessions issued before now","x":["Change the role's name tag","Disable the console login","Remove the role from CloudTrail"],"d":[{"h":"What it is","b":["Edit or remove the role's trust policy, which controls who may assume it, and attach a deny for sessions issued before now using `aws:TokenIssueTime`."]},{"h":"Why this is the answer","b":["Changing the trust policy stops new sessions, and the deny kills existing ones. Renaming tags, disabling console login or editing CloudTrail do nothing about assumption."]},{"h":"Remember it","b":["Fix who may assume it, and cut off the sessions already out there."]}]},{"id":"926bc1bd71","q":"How do you protect log evidence from tampering?","a":"Object Lock (or MFA delete) on the log bucket, plus keeping it in a separate account with tightly limited write and delete rights.","s":"Object Lock or MFA delete, plus a separate account","x":["Compress the logs with gzip","Rename the bucket weekly","Turn on static website hosting"],"d":[{"h":"What it is","b":["Use **S3 Object Lock** (or MFA delete) on the log bucket, and keep it in a separate account with very limited write and delete rights."]},{"h":"Why this is the answer","b":["Object Lock makes objects immutable for a retention period, even for administrators. Compression, renaming and static hosting have no protective value."]},{"h":"Remember it","b":["Immutable storage in a separate account."]}]},{"id":"468a39b28b","q":"What are VPC Flow Logs good for in IR?","a":"Network metadata (who talked to whom, how much), useful for lateral movement and exfiltration. They do not contain packet contents.","s":"Network metadata, useful for lateral movement and exfiltration","x":["Full packet contents","API call history","IAM policy changes"],"d":[{"h":"What it is","b":["Flow logs record network metadata: source and destination addresses and ports, protocol, bytes and whether traffic was accepted or rejected."]},{"h":"Why this is the answer","b":["They show who talked to whom and how much, which helps trace lateral movement and data exfiltration. They do not contain packet contents, API calls or IAM changes."]},{"h":"Remember it","b":["Who talked to whom, not what was said."]}]},{"id":"943e130655","q":"What does `userIdentity.type` in a CloudTrail event tell you?","a":"Who or what made the call: IAMUser, AssumedRole, Root, AWSService, and so on.","s":"Whether the caller was an IAM user, assumed role, root, or an AWS service","x":["Which region the call ran in","How long the call took","Whether the call was billed"],"d":[{"h":"What it is","b":["It states what kind of principal made the call: `IAMUser`, `AssumedRole`, `Root`, `AWSService`, `FederatedUser`, and so on."]},{"h":"Why this is the answer","b":["It is the first thing to read when triaging an event. `Root` is a red flag, `AssumedRole` means you have to trace who assumed the role, and `AWSService` means AWS acted on someone's behalf. It does not say where the call ran, how long it took or whether it was billed."]},{"h":"Remember it","b":["The type tells you who or what acted."]}]},{"id":"3b6252bc7d","q":"How do you recognize an assumed-role session in CloudTrail?","a":"`userIdentity.type` is `AssumedRole` and the principal includes a session name. Trace it back to who assumed it through the AssumeRole event.","s":"userIdentity.type is AssumedRole and a session name is present","x":["The eventTime has a timezone offset","The awsRegion is global","The sourceIPAddress is a private address"],"d":[{"h":"What it is","b":["The user identity type is `AssumedRole`, and the principal ends in a session name (`.../role-name/session-name`)."]},{"h":"Why this is the answer","b":["Seeing that tells you the actor is a temporary session. To find the human or system behind it, look for the earlier `AssumeRole` event that created the session. Timezones, regions and private IPs have nothing to do with it."]},{"h":"Remember it","b":["AssumedRole plus a session name: find the AssumeRole call."]}]},{"id":"4e8ec830d3","q":"What does a `sourceIPAddress` like `cloudformation.amazonaws.com` mean?","a":"An AWS service made the call on someone's behalf. Find who triggered it (for example the CloudFormation stack's caller) rather than treating it as the actor.","s":"An AWS service made the call on someone's behalf","x":["The attacker used a VPN","The call came from the account's NAT gateway","The call is a replay"],"d":[{"h":"What it is","b":["When the source is an AWS service name rather than an IP address, the call was made by that service on behalf of a principal."]},{"h":"Why this is the answer","b":["The service is not the actor. Find who triggered it, for example the user who created the CloudFormation stack, from the corresponding event. Treating the service as the culprit sends you down the wrong path."]},{"h":"Remember it","b":["A service name as source means look for who asked the service."]}]},{"id":"d41db5d431","q":"What is Amazon Detective?","a":"A service that builds a graph of related activity (from CloudTrail, flow logs, and findings) so you can investigate a finding quickly.","s":"A graph of related activity for investigating findings","x":["A vulnerability scanner for EC2","A password manager","A DDoS protection service"],"d":[{"h":"What it is","b":["Detective builds a graph of related activity from sources such as CloudTrail, VPC Flow Logs and GuardDuty findings, so you can pivot between users, roles, IPs and resources."]},{"h":"Why this is the answer","b":["It speeds up investigating a finding by showing relationships and history in context. It is not a scanner, password manager or DDoS protection service."]},{"h":"Remember it","b":["Detective connects the dots around a finding."]}]},{"id":"cbb3a3b968","q":"What does Amazon Macie do?","a":"Discovers and classifies sensitive data in S3, so you know what an exposed bucket actually held.","s":"Discovers and classifies sensitive data in S3","x":["Blocks malicious IPs at the edge","Scans EC2 for malware","Rotates secrets"],"d":[{"h":"What it is","b":["Macie discovers and classifies sensitive data in S3, such as personal data and credentials."]},{"h":"Why this is the answer","b":["In an incident it answers: what was actually in the exposed bucket? That determines whether you have a reportable breach. It does not block IPs, scan servers for malware or rotate secrets."]},{"h":"Remember it","b":["Macie tells you what is in the bucket."]}]},{"id":"128e01d900","q":"Which GuardDuty finding means instance role credentials are used from outside AWS?","a":"`UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS`.","s":"UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS","x":["Backdoor:EC2/C&CActivity.B","Recon:IAMUser/ResourcePermissions","Stealth:IAMUser/CloudTrailLoggingDisabled"],"d":[{"h":"What it is","b":["`UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS`."]},{"h":"Why this is the answer","b":["Temporary credentials issued to an EC2 instance should only be used from that instance inside AWS. Use from an external IP means they were stolen, often through SSRF to the metadata service. The other findings listed are real but describe command-and-control, permission reconnaissance and logging being disabled."]},{"h":"Remember it","b":["Instance credentials used from outside AWS: exfiltrated."]}]},{"id":"deaedd7903","q":"How do you quickly quarantine a compromised IAM user?","a":"Attach an explicit deny-all policy, deactivate its keys, and revoke its sessions. Keep the user so the evidence and the audit trail stay intact.","s":"Attach deny-all, deactivate keys, and revoke sessions","x":["Delete the user to remove all access","Change only the console password","Move the user to a new group"],"d":[{"h":"What it is","b":["Attach an explicit deny-all policy, deactivate the user's access keys, and revoke any active sessions."]},{"h":"Why this is the answer","b":["Keep the user rather than deleting it, so evidence and the audit trail remain. Changing only the console password leaves keys working, and moving the user to another group does nothing about existing permissions."]},{"h":"Remember it","b":["Deny everything, kill the keys, keep the account for evidence."]}]},{"id":"99893ca31f","q":"Why does an explicit Deny matter in IAM?","a":"It overrides any Allow, which makes it the reliable way to contain a principal.","s":"It overrides any Allow","x":["It is ignored if a role allows the action","It only applies to the root user","It takes effect after 24 hours"],"d":[{"h":"What it is","b":["In IAM policy evaluation, an explicit Deny in any applicable policy overrides every Allow."]},{"h":"Why this is the answer","b":["That makes it the dependable tool for containment: no matter what permissions a principal has through other policies, a Deny stops the action. It is not ignored by roles and it applies to all principals. IAM is eventually consistent, so allow a few seconds for a new Deny to take effect."]},{"h":"Remember it","b":["Deny always wins."]}]},{"id":"a1337c5371","q":"Which logs show S3 object-level access?","a":"CloudTrail data events or S3 server access logs. Management events alone do not show who read or deleted an object.","s":"CloudTrail data events or S3 server access logs","x":["CloudTrail management events only","VPC Flow Logs","GuardDuty findings only"],"d":[{"h":"What it is","b":["CloudTrail **data events** for S3, or S3 server access logs."]},{"h":"Why this is the answer","b":["Management events alone show actions like creating a bucket or changing a policy, not who read or deleted an object. If neither data events nor access logs were on at the time, you may not be able to tell what was accessed, which is why enabling them on sensitive buckets matters before an incident."]},{"h":"Remember it","b":["To see objects, you needed data events turned on in advance."]}]}]},{"id":"detection_siem","title":"Detection engineering and SIEM data","desc":"The detection lifecycle, schemas, data lakes, SOAR, and measuring what you built.","cards":[{"id":"90f8d7afa0","q":"Detection engineering lifecycle","a":"Hypothesis (threat or ATT&CK technique) -> confirm the data source exists -> write the rule -> test it (emulation) -> tune -> deploy -> measure -> retire or revise.","s":"Hypothesis, data check, write, test, tune, deploy, measure, retire","x":["Write, deploy, wait for alerts, tune","Buy, install, configure, forget","Alert, triage, close, report"],"d":[{"h":"What it is","b":["Detection engineering treats detections as products with a life cycle.","- **Hypothesis:** a specific attacker behavior you want to catch.","- **Data check:** confirm the logs that would show it actually exist.","- **Write** the logic, **test** it, **tune** it, **deploy** it.","- **Measure** how it performs, and **retire or revise** it when it stops being useful."]},{"h":"Why this is the answer","b":["Skipping steps is how teams end up with noisy or dead rules. Starting with the data check avoids writing detections for logs you do not collect, and the final steps keep the set healthy over time. \"Buy, install, forget\" is the opposite of a life cycle."]},{"h":"Remember it","b":["Hypothesize, check data, build, test, tune, ship, measure, retire."]}]},{"id":"ed228b41ad","q":"What is detection-as-code?","a":"Rules live in version control with peer review, automated tests in CI, and a deploy pipeline, just like software.","s":"Rules in version control with review, tests, and a deploy pipeline","x":["Detections written directly in the SIEM UI","Detections stored in a spreadsheet","Only vendor-supplied detections"],"d":[{"h":"What it is","b":["Managing detection rules like software: stored in version control, reviewed by peers, tested automatically in CI, and deployed by a pipeline."]},{"h":"Why this is the answer","b":["Rules edited directly in a console have no history, review or tests, so a change can break detection without anyone noticing. With code you can see who changed what and why, roll back, and prove a rule still fires after a change."]},{"h":"Remember it","b":["Treat detections like code: review, test, deploy, roll back."]}]},{"id":"e518e1493d","q":"Sigma, YARA, Suricata: what does each cover?","a":"Sigma = vendor-neutral log detection rules (YAML), converted to SIEM queries. YARA = patterns in files and memory. Suricata/Snort = network traffic.","s":"Sigma: log rules. YARA: files and memory. Suricata: network traffic","x":["Sigma: files. YARA: logs. Suricata: memory","Sigma: network. YARA: logs. Suricata: files","All three are log query languages"],"d":[{"h":"What it is","b":["- **Sigma:** a vendor-neutral format (YAML) for **log** detection rules, which can be converted into queries for different SIEMs.","- **YARA:** rules that match patterns in **files and memory**, used for malware.","- **Suricata (and Snort):** rules for **network traffic**."]},{"h":"Why this is the answer","b":["Each looks at a different kind of evidence. Mixing them up leads you to write the wrong kind of rule, such as trying to detect a CloudTrail event with YARA."]},{"h":"Remember it","b":["Sigma = logs. YARA = files. Suricata = network."]}]},{"id":"bdf01bc323","q":"Precision vs recall for detections","a":"Precision = of the alerts fired, how many were real. Recall = of the real events, how many were caught. Raising one usually lowers the other; tune to the cost of missing versus the cost of noise.","s":"Precision: real among alerts fired. Recall: real events caught","x":["Precision: events caught. Recall: real among alerts fired","Precision: speed. Recall: memory use","They are the same measure"],"d":[{"h":"What it is","b":["- **Precision:** of the alerts that fired, how many were real threats.","- **Recall:** of the real threats that occurred, how many were caught."]},{"h":"Why this is the answer","b":["They pull against each other. Making a rule broader catches more (higher recall) but adds noise (lower precision), and tightening it does the opposite. The right balance depends on the cost of a miss versus the cost of noise for that particular threat."]},{"h":"Remember it","b":["Precision: are my alerts real? Recall: did I catch the real ones?"]}]},{"id":"f13268f2be","q":"The Pyramid of Pain, bottom to top","a":"Hash values, IP addresses, domain names, network/host artifacts, tools, TTPs. Detecting higher up costs the adversary more to evade.","s":"Hashes, IPs, domains, artifacts, tools, TTPs","x":["TTPs, tools, artifacts, domains, IPs, hashes","IPs, hashes, tools, domains, TTPs, artifacts","Hashes, tools, IPs, TTPs, artifacts, domains"],"d":[{"h":"What it is","b":["David Bianco's model ranks indicators by how much trouble it causes an attacker when you detect or block them. From easiest to hardest for the attacker to change: hash values, IP addresses, domain names, network and host artifacts, tools, and TTPs (tactics, techniques and procedures)."]},{"h":"Why this is the answer","b":["Blocking a file hash costs the attacker a recompile. Detecting their behavior forces them to change how they operate, which is expensive. It argues for investing in detections near the top of the pyramid."]},{"h":"Remember it","b":["Hashes are trivial to change; behavior is painful to change."]}]},{"id":"429206bc69","q":"What does Atomic Red Team give you?","a":"Small, scripted tests mapped to ATT&CK techniques, to check that a detection actually fires.","s":"Small ATT&CK-mapped tests to check that a detection fires","x":["A threat intelligence feed","A SOAR playbook library","A SIEM query language"],"d":[{"h":"What it is","b":["A library of small, scripted tests, each mapped to a MITRE ATT&CK technique, that you can run in a safe environment to see whether your detections fire."]},{"h":"Why this is the answer","b":["A detection that has never been tested is a guess. Atomic tests turn \"we think we cover this technique\" into evidence. It is a testing tool, not a threat feed, a playbook library or a query language."]},{"h":"Remember it","b":["Small attacks on demand to check your alarms."]}]},{"id":"e5a8186d8a","q":"Why is \"we have a rule for every technique\" not coverage?","a":"A technique has many procedures, and a rule needs a healthy data source, a test, and tuning to count. Measure tested, firing, and tuned detections, not rule counts.","s":"Techniques have many procedures; coverage needs healthy data, tests, and tuning","x":["A rule exists, so the technique is covered","Coverage equals the number of rules","Vendor rules always cover whole techniques"],"d":[{"h":"What it is","b":["Counting techniques with at least one rule overstates your ability to detect them."]},{"h":"Why this is the answer","b":["A technique can be executed in many ways (procedures), and a rule typically catches a few. A rule also needs working log sources, testing and tuning to be useful. Measure the share of detections that are tested, firing and tuned, not rule counts."]},{"h":"Remember it","b":["A rule is a claim. A tested rule is evidence."]}]},{"id":"b29962817f","q":"Why monitor log source health?","a":"A detection silently fails when its logs stop arriving. Alert on silence and on volume drops.","s":"Detections silently fail when their logs stop arriving","x":["Healthy sources reduce storage cost","It only satisfies a compliance checkbox","It speeds up queries"],"d":[{"h":"What it is","b":["Tracking that expected logs keep arriving, at the expected volume, from each source."]},{"h":"Why this is the answer","b":["Detections fail silently when their data stops. If a log forwarder breaks, the SIEM shows nothing wrong because nothing arrives. Alerting on silence or sharp volume drops catches that before an attacker takes advantage of it."]},{"h":"Remember it","b":["No logs does not mean no attacks."]}]},{"id":"16ceb86145","q":"OCSF and ECS","a":"Open Cybersecurity Schema Framework and Elastic Common Schema: shared field names so one detection works across many log sources.","s":"Shared field names so one detection works across many sources","x":["Two ticketing formats","Two encryption standards","Two SIEM vendors"],"d":[{"h":"What it is","b":["The Open Cybersecurity Schema Framework (OCSF) and the Elastic Common Schema (ECS) are standard sets of field names for security data."]},{"h":"Why this is the answer","b":["If every log source uses different names for the same thing (user, source IP), each detection needs custom logic per source. Normalizing to a shared schema lets one detection work across many sources and makes data easier to share and query."]},{"h":"Remember it","b":["Same field names across sources means write the rule once."]}]},{"id":"e57940e03c","q":"Layers of a security data lake","a":"Raw immutable landing zone, normalized layer (for example OCSF), and curated or enriched tables for detections and investigations.","s":"Raw immutable, normalized (OCSF), curated and enriched","x":["Hot, warm, and cold only","Primary, replica, backup","Ingest, queue, discard"],"d":[{"h":"What it is","b":["A common design has three layers.","- **Raw:** data as received, kept immutable.","- **Normalized:** converted to a common schema such as OCSF.","- **Curated or enriched:** cleaned, joined and shaped for detections and investigations."]},{"h":"Why this is the answer","b":["Keeping raw data lets you reprocess when parsers improve or mistakes are found. The normalized layer makes queries consistent, and the curated layer makes common questions fast and cheap."]},{"h":"Remember it","b":["Keep the original, standardize it, then shape it for use."]}]},{"id":"4bf8a7476c","q":"Why Parquet for security logs in S3?","a":"Columnar and compressed, so queries scan only needed columns. Partition by date and source to cut Athena cost and time.","s":"It is columnar and compressed; partition by date and source","x":["It is row-based and fast for single-row updates","It is plain text and easy to grep","It is encrypted by default"],"d":[{"h":"What it is","b":["Parquet is a **columnar**, compressed file format. Data is partitioned, for example by date and source."]},{"h":"Why this is the answer","b":["Queries on logs usually touch a few columns across many rows. Columnar storage lets engines like Athena read only the needed columns, and partitioning skips irrelevant files. Both cut cost and time compared with plain text or row-based formats."]},{"h":"Remember it","b":["Read less data and pay less to read it."]}]},{"id":"76276787e7","q":"Streaming detection vs querying the lake","a":"Streaming gives low latency for urgent detections and costs more. Scheduled lake queries are cheap and suit hunting and slower detections. Most programs use both.","s":"Streaming is low-latency and costs more; scheduled queries are cheaper","x":["Streaming is always cheaper","Lake queries are always faster","They cannot be combined"],"d":[{"h":"What it is","b":["- **Streaming:** evaluate events as they arrive, for low-latency alerts.","- **Querying the lake:** run scheduled queries over stored data."]},{"h":"Why this is the answer","b":["Streaming is faster but costs more to run and operate. Scheduled queries are cheaper and suit hunting and detections where minutes of delay are fine. Most programs use both, reserving streaming for the urgent cases."]},{"h":"Remember it","b":["Fast and pricey, or cheap and a little late. Use both."]}]},{"id":"42163e7304","q":"What is SOAR?","a":"Security orchestration, automation, and response: playbooks that enrich alerts, decide, act, and document, with human approval for destructive steps.","s":"Playbooks that enrich, decide, act, and document, with approvals for destructive steps","x":["A log storage tier","A vulnerability scanner","A phishing awareness program"],"d":[{"h":"What it is","b":["Security orchestration, automation and response: platforms that run playbooks which enrich an alert, make a decision, take an action, and document the outcome."]},{"h":"Why this is the answer","b":["It removes repetitive manual steps from triage and response. Destructive actions such as disabling an account should pass through human approval, and playbooks need testing like any other code."]},{"h":"Remember it","b":["Playbooks that do the routine work, with a person guarding the big actions."]}]},{"id":"ec771e44a4","q":"What does it mean to manage an MDR provider?","a":"You own escalation paths and SLAs, give tuning feedback, define who may take response actions, and review what they miss. They watch; you remain accountable.","s":"You own SLAs, tuning feedback, response authority, and reviewing what they miss","x":["You hand over accountability entirely","You only receive a monthly report","You stop writing detections"],"d":[{"h":"What it is","b":["A managed detection and response provider watches your environment and responds, but you stay accountable. Managing them means owning escalation paths and SLAs, giving tuning feedback, defining what actions they may take, and checking what they miss."]},{"h":"Why this is the answer","b":["Outsourcing monitoring does not outsource accountability. Handing over everything or only reading a monthly report leaves gaps no one is covering."]},{"h":"Remember it","b":["They watch. You stay responsible."]}]},{"id":"7a069a7eba","q":"SOC tiers","a":"Tier 1 triages alerts, tier 2 investigates and responds, tier 3 hunts, builds detections, and handles the hardest incidents.","s":"T1 triages; T2 investigates and responds; T3 hunts, builds detections, handles the hardest","x":["T1 hunts; T2 triages; T3 reports","T1 builds detections; T2 closes tickets; T3 escalates","T1 is the CISO; T2 is a manager; T3 is an analyst"],"d":[{"h":"What it is","b":["- **Tier 1:** triages alerts and escalates.","- **Tier 2:** investigates and responds.","- **Tier 3:** hunts, builds detections, and handles the hardest incidents."]},{"h":"Why this is the answer","b":["The tiers separate volume from depth so experts spend time where it matters. Many modern teams blur the tiers, but the progression from triage to investigation to engineering still describes the work."]},{"h":"Remember it","b":["Triage, investigate, engineer."]}]},{"id":"d1fb8e0a27","q":"MTTD and MTTR","a":"Mean time to detect and mean time to respond or resolve. Track them per incident type, and watch the tail, not just the mean.","s":"Mean time to detect, and to respond or resolve; watch the tail","x":["Mean time to deploy, and to restore; watch the average","Mean time to document, and to review","Mean threat density and risk"],"d":[{"h":"What it is","b":["Mean time to detect and mean time to respond (or resolve)."]},{"h":"Why this is the answer","b":["They show how quickly threats are noticed and handled. A mean can hide long tails: one incident that went unnoticed for months matters more than a hundred quick ones. Track them per incident type and watch the worst cases."]},{"h":"Remember it","b":["Averages hide the incidents that hurt."]}]},{"id":"8ebf2931a8","q":"What does a good alert runbook contain?","a":"What fired and why it matters, how to verify it, enrichment to pull, common false positives, containment steps, and when to escalate.","s":"What fired, how to verify, enrichment, false positives, containment, escalation","x":["Only the alert name","Only the analyst's phone number","Only the rule's regex"],"d":[{"h":"What it is","b":["What fired and why it matters, how to verify it, what enrichment to pull, common false positives, containment steps, and when to escalate."]},{"h":"Why this is the answer","b":["A runbook turns an alert into a repeatable decision. An alert name alone, a phone number or the rule's query leaves the analyst to improvise."]},{"h":"Remember it","b":["What is it, is it real, what next, who to call."]}]},{"id":"f6d8263a2e","q":"Where to start an AI enablement roadmap for detection and response","a":"Pick high-volume, low-risk, well-understood work first (alert summarization, enrichment, ticket drafting), measure against analyst verdicts, then expand autonomy only where the data supports it.","s":"High-volume, low-risk work first; measure against analysts; expand autonomy with data","x":["Give it full autonomous response on day one","Replace tier 1 immediately","Start with the highest-severity incidents"],"d":[{"h":"What it is","b":["Start with high-volume, low-risk, well-understood tasks such as summarizing alerts, enriching them and drafting tickets. Measure results against analyst verdicts, then expand autonomy only where the data supports it."]},{"h":"Why this is the answer","b":["Giving AI full autonomy on day one, replacing tier 1 immediately or starting with the most severe incidents puts risk first and evidence last. Earning trust with measurement lets you grow safely."]},{"h":"Remember it","b":["Start small and measured; grow autonomy as evidence grows."]}]},{"id":"d60c4ef284","q":"What is a baseline in detection work?","a":"Normal behavior to compare against, such as the usual callers, hours, and volumes for an API. Anomaly detections need one.","s":"Normal behavior to compare against","x":["A list of banned IP addresses","A required SIEM license tier","A saved SOAR playbook"],"d":[{"h":"What it is","b":["A description of normal behavior, such as which principals usually call an API, at what hours and in what volume."]},{"h":"Why this is the answer","b":["Anomaly-based detections only make sense relative to normal. Without a baseline you cannot tell a new but legitimate pattern from an attack. A list of banned IPs or a saved playbook is something different."]},{"h":"Remember it","b":["You can only spot abnormal if you know normal."]}]},{"id":"8050067113","q":"What makes a good detection hypothesis?","a":"A specific adversary behavior, the data that would show it, and a clear idea of what normal looks like.","s":"A specific behavior, the data that shows it, and what normal looks like","x":["A rule name and a severity","A copy of a vendor rule","A list of tools to block"],"d":[{"h":"What it is","b":["A specific adversary behavior, the data that would reveal it, and an idea of what normal looks like."]},{"h":"Why this is the answer","b":["It focuses the work on something testable. A rule name plus a severity, a copy of a vendor rule or a list of tools to block does not say what you are trying to catch or how you would know."]},{"h":"Remember it","b":["Behavior, evidence, and what normal looks like."]}]},{"id":"12606b1c8d","q":"How do you cut false positives without losing the detection?","a":"Tune with context (allowlist known-good by identity, role, or asset) instead of deleting the rule or raising thresholds blindly.","s":"Tune with context, such as allowlisting known-good identities","x":["Raise the threshold until nothing fires","Disable the rule at night","Send alerts to a muted channel"],"d":[{"h":"What it is","b":["Tune with context: allowlist known-good by identity, role or asset, or add conditions that distinguish benign from malicious cases."]},{"h":"Why this is the answer","b":["Raising the threshold until nothing fires, disabling the rule at night or muting the channel reduces noise by removing the detection. Contextual tuning keeps coverage and removes only the known harmless cases."]},{"h":"Remember it","b":["Tune out the known-good, not the detection."]}]},{"id":"11a2b4e84e","q":"What is alert enrichment?","a":"Adding context to an alert, such as asset owner, identity, geolocation, and threat intelligence, so triage is faster and better.","s":"Adding context such as asset owner, identity, geo, and threat intel","x":["Making the alert louder","Translating it to JSON","Archiving it to cold storage"],"d":[{"h":"What it is","b":["Adding context to an alert, such as the asset's owner, the user's role, geolocation, and threat intelligence on the indicators involved."]},{"h":"Why this is the answer","b":["It lets the analyst judge an alert without hunting for background in five tools, speeding triage and improving accuracy. Making the alert louder or changing its format does not add information."]},{"h":"Remember it","b":["Context turns an alert into a decision."]}]},{"id":"622929f7f8","q":"Which CloudTrail events make high-signal alerts?","a":"`StopLogging`, `DeleteTrail`, root account use, and console logins without MFA. They are rare and meaningful.","s":"StopLogging, DeleteTrail, root use, console login without MFA","x":["Every DescribeInstances call","Every successful GetObject","Any call from a new browser"],"d":[{"h":"What it is","b":["Rare, meaningful events: `StopLogging`, `DeleteTrail`, root account use, and console sign-ins without MFA."]},{"h":"Why this is the answer","b":["They indicate defense evasion or high-risk access and rarely occur legitimately. Alerting on every `DescribeInstances` or every successful `GetObject` would flood analysts with normal activity."]},{"h":"Remember it","b":["Alert on the rare and dangerous, not the common and routine."]}]},{"id":"24d0a10281","q":"What is a canary token and why use it?","a":"A decoy credential or file that alerts when touched. Real users never touch it, so false positives are almost zero.","s":"A decoy credential that alerts when touched, with almost no false positives","x":["A token that speeds up logins","A rate-limit token","A backup encryption key"],"d":[{"h":"What it is","b":["A decoy credential, file or link that alerts when someone touches it."]},{"h":"Why this is the answer","b":["Real users and processes have no reason to use it, so any touch is suspicious. That makes false positives almost nonexistent, and a fake access key sitting where an attacker would look is a cheap, effective tripwire."]},{"h":"Remember it","b":["If nobody should touch it, any touch is signal."]}]},{"id":"9c8d9b7270","q":"Which measures show alert fatigue?","a":"Alerts per analyst, time to triage, and the share closed as false positive.","s":"Alerts per analyst, time to triage, and share closed as false positive","x":["Only total alerts per day","Number of rules deployed","Dashboard views"],"d":[{"h":"What it is","b":["Alerts per analyst, time to triage, and the share of alerts closed as false positives."]},{"h":"Why this is the answer","b":["These show whether people are overwhelmed and whether alerts are worth reading. Total alerts per day or number of rules deployed say nothing about workload or quality."]},{"h":"Remember it","b":["Measure the humans' workload and the alerts' usefulness."]}]},{"id":"9b10539968","q":"What is \"detection debt\"?","a":"Rules left untested, untuned, or without owners that quietly decay and either flood analysts or stop working.","s":"Rules left untested, untuned, or ownerless that decay quietly","x":["Money owed to the SIEM vendor","Unused log storage","Unpaid analyst overtime"],"d":[{"h":"What it is","b":["A backlog of detections that are untested, untuned or without owners, which slowly decay."]},{"h":"Why this is the answer","b":["Like technical debt, it accumulates quietly: rules start flooding analysts or stop working as environments change. Regular review, ownership and tests keep it in check."]},{"h":"Remember it","b":["Unowned rules rot."]}]},{"id":"8ce4c4550a","q":"Hunting vs detecting","a":"A hunt is a human-led search for what rules miss. A detection is automated and repeatable. Good hunts become detections.","s":"A hunt is human-led exploration; a detection is automated and repeatable","x":["A hunt is automated; a detection is human-led","They are the same thing","A hunt only happens after an incident"],"d":[{"h":"What it is","b":["A **hunt** is a human-led search for threats that rules missed. A **detection** is an automated, repeatable rule."]},{"h":"Why this is the answer","b":["They work together: a successful hunt should become a detection so the same threat is caught automatically next time. Hunting only after an incident, or treating the two as the same thing, loses that loop."]},{"h":"Remember it","b":["Hunt to discover; detect to repeat."]}]},{"id":"a42d410608","q":"Why keep detections and their tests together?","a":"A change can be validated before deploy, and regressions are caught automatically.","s":"Changes can be validated and regressions caught before deploy","x":["It saves disk space","It hides rules from analysts","It satisfies the SIEM license"],"d":[{"h":"What it is","b":["Store each rule alongside the test data or emulation that proves it fires."]},{"h":"Why this is the answer","b":["You can validate a change before deploying it and catch regressions automatically when something upstream changes, such as a log format. Disk space and licensing have nothing to do with it."]},{"h":"Remember it","b":["A rule with its test can be changed safely."]}]}]},{"id":"python_security","title":"Python for security work","desc":"Beginner-friendly: the language basics, and the security traps attached to them.","cards":[{"id":"4b186febe2","q":"Why use a virtual environment?","a":"It isolates a project's dependencies (`python3 -m venv .venv`). It avoids version clashes and keeps global installs from becoming an unpinned supply chain.","s":"It isolates dependencies and avoids unpinned global installs","x":["It makes Python run faster","It encrypts your code","It installs Python system-wide"],"d":[{"h":"What it is","b":["A virtual environment is a private folder of installed packages for one project. You create it with `python3 -m venv .venv` and activate it, and `pip install` then puts packages there instead of system-wide."]},{"h":"Why this is the answer","b":["Different projects need different versions of libraries, and installing everything globally causes clashes. It is also a security habit: you know exactly which packages a project uses (and can pin them), instead of an unpredictable pile that anything could depend on. It does not speed Python up or encrypt anything."]},{"h":"Remember it","b":["One project, one set of packages, nothing leaking between them."]}]},{"id":"435b34bf24","q":"`with open(path) as f:` why?","a":"It closes the file for you, even if an exception occurs.","s":"It closes the file for you, even on exceptions","x":["It makes the file read-only","It encrypts the file","It loads the whole file into memory"],"d":[{"h":"What it is","b":["`with` runs a block of code and guarantees cleanup when the block ends, even if an error occurs. For files, the cleanup is closing the file."]},{"h":"Why this is the answer","b":["Without it, an exception can leave files open, which leaks file handles and can leave data unwritten. The `with` form closes the file for you every time. It does not make the file read-only, encrypt it or load it into memory."]},{"h":"Remember it","b":["`with` means \"clean up for me, no matter what\"."]}]},{"id":"22480fcbe2","q":"`d[\"key\"]` vs `d.get(\"key\")`","a":"Indexing raises `KeyError` if the key is missing. `.get` returns `None` (or a default you provide).","s":"Indexing raises KeyError; .get returns None or a default","x":["Indexing returns None; .get raises KeyError","They are identical",".get modifies the dict"],"d":[{"h":"What it is","b":["Both read a value from a dictionary.","- `d[\"key\"]` raises a `KeyError` if the key is missing.","- `d.get(\"key\")` returns `None` (or a default you give, like `d.get(\"key\", 0)`) instead."]},{"h":"Why this is the answer","b":["Security data is messy: events often lack fields. Indexing directly can crash your script on the first odd record. `.get` lets you handle missing fields deliberately. Note that silently using a default can also hide problems, so decide what a missing value should mean."]},{"h":"Remember it","b":["Brackets fail loudly; `.get` is forgiving."]}]},{"id":"b47d1848b6","q":"Write a list comprehension that keeps the even numbers.","a":"`[n for n in numbers if n % 2 == 0]`","s":"`[n for n in numbers if n % 2 == 0]`","x":["`[n if n % 2 == 0 for n in numbers]`","`[for n in numbers if n % 2 == 0: n]`","`{n for n in numbers where n % 2 == 0}`"],"d":[{"h":"What it is","b":["A list comprehension builds a list in one line: `[expression for item in items if condition]`."]},{"h":"Why this is the answer","b":["For the even numbers, it is `[n for n in numbers if n % 2 == 0]`. Read it as \"give me n, for each n in numbers, if n divided by 2 leaves remainder 0\". The wrong forms put `if` or `for` in an order Python does not accept. The same pattern filters log events: `[e for e in events if e[\"severity\"] == \"high\"]`."]},{"h":"Remember it","b":["What to keep, for each item, if the test passes."]}]},{"id":"bc552e74ca","q":"What is `if __name__ == \"__main__\":` for?","a":"Code under it runs when the file is executed directly, not when it is imported.","s":"Code under it runs when the file is executed directly, not imported","x":["Code under it runs only when imported","Code under it runs on every function call","It marks the file as a package"],"d":[{"h":"What it is","b":["Every Python file has a built-in name. When you run it directly, the name is `\"__main__\"`. When another file imports it, the name is the module's name."]},{"h":"Why this is the answer","b":["The block under the `if` runs only when the file is executed directly. That lets one file be both a script and a set of functions other code can import, without the script part running unexpectedly. It does not mark a package or run on every function call."]},{"h":"Remember it","b":["\"Only run this if I was started directly.\""]}]},{"id":"2e0f5ed608","q":"boto3 client vs resource","a":"A client mirrors the AWS API one-to-one and gets new features. A resource is an object-oriented wrapper that is no longer receiving new features. Prefer clients.","s":"A client mirrors the API and gets new features; a resource is object-oriented and frozen","x":["A resource mirrors the API; a client is object-oriented","A client works only for S3","They are identical"],"d":[{"h":"What it is","b":["boto3 is the AWS library for Python.","- A **client** (`boto3.client(\"s3\")`) maps one-to-one to the AWS API and returns dictionaries.","- A **resource** is an object-oriented wrapper, convenient but no longer receiving new features."]},{"h":"Why this is the answer","b":["Clients cover every API call and are what you see in AWS documentation, so the examples you read translate directly. Prefer clients for new work, especially for security and IR scripts, which call many different APIs."]},{"h":"Remember it","b":["Client mirrors the API. Resource is a frozen convenience layer."]}]},{"id":"1ecf3a3e43","q":"Why must you paginate AWS API calls?","a":"Each call returns one page. Use `client.get_paginator(\"name\")` or follow `NextToken`, otherwise you silently get partial data.","s":"Each call returns one page, so use a paginator or NextToken","x":["boto3 merges all pages automatically","Only S3 paginates","Pagination is a billing feature"],"d":[{"h":"What it is","b":["Many AWS calls return a limited number of results per call, along with a token for the next batch. Collecting everything means calling repeatedly. boto3 provides paginators, for example `client.get_paginator(\"lookup_events\")`."]},{"h":"Why this is the answer","b":["Skipping pagination returns only the first page and gives no error. In incident response that means an incomplete timeline and possibly a wrong conclusion. boto3 does not merge pages automatically."]},{"h":"Remember it","b":["If you do not loop through pages, you silently miss data."]}]},{"id":"ede2869a5a","q":"How do you catch a specific AWS error?","a":"`except botocore.exceptions.ClientError as e:` then read `e.response[\"Error\"][\"Code\"]`.","s":"`except ClientError as e:` then `e.response[\"Error\"][\"Code\"]`","x":["`except AWSError as e:` then `e.code`","`except Exception:` then `str(e)[:10]`","`except boto3.Error:` then `e.errno`"],"d":[{"h":"What it is","b":["boto3 raises `botocore.exceptions.ClientError` when AWS returns an error. The specific error is in `e.response[\"Error\"][\"Code\"]`, such as `AccessDenied` or `NoSuchBucket`."]},{"h":"Why this is the answer","b":["Catching `ClientError` and checking the code lets you respond differently to different problems (for example, skip a bucket you cannot read but fail on something unexpected). Using invented exception names or catching everything hides what really happened."]},{"h":"Remember it","b":["Catch ClientError, then read the error code."]}]},{"id":"c179045b4c","q":"Why is a bare `except:` a problem?","a":"It catches everything, including bugs and Ctrl-C, and hides failures. Catch the specific exceptions you expect.","s":"It catches everything, hiding bugs and Ctrl-C","x":["It is slower than specific excepts","It only works inside functions","It disables logging"],"d":[{"h":"What it is","b":["A bare `except:` catches every exception, including ones you did not anticipate and even Ctrl-C."]},{"h":"Why this is the answer","b":["It hides bugs and failures, so your script may carry on as if everything worked. In security tooling, silently skipping an error can mean silently skipping evidence. Catch the specific exceptions you expect and let the rest surface."]},{"h":"Remember it","b":["Catch what you expect; let surprises be loud."]}]},{"id":"6304792f83","q":"`subprocess.run([\"ls\", path])` vs `subprocess.run(f\"ls {path}\", shell=True)`","a":"The list form passes arguments directly. The `shell=True` string form lets a crafted `path` inject extra commands (command injection).","s":"The list form passes arguments directly; shell=True with a string allows injection","x":["shell=True is safer because it escapes input","The list form runs through a shell","Both are identical"],"d":[{"h":"What it is","b":["`subprocess` runs other programs.","- With a **list**, each item is passed directly as an argument.","- With `shell=True` and a **string**, the whole string is interpreted by a shell."]},{"h":"Why this is the answer","b":["If `path` contains `; rm -rf /` or `$(curl evil)`, the shell version runs it: command injection. The list version treats it as just a strange filename. Prefer lists and avoid `shell=True` with any input you do not fully control."]},{"h":"Remember it","b":["Lists pass data. Shell strings run commands."]}]},{"id":"5ea3b17500","q":"Which functions are dangerous on untrusted input?","a":"`eval`, `exec`, `pickle.load` (code execution on load), and `yaml.load` without a safe loader. Use `json.loads` and `yaml.safe_load`.","s":"eval, exec, pickle.load, yaml.load","x":["json.loads, yaml.safe_load","len, sum, print","open, close, read"],"d":[{"h":"What it is","b":["- `eval` and `exec` run text as Python code.","- `pickle.load` can run code while rebuilding an object.","- `yaml.load` (without a safe loader) can construct arbitrary objects."]},{"h":"Why this is the answer","b":["All of them let the data decide what code runs. For untrusted input use data-only parsers: `json.loads` and `yaml.safe_load`. Functions like `len`, `sum` or `print` are harmless."]},{"h":"Remember it","b":["If it can turn data into code, don't point it at strangers' data."]}]},{"id":"2ecb3b0df4","q":"How do you avoid SQL injection in Python?","a":"Parameterized queries: `cur.execute(\"SELECT ... WHERE id = ?\", (user_id,))`. Never build the query with f-strings.","s":"Parameterized queries","x":["f-strings with quoting","String concatenation followed by strip()","Regex filtering of the input"],"d":[{"h":"What it is","b":["Use **parameterized queries**: the query text has placeholders, and values are passed separately, for example `cur.execute(\"SELECT * FROM users WHERE id = ?\", (user_id,))`."]},{"h":"Why this is the answer","b":["The database treats the value strictly as data, so quotes or SQL fragments in it cannot change the query. Building the query with f-strings, concatenation or regex cleaning leaves gaps."]},{"h":"Remember it","b":["Placeholders, never string-building."]}]},{"id":"6967baf7dc","q":"`random` vs `secrets`","a":"`random` is predictable and not for security. Use `secrets` for tokens and keys.","s":"random is predictable; use secrets for tokens and keys","x":["secrets is predictable; use random","They are the same module","random is for security; secrets is for games"],"d":[{"h":"What it is","b":["`random` is a pseudo-random generator meant for simulations and games, and its output can be predicted. `secrets` draws from the operating system's secure source."]},{"h":"Why this is the answer","b":["Anything an attacker must not guess, such as tokens, passwords or keys, needs `secrets` (for example `secrets.token_urlsafe(32)`). Using `random` for those makes them guessable."]},{"h":"Remember it","b":["random for games, secrets for secrets."]}]},{"id":"16b2684135","q":"Where do API keys and webhook URLs belong?","a":"Environment variables or a secrets manager, never in source or git. A Slack webhook URL is a secret.","s":"Environment variables or a secrets manager","x":["Hardcoded in the source","In a public config file","In a comment next to the call"],"d":[{"h":"What it is","b":["In environment variables or a secrets manager, read at runtime, never written into source code."]},{"h":"Why this is the answer","b":["Code gets committed, shared and logged. A secret in it will leak. A Slack webhook URL counts as a secret too, because anyone with it can post as you. Keep them out of public config files and comments."]},{"h":"Remember it","b":["Secrets live outside the code."]}]},{"id":"678026262a","q":"Why does `requests.get(url)` need `timeout=`?","a":"There is no default timeout, so a stalled server can hang your script forever.","s":"There is no default timeout, so a stalled server can hang forever","x":["The default timeout is 1 second","The default timeout is 30 seconds","Timeouts only matter for HTTPS"],"d":[{"h":"What it is","b":["By default, the `requests` library waits **forever** for a response."]},{"h":"Why this is the answer","b":["A slow or stalled server can hang your script indefinitely, which is a problem for automation and for response tooling. Pass `timeout=10` (seconds) so a failure is reported instead of a freeze. The default is not 1 or 30 seconds, and it applies to HTTP as well as HTTPS."]},{"h":"Remember it","b":["No timeout means it may wait forever."]}]},{"id":"afd47dcaaf","q":"`logging` vs `print`","a":"Logging has levels, formats, and handlers, and can go to files or a collector. Never log secrets or tokens.","s":"Logging has levels and handlers; never log secrets","x":["Print is faster and safer","Logging is only for libraries","They are identical"],"d":[{"h":"What it is","b":["`logging` has levels (debug, info, warning, error), formats, and handlers that send messages to files or collectors. `print` just writes text to the screen."]},{"h":"Why this is the answer","b":["For anything you run repeatedly or in automation, logging gives timestamps, severity and the ability to route and filter messages. Whatever you use, never log secrets or tokens, because logs are widely read and stored."]},{"h":"Remember it","b":["Use logging for tools; never log secrets."]}]},{"id":"af8f800fb1","q":"`json.loads` vs `json.dumps`","a":"`loads` turns a JSON string into Python objects. `dumps` turns Python objects into a JSON string.","s":"loads parses JSON text into objects; dumps serializes objects to text","x":["loads writes to a file; dumps reads from a file","They are identical","loads is for lists; dumps is for dicts"],"d":[{"h":"What it is","b":["- `json.loads(text)` turns a JSON **string** into Python objects (the \"s\" stands for string).","- `json.dumps(obj)` turns Python objects into a JSON **string**."]},{"h":"Why this is the answer","b":["You use `loads` to read an event or API response and `dumps` to produce JSON to send or save. They are opposites, and mixing them up is a common beginner error. File versions are `json.load` and `json.dump`."]},{"h":"Remember it","b":["loads = string to object. dumps = object to string."]}]},{"id":"3c43ddedb1","q":"Why use timezone-aware datetimes?","a":"Logs and incidents span timezones. Use `datetime.now(timezone.utc)`; naive datetimes cause wrong timelines.","s":"Logs span timezones; use datetime.now(timezone.utc)","x":["Naive datetimes are faster and fine","UTC is deprecated","Local time is always correct"],"d":[{"h":"What it is","b":["A naive datetime has no timezone attached. An aware one does, such as `datetime.now(timezone.utc)`."]},{"h":"Why this is the answer","b":["Logs and incidents span timezones and daylight-saving changes. Comparing naive times can silently put events in the wrong order, which corrupts a timeline. Use UTC internally and convert only for display."]},{"h":"Remember it","b":["Timelines are in UTC."]}]},{"id":"4aec768e31","q":"How do you stop path traversal when joining user input to a directory?","a":"`Path(base, user_input).resolve()` and check the result is still inside `base` (for example with `is_relative_to`).","s":"Resolve the path and check it is still inside the base directory","x":["Strip the string \"..\" from the input","Check the file extension","Call os.system(\"realpath\")"],"d":[{"h":"What it is","b":["Path traversal is input like `../../etc/passwd` escaping the folder you meant to restrict access to."]},{"h":"Why this is the answer","b":["Strip-based fixes miss encodings and tricks. A reliable approach is to **resolve** the final path (turn it into an absolute path with links and `..` collapsed) and check it is still inside the base directory, for example with `Path.resolve()` and `is_relative_to`."]},{"h":"Remember it","b":["Resolve first, then verify it is still inside the allowed folder."]}]},{"id":"1135de177f","q":"Mutable default argument trap","a":"`def f(items=[])` reuses one list across calls. Use `items=None` and create the list inside.","s":"The default list is shared across calls; use None instead","x":["It is copied on each call","Python forbids it","It is faster"],"d":[{"h":"What it is","b":["In `def f(items=[])`, the default list is created **once**, when the function is defined, not on each call."]},{"h":"Why this is the answer","b":["Every call that uses the default shares the same list, so data from earlier calls appears in later ones. In a tool processing events, that can leak one record into another. The fix is `def f(items=None):` and then `items = [] if items is None else items`."]},{"h":"Remember it","b":["Defaults are made once. Use None and build inside."]}]},{"id":"fd3d7a2099","q":"What does `yield` do and why is it useful for logs?","a":"It makes a generator that produces items one at a time, so you can process huge files without loading them into memory.","s":"It makes a generator that produces items one at a time without loading everything","x":["It returns a list of all items","It stops the program","It makes a function asynchronous"],"d":[{"h":"What it is","b":["A function with `yield` becomes a **generator**: it hands back one item at a time and pauses until asked for the next."]},{"h":"Why this is the answer","b":["Log files can be huge. A generator lets you process them line by line without loading everything into memory. It does not return a full list or stop the program."]},{"h":"Remember it","b":["One item at a time, memory stays small."]}]},{"id":"d6893db7f3","q":"Shape of an AWS Lambda handler in Python","a":"`def handler(event, context):` returning a result. Give it a least-privilege execution role and a sensible timeout.","s":"`def handler(event, context):`","x":["`def main(args, kwargs):`","`def lambda_handler():`","`def run(request):`"],"d":[{"h":"What it is","b":["`def handler(event, context):`. Lambda calls this function with `event` (the input data, such as an EventBridge finding) and `context` (runtime information)."]},{"h":"Why this is the answer","b":["The two parameters are required by the Lambda interface, whatever you name the function in configuration. Give the function a least-privilege execution role and a sensible timeout."]},{"h":"Remember it","b":["event in, context alongside, result out."]}]},{"id":"437d894fc5","q":"Minimal pytest test","a":"A function named `test_something()` that uses a plain `assert`, in a file named `test_*.py`. Run with `pytest`.","s":"A `test_*` function with a plain `assert`","x":["A class that must inherit TestCase","A `main()` with print statements","A `try/except` around the code"],"d":[{"h":"What it is","b":["A function whose name starts with `test_`, in a file named `test_*.py`, that uses a plain `assert`. Run it with `pytest`."]},{"h":"Why this is the answer","b":["pytest finds tests by naming convention and reports failed asserts with detail. You do not need a special class or print statements. Tests let you change security tooling without fear of silently breaking it."]},{"h":"Remember it","b":["test_ name, plain assert."]}]},{"id":"a5b89850ec","q":"Type hints: do they enforce anything at runtime?","a":"No. They document intent and let tools like mypy catch errors before you run the code.","s":"No, they do not enforce anything at runtime","x":["Yes, wrong types raise TypeError","Yes, but only for functions","Only in strict mode"],"d":[{"h":"What it is","b":["Type hints, like `def f(x: int) -> str:`, annotate what types you intend."]},{"h":"Why this is the answer","b":["Python ignores them when running. They help readers and tools such as mypy and your editor catch mistakes before you run the code. Passing the wrong type does not raise an error just because of the hint."]},{"h":"Remember it","b":["Hints are documentation that tools can check."]}]},{"id":"52e276b49f","q":"How do you check your dependencies for known vulnerabilities?","a":"`pip-audit` against your requirements, and pin versions (ideally with hashes).","s":"`pip-audit`, plus pinned versions","x":["`pip freeze` alone","`python -m venv`","`pip check` only"],"d":[{"h":"What it is","b":["`pip-audit` compares your installed or listed packages with known vulnerability databases. Pinning versions makes the result reproducible."]},{"h":"Why this is the answer","b":["Your project is only as safe as its dependencies. `pip freeze` lists packages but does not check them, `venv` creates an environment, and `pip check` only tests compatibility."]},{"h":"Remember it","b":["Pin them, then audit them."]}]},{"id":"94cb1151c9","q":"What does `enumerate(items)` give you?","a":"Pairs of (index, item), so you can loop with a counter without managing it yourself.","s":"Pairs of index and item","x":["Only the items, sorted","A copy of the list","The list reversed"],"d":[{"h":"What it is","b":["`enumerate` wraps a list and yields `(index, item)` pairs: `for i, event in enumerate(events):`."]},{"h":"Why this is the answer","b":["It gives you a counter without managing it yourself. It does not sort, copy or reverse the list. It is handy for reporting which record caused a problem."]},{"h":"Remember it","b":["Index and item together."]}]},{"id":"3648a607d7","q":"How do you read an environment variable safely?","a":"`os.environ.get(\"NAME\")` and handle the missing case explicitly. Indexing raises `KeyError` if it is unset.","s":"`os.environ.get(\"NAME\")` and handle the missing case","x":["`os.environ[\"NAME\"]` and hope it exists","`open(\".env\").read()` in every module","`input(\"NAME\")` at startup"],"d":[{"h":"What it is","b":["`os.environ.get(\"NAME\")` returns `None` if the variable is unset. `os.environ[\"NAME\"]` raises a `KeyError`."]},{"h":"Why this is the answer","b":["Handle the missing case on purpose: stop with a clear message if a required secret is not set, instead of crashing mysteriously or continuing with an empty value. Do not read secrets from files committed to the repo."]},{"h":"Remember it","b":["Use `.get` and decide what a missing value means."]}]},{"id":"cb0b0d96b0","q":"What does `sorted(d.items(), key=lambda kv: kv[1], reverse=True)` do?","a":"Sorts a dict's (key, value) pairs by value, largest first, which is handy for \"top talkers\".","s":"Sorts a dict's pairs by value, largest first","x":["Sorts by key, smallest first","Sorts the values in place","Removes duplicate values"],"d":[{"h":"What it is","b":["`d.items()` gives (key, value) pairs. `sorted` orders them, `key=lambda kv: kv[1]` says to sort by the value (item 1 of each pair), and `reverse=True` puts the largest first."]},{"h":"Why this is the answer","b":["It produces a \"top N\" list, such as the IPs with the most requests. Sorting by key would use `kv[0]`, and `sorted` does not change the dictionary in place."]},{"h":"Remember it","b":["`kv[1]` is the value; `reverse=True` is biggest first."]}]},{"id":"52a9c75835","q":"What is `collections.Counter` good for?","a":"Counting things, such as events per user or requests per IP, with `.most_common(n)` for the top results.","s":"Counting things, such as events per user or per IP","x":["Encrypting counters","Running code on a timer","Limiting loop iterations"],"d":[{"h":"What it is","b":["`Counter` counts how many times each item appears: `Counter(ips).most_common(5)`."]},{"h":"Why this is the answer","b":["Counting is constant in security work: events per user, requests per IP, failures per account. `Counter` does it in one line and `most_common` gives the top results."]},{"h":"Remember it","b":["Count things, then ask for the top few."]}]},{"id":"974e3d3e9b","q":"What does `try/finally` guarantee?","a":"The `finally` block runs whether or not an error occurred, which is where cleanup belongs.","s":"The finally block runs whether or not an error occurred","x":["Errors are always hidden","The try block runs twice","The program exits afterward"],"d":[{"h":"What it is","b":["The code in `finally` runs whether the `try` block succeeded or raised an exception."]},{"h":"Why this is the answer","b":["It is where cleanup belongs: closing connections, removing temporary files, releasing locks. Th
